name: CPU tests and course checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.experiments.part01 --skip-tests
      - run: python -m zero2vllm quant-demo --output .local/runs/part-09-quantization/04-quantization-kernels/int4.json
      - run: python -m scripts.docs.course --check
      - run: python -m scripts.docs.layout

  pytorch-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 numpy==2.2.6 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m scripts.experiments.lesson0201
      - run: python -m zero2vllm torch-demo --dtype float32 --output .local/runs/part-02-engine/01-pytorch-model/cli-float32.json
      - run: python docs/chapters/part-02-engine/01-pytorch-model/examples/run.py
