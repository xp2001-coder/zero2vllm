<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="714" viewBox="0 0 1200 714" role="img" aria-labelledby="title desc"><title id="title">命中块容量不能重复计算</title><desc id="desc">两个空闲块都作为命中前缀时，没有第三块写第九个位置；增加一个块后才能准入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="714" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">前缀命中了，为什么还会放不下？</text><text x="30" y="79" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">块长 4；请求长度 9；前 8 个位置命中两块，最后 1 个位置仍要计算</text><rect x="25" y="111" width="550" height="429" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="625" y="111" width="550" height="429" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="48" y="154" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">① 只有两个空闲块</text><text x="648" y="154" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">② 再多一个空闲块</text><rect x="49" y="191" width="140" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="119" y="229.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">块 1</text><text x="119" y="281" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">命中前缀</text><rect x="209" y="191" width="140" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="279" y="229.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">块 2</text><text x="279" y="281" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">命中前缀</text><text x="49" y="337" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">F = 2；零引用命中 E = 2</text><text x="49" y="366" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">新增需求 D = 1</text><text x="49" y="395" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">真正剩余：F − E = 0</text><rect x="49" y="450" width="499" height="59" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="298.5" y="487.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">1 &gt; 0：分配失败</text><rect x="649" y="191" width="140" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="719" y="229.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">块 1</text><text x="719" y="281" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">命中前缀</text><rect x="809" y="191" width="140" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="879" y="229.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">块 2</text><text x="879" y="281" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">命中前缀</text><rect x="969" y="191" width="140" height="59" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1039" y="229.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">块 3</text><text x="1039" y="281" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">可写尾部</text><text x="649" y="337" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">F = 3；零引用命中 E = 2</text><text x="649" y="366" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">新增需求 D = 1</text><text x="649" y="395" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">真正剩余：F − E = 1</text><rect x="649" y="450" width="499" height="59" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="898.5" y="487.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">1 ≤ 1：分配成功</text><text x="48" y="583" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">命中块若原本 ref_cnt = 0，touch 后就要从空闲队列移出。</text><text x="48" y="612" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">命中块若已经被别的请求持有，原本不在空闲队列中，就不计入 E。</text><text x="600" y="675" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">命中节省计算；命中的状态本身仍然需要存储空间</text></g></svg>