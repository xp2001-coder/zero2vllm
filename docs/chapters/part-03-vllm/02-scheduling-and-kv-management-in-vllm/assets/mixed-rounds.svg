<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="712" viewBox="0 0 1200 712" role="img" aria-labelledby="title desc"><title id="title">混合调度的三轮计数</title><desc id="desc">三轮分别安排 A1 B3、A1 B3、A1 B1，第三轮剩余两个预算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="712" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">长提示与单 token 解码，共用一轮预算</text><text x="30" y="79" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">预算 = 4，阈值 = 0；A 先在 running，B 从 waiting 加入</text><rect x="25" y="110" width="1150" height="436" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="50" y="156" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">轮次</text><text x="180" y="156" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">开始时 N / C</text><text x="472" y="156" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">本轮 4 个预算位置</text><text x="822" y="156" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">反馈后 N / C</text><path d="M45,180 L1155,180" fill="none" stroke="#b9c2c8" stroke-width="1.5" /><text x="62" y="250" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">第 1 轮</text><text x="195" y="238" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A  5 / 4</text><text x="195" y="273" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B  7 / 0</text><rect x="485" y="217" width="57" height="56" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="513.5" y="253.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A</text><rect x="551" y="217" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="579.5" y="253.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><rect x="617" y="217" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="645.5" y="253.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><rect x="683" y="217" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="711.5" y="253.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><text x="845" y="238" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A  6 / 5</text><text x="845" y="273" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B  7 / 3</text><path d="M45,302 L1155,302" fill="none" stroke="#b9c2c8" stroke-width="1.5" /><text x="62" y="352" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">第 2 轮</text><text x="195" y="340" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A  6 / 5</text><text x="195" y="375" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B  7 / 3</text><rect x="485" y="319" width="57" height="56" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="513.5" y="355.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A</text><rect x="551" y="319" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="579.5" y="355.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><rect x="617" y="319" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="645.5" y="355.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><rect x="683" y="319" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="711.5" y="355.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><text x="845" y="340" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A  7 / 6</text><text x="845" y="375" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B  7 / 6</text><path d="M45,404 L1155,404" fill="none" stroke="#b9c2c8" stroke-width="1.5" /><text x="62" y="454" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">第 3 轮</text><text x="195" y="442" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A  7 / 6</text><text x="195" y="477" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B  7 / 6</text><rect x="485" y="421" width="57" height="56" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="513.5" y="457.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A</text><rect x="551" y="421" width="57" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="579.5" y="457.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><rect x="617" y="421" width="57" height="56" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="645.5" y="457.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">空</text><rect x="683" y="421" width="57" height="56" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="711.5" y="457.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">空</text><text x="845" y="442" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A  8 / 7</text><text x="845" y="477" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B  8 / 7</text><text x="48" y="583" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">前两轮：B 的提示未处理完，没有首个输出。第三轮：B 完成提示前向，才采样首个输出。</text><text x="48" y="612" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">每次追平后产生 1 个输出，是教学设定。方格表示 token 数量，不表示耗时。</text><text x="600" y="674" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">B 在第 1 轮后已经是 RUNNING，但仍然处于 Prefill</text></g></svg>