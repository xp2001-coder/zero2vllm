<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="553" viewBox="0 0 1200 553" role="img" aria-labelledby="title desc"><title id="title">已知序列和已计算长度</title><desc id="desc">提示前向后 N4 C4，采样后 N5 C4，下一轮处理 e 并采样 f 后 N6 C5。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="553" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">同一条序列，两种长度</text><text x="30" y="79" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">蓝色：已计算输入　橙色：本轮输入　灰色：已知、尚未计算</text><rect x="25" y="110" width="360" height="359" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="47" y="151" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">① 提示前向完成</text><rect x="45" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="67.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">a</text><rect x="98" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="120.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">b</text><rect x="151" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="173.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">c</text><rect x="204" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="226.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">d</text><text x="47" y="282" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">N = 4，C = 4</text><text x="47" y="329" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">提示的 K/V 已就绪</text><text x="47" y="358" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">尚未把采样结果加入序列</text><rect x="47" y="407" width="316" height="40" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="205" y="434" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">待采样</text><rect x="420" y="110" width="360" height="359" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="442" y="151" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">② 采样得到 e</text><rect x="440" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="462.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">a</text><rect x="493" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="515.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">b</text><rect x="546" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="568.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">c</text><rect x="599" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="621.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">d</text><rect x="652" y="185" width="45" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="674.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">e</text><text x="442" y="282" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">N = 5，C = 4</text><text x="442" y="329" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">e 来自最后位置的 logits</text><text x="442" y="358" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">e 还没有自己的 K/V</text><rect x="442" y="407" width="316" height="40" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="600" y="434" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">下一轮缺口：5 − 4 = 1</text><rect x="815" y="110" width="360" height="359" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="837" y="151" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">③ 输入 e，再得到 f</text><rect x="835" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="857.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">a</text><rect x="888" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="910.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">b</text><rect x="941" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="963.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">c</text><rect x="994" y="185" width="45" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="1016.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">d</text><rect x="1047" y="185" width="45" height="49" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1069.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">e</text><rect x="1100" y="185" width="45" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1122.5" y="217.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">f</text><text x="837" y="282" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">N = 6，C = 5</text><text x="837" y="329" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">e 的 K/V 在本轮写入</text><text x="837" y="358" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">f 留待下一轮作为输入</text><rect x="837" y="407" width="316" height="40" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="995" y="434" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">下一轮缺口：6 − 5 = 1</text><path d="M386,260 L412,260" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M781,260 L807,260" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600" y="515" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">已知 token 增加，和这个 token 的 K/V 已写入，是不同的时刻</text></g></svg>