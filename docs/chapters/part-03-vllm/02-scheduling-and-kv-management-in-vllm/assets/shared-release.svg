<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708" viewBox="0 0 1200 708" role="img" aria-labelledby="title desc"><title id="title">共享引用与缓存回收</title><desc id="desc">块一引用从二到一到零，最后归零后依然可以保留前缀缓存身份。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="708" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">结束一条请求，不等于清空共享缓存</text><text x="30" y="79" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">A、B 共用前缀块 1，各自持有尾块 2、3；数字是引用计数</text><rect x="25" y="111" width="360" height="411" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="151" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">① A、B 都在运行</text><rect x="45" y="183" width="140" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="115" y="215.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 1</text><text x="216" y="216" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">引用 = 2</text><rect x="45" y="249" width="140" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="115" y="281.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 2</text><text x="216" y="282" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">引用 = 1</text><rect x="45" y="315" width="140" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="115" y="347.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 3</text><text x="216" y="348" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">引用 = 1</text><text x="45" y="407" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">没有可覆盖的块</text><text x="45" y="436" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">A、B 都依赖块 1</text><rect x="420" y="111" width="360" height="411" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="440" y="151" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">② A 结束</text><rect x="440" y="183" width="140" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="510" y="215.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 1</text><text x="611" y="216" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">引用 = 1</text><rect x="440" y="249" width="140" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="510" y="281.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 2</text><text x="611" y="282" font-size="22" fill="#339c81" font-weight="600" text-anchor="start">引用 = 0</text><rect x="440" y="315" width="140" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="510" y="347.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 3</text><text x="611" y="348" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">引用 = 1</text><text x="440" y="407" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">块 2 可以回收</text><text x="440" y="436" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">块 1 仍由 B 持有</text><rect x="815" y="111" width="360" height="411" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="835" y="151" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">③ B 也结束</text><rect x="835" y="183" width="140" height="49" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="905" y="215.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 1</text><text x="1006" y="216" font-size="22" fill="#339c81" font-weight="600" text-anchor="start">引用 = 0</text><rect x="835" y="249" width="140" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="905" y="281.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 2</text><text x="1006" y="282" font-size="22" fill="#339c81" font-weight="600" text-anchor="start">引用 = 0</text><rect x="835" y="315" width="140" height="49" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="905" y="347.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">块 3</text><text x="1006" y="348" font-size="22" fill="#339c81" font-weight="600" text-anchor="start">引用 = 0</text><text x="835" y="407" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">三块都可成为逐出候选</text><text x="835" y="436" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">块 1 仍可保留前缀身份</text><path d="M386,309 L412,309" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M781,309 L807,309" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="45" y="557" width="1110" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="600" y="599.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">解除引用 → 引用归零进入空闲队列 → 新内容需要时再逐出旧身份</text><text x="600" y="671" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">空闲描述“谁在使用”；缓存身份描述“里面的内容还能否复用”</text></g></svg>