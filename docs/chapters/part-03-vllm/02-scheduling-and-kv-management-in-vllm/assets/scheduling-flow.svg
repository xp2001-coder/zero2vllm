<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="757" viewBox="0 0 1200 757" role="img" aria-labelledby="title desc"><title id="title">运行与等待队列的调度分支</title><desc id="desc">先处理 running；分配失败抢占队尾，无抢占时再接纳 waiting 队首。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="757" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">一轮调度：先看运行队列，再看等待队列</text><text x="30" y="78" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">固定 v0.8.5 / V1 的文本主路径；图中省略 LoRA、编码器等额外分支</text><rect x="25" y="110" width="530" height="567" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="650" y="110" width="525" height="567" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="48" y="150" font-size="23" fill="#3da8e8" font-weight="600" text-anchor="start">① running：已经进入运行队列</text><rect x="55" y="175" width="469" height="56" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="289.5" y="210.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">按队列顺序取请求，计算本轮 q</text><path d="M288,234 L288,263" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="55" y="268" width="469" height="56" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="289.5" y="303.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">按 q 尝试分配 KV 槽位</text><path d="M164,327 L164,365" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M416,327 L416,365" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="105" y="351" font-size="19" fill="#339c81" font-weight="400" text-anchor="start">成功</text><text x="372" y="351" font-size="19" fill="#ef8e38" font-weight="400" text-anchor="start">失败</text><rect x="48" y="373" width="229" height="90" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="162.5" y="425" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">写入计划，扣预算</text><rect x="308" y="373" width="222" height="90" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="419" y="425" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">抢占队尾，再重试</text><text x="49" y="507" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">q = 0：跳过这条，继续检查</text><text x="49" y="536" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">抢占对象若是自己：停止本轮尝试</text><text x="49" y="565" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">本轮发生抢占：不进入等待准入</text><rect x="55" y="615" width="469" height="39" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="289.5" y="641.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">约束：剩余 token 预算、长度上限</text><path d="M532,634 L599,634 L599,202 L642,202" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600" y="167" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">遍历后</text><text x="600" y="190" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">无抢占</text><text x="675" y="150" font-size="23" fill="#ef8e38" font-weight="600" text-anchor="start">② waiting：尝试接纳队首</text><rect x="679" y="175" width="469" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="913.5" y="210.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">序列名额足够 → 查找完整前缀</text><path d="M913,234 L913,263" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="679" y="268" width="469" height="56" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="913.5" y="303" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">计算剩余 q → 保护命中、分配新块</text><path d="M788,327 L788,365" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1040,327 L1040,365" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="734" y="351" font-size="19" fill="#339c81" font-weight="400" text-anchor="start">成功</text><text x="995" y="351" font-size="19" fill="#ef8e38" font-weight="400" text-anchor="start">失败</text><rect x="675" y="373" width="230" height="90" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="790" y="425.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">移入 running</text><rect x="936" y="373" width="214" height="90" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1043" y="425" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">停止等待准入</text><text x="676" y="507" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">不是遇到大请求就寻找后面的短请求</text><text x="676" y="536" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">序列名额已满，也会停止准入</text><text x="676" y="565" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">有剩余 token 预算，不保证能继续接纳</text><rect x="679" y="615" width="469" height="39" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="913.5" y="641.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">得到 SchedulerOutput，交给执行侧</text><text x="600" y="721" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">token 预算、序列数量和 KV 容量，需要同时满足</text></g></svg>