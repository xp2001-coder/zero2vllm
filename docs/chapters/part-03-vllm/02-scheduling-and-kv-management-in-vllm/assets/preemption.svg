<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716" viewBox="0 0 1200 716" role="img" aria-labelledby="title desc"><title id="title">抢占后释放块并重建进度</title><desc id="desc">A扩容失败后抢占B，B保留已知序列并重置计算进度，A结束后B从零重算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="716" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">抢占后，继续的是同一条请求</text><text x="30" y="79" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">可用块只有 2 个；A、B 各占 1 块；为看清重算，本例关闭前缀缓存</text><rect x="25" y="111" width="360" height="436" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="151" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">① A 扩容失败</text><rect x="45" y="179" width="320" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="205" y="216.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">运行：[A, B]</text><rect x="45" y="259" width="320" height="59" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="205" y="296.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">等待：[]</text><text x="45" y="373" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">A：N=5 / C=4，需第 2 块</text><text x="45" y="402" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">B：N=5 / C=4，占 1 块</text><text x="45" y="431" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">没有空闲块供 A 扩容</text><rect x="45" y="484" width="320" height="40" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="205" y="510.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">token 预算：4</text><rect x="420" y="111" width="360" height="436" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="440" y="151" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">② 抢占 B，让 A 前进</text><rect x="440" y="179" width="320" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="600" y="216.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">运行：[A]</text><rect x="440" y="259" width="320" height="59" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="600" y="296.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">等待：[B]</text><text x="440" y="373" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">B 归还块，C 重置为 0</text><text x="440" y="402" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">B 的已知长度仍是 5</text><text x="440" y="431" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">A 本轮计算 1 个位置</text><rect x="440" y="484" width="320" height="40" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="600" y="510.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">本轮不再准入等待请求</text><rect x="815" y="111" width="360" height="436" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="835" y="151" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">③ A 结束后，B 恢复</text><rect x="835" y="179" width="320" height="59" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="995" y="216.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">运行：[B]</text><rect x="835" y="259" width="320" height="59" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="995" y="296.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">等待：[]</text><text x="835" y="373" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">A 完成反馈已归还两块</text><text x="835" y="402" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">B 从 C=0 安排 4 个位置</text><text x="835" y="431" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">B 仍差第 5 个位置</text><rect x="835" y="484" width="320" height="40" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="995" y="510.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">kind = resumed</text><path d="M386,309 L412,309" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M781,309 L807,309" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="48" y="589" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">保留：请求 ID、提示、已经接受的输出与采样配置。</text><text x="48" y="618" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">解除：旧 KV 块使用权。启用前缀缓存时，恢复还可能命中尚未被覆盖的完整块。</text><text x="600" y="680" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">重算已知 token 的状态，不是重新采样用户已经收到的内容</text></g></svg>