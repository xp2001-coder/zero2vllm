<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">四类对象沿请求路径的转换</title><desc id="desc">新请求成为调度计划；运行器产生按 batch 排列的结果；调度器将结果归属请求并产生核心输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="700" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">沿着数据对象读源码</text><text x="30" y="78" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">同一条请求会变成不同对象；ID 负责关联，字段反映各层职责</text><rect x="25" y="115" width="510" height="201" rx="9" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="49" y="154" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">① 新请求</text><text x="49" y="188" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">EngineCoreRequest</text><text x="49" y="232" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">request_id · prompt_token_ids</text><text x="49" y="261" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">sampling_params · eos_token_id</text><rect x="663" y="115" width="510" height="201" rx="9" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="687" y="154" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">② 一轮工作</text><text x="687" y="188" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">SchedulerOutput</text><text x="687" y="232" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">num_scheduled_tokens · block IDs</text><text x="687" y="261" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">新请求 / 已有请求 / 完成 ID</text><path d="M544,212 L653,212" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="598" y="193" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">调度</text><rect x="663" y="416" width="510" height="201" rx="9" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="687" y="455" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">③ 执行结果</text><text x="687" y="489" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">ModelRunnerOutput</text><text x="687" y="533" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">req_id_to_index</text><text x="687" y="562" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">sampled_token_ids</text><path d="M918,325 L918,402" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="951" y="373" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">执行</text><rect x="25" y="416" width="510" height="201" rx="9" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="49" y="455" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">④ 请求结果</text><text x="49" y="489" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">EngineCoreOutput</text><text x="49" y="533" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">request_id · new_token_ids</text><text x="49" y="562" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">finish_reason · stop_reason</text><path d="M654,514 L546,514" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="600" y="490" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">更新状态</text><text x="600" y="665" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">本轮计算多少个输入位置，不等于本轮返回多少个新 token</text></g></svg>