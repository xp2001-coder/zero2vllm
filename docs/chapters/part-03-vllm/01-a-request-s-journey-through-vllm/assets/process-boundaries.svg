<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="717" viewBox="0 0 1200 717" role="img" aria-labelledby="title desc"><title id="title">单卡在线路径的进程、线程与任务</title><desc id="desc">前端处理 HTTP、AsyncLLM 与输出；核心输入线程通过队列交给主循环，uni 后端本地执行，输出线程返回结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="717" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="40" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">一条请求，两个主要进程</text><text x="30" y="76" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">阅读条件：V1 · 单卡 uni · 无推测解码；省略可选辅助进程</text><rect x="20" y="100" width="446" height="540" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="548" y="100" width="630" height="540" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="139" font-size="24" fill="#3da8e8" font-weight="600" text-anchor="start">前端进程</text><text x="572" y="139" font-size="24" fill="#ef8e38" font-weight="600" text-anchor="start">核心进程</text><rect x="46" y="166" width="394" height="63" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="243" y="205.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">HTTP / 聊天处理器</text><path d="M243,236 L243,259" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="46" y="268" width="394" height="76" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="243" y="314.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">AsyncLLM + 核心客户端</text><text x="67" y="380" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">输入：模板、分词、参数与请求登记</text><text x="67" y="412" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">请求协程等待；后台任务接收结果</text><rect x="46" y="520" width="394" height="81" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="243" y="567.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">输出处理 → 请求收集器 → SSE</text><text x="65" y="488" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">收到结果后，按请求 ID 找回消费者</text><rect x="575" y="268" width="574" height="76" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="862" y="314.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">输入线程：解码 → input_queue</text><path d="M448,305 L568,305" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="506" y="277" font-size="18" fill="#22262b" font-weight="600" text-anchor="middle">ADD</text><path d="M862,351 L862,373" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="575" y="382" width="574" height="63" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="862" y="421.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">主循环：调度 → 执行 → 更新</text><text x="594" y="474" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">本地执行：Executor → Worker → ModelRunner</text><path d="M862,485 L862,513" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="575" y="520" width="574" height="81" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="862" y="568.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">output_queue → 输出线程</text><path d="M568,560 L448,560" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="506" y="534" font-size="18" fill="#22262b" font-weight="600" text-anchor="middle">结果</text><text x="574" y="183" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">输入方向：ROUTER → DEALER</text><text x="574" y="212" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">输出方向：PUSH → PULL</text><text x="600" y="683" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">同进程调用、线程队列与跨进程消息，是三种不同的交接</text></g></svg>