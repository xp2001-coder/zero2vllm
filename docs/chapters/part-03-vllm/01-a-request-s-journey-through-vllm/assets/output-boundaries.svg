<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc"><title id="title">内部增量、消费者读取与 SSE 事件</title><desc id="desc">DELTA 模式下两个尚未读取的增量可以合并。聊天 SSE 包含角色、文本、结束以及 DONE，不应把事件数当成 token 数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="695" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">一次可见输出，不一定对应一次模型迭代</text><rect x="25" y="90" width="1150" height="281" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="48" y="132" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">(a) 消费者尚未读取时，增量可以合并</text><rect x="49" y="171" width="216" height="67" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="157" y="212.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">先到：[31]</text><rect x="49" y="274" width="216" height="67" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="157" y="315.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">后到：[32]</text><path d="M273,204 L356,204 L356,250 L435,250" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M273,308 L356,308 L356,250" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="445" y="216" width="339" height="70" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="614.5" y="259.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">待消费：[31,32]</text><path d="M792,251 L859,251" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="867" y="216" width="278" height="70" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1006" y="259.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">一次取出</text><rect x="25" y="400" width="1150" height="216" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="48" y="442" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">(b) 对外事件还有自己的协议边界</text><rect x="51" y="479" width="247" height="68" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="174.5" y="521.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">角色事件</text><path d="M304,513 L327,513" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="334" y="479" width="247" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="457.5" y="521.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">文本增量</text><path d="M587,513 L610,513" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="617" y="479" width="247" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="740.5" y="521.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">结束事件</text><path d="M870,513 L893,513" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="900" y="479" width="247" height="68" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1023.5" y="521.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">[DONE]</text><text x="50" y="587" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">SSE 事件数 ≠ token 数；收集器合并也不等于调度器暂停</text><text x="600" y="661" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">这里说明的是输出组织方式，不是 GPU 吞吐或网络耗时</text></g></svg>