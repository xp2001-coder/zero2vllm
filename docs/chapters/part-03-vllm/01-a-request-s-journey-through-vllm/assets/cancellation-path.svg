<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="784" viewBox="0 0 1200 784" role="img" aria-labelledby="title desc"><title id="title">取消消息与不同资源的回收边界</title><desc id="desc">前端删除状态并发送 ABORT，核心在主循环处理结束，块池归还引用，下一次调度通知模型运行器清理。晚到输出被前端忽略。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="784" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">取消要沿着资源所有权继续追踪</text><text x="30" y="78" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">本节同步单轮路径：消息在迭代边界处理，已经发出的计算不会被撤回</text><rect x="30" y="119" width="328" height="152" rx="9" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="51" y="159" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">① 前端撤销</text><text x="51" y="204" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">AsyncLLM.abort</text><text x="51" y="241" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">删除输出状态</text><path d="M368,195 L425,195" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="437" y="119" width="328" height="152" rx="9" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="458" y="159" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">② 发送取消</text><text x="458" y="204" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">ABORT 消息</text><text x="458" y="241" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">输入线程 → 队列</text><path d="M775,195 L832,195" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="844" y="119" width="328" height="152" rx="9" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="865" y="159" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">③ 核心终止</text><text x="865" y="204" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">finish_requests</text><text x="865" y="241" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">移出 waiting / running</text><path d="M1006,280 L1006,348 L830,348" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="323" width="761" height="190" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="52" y="365" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">④ 归还请求持有的块引用</text><text x="52" y="409" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">KVCacheManager.free → BlockPool.free_blocks</text><text x="52" y="455" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">引用归零可复用；前缀内容可能仍然保留</text><text x="52" y="486" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">预分配 KV 池仍存在，显存不必下降</text><path d="M412,521 L412,552" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="563" width="1142" height="141" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="52" y="603" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">⑤ 通知运行器清理</text><text x="52" y="646" font-size="21" fill="#22262b" font-weight="400" text-anchor="start">finished_req_ids → SchedulerOutput → GPUModelRunner._update_states</text><text x="52" y="681" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">删除执行侧请求状态与 batch 关联</text><text x="850" y="399" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">晚到的输出</text><text x="850" y="438" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">前端找不到该 ID</text><text x="850" y="467" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">则跳过该结果</text><text x="600" y="749" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">发送成功、核心结束、引用归还与运行器清理，分别核对</text></g></svg>