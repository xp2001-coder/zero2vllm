<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="733" viewBox="0 0 1200 733" role="img" aria-labelledby="title desc"><title id="title">从参数到运行时的多层验证</title><desc id="desc">配置阶段通过之后，还需要平台、后端、内存和输出数值证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="733" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">“支持”要逐层检查，参数被接收只是开始</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">块大小 7 可通过本课程的正整数检查；它没有因此获得任何后端兼容性保证</text><rect x="31" y="126" width="237" height="62" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="149.5" y="165.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">1  参数解析</text><path d="M279,157 L321,157" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="333" y="126" width="453" height="62" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="559.5" y="165.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">类型与选项合法</text><rect x="809" y="126" width="362" height="62" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="990" y="164.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">字符串变成字段值</text><path d="M148,192 L148,206" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="31" y="210" width="237" height="62" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="149.5" y="249.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">2  配置校验</text><path d="M279,241 L321,241" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="333" y="210" width="453" height="62" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="559.5" y="249.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">字段之间不冲突</text><rect x="809" y="210" width="362" height="62" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="990" y="248.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">预算 ≥ 序列上限</text><path d="M148,276 L148,290" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="31" y="294" width="237" height="62" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="149.5" y="333.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">3  平台选择</text><path d="M279,325 L321,325" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="333" y="294" width="453" height="62" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="559.5" y="333.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">实际 worker / 后端</text><rect x="809" y="294" width="362" height="62" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="990" y="332.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">记录选择结果</text><path d="M148,360 L148,374" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="31" y="378" width="237" height="62" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="149.5" y="417.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">4  后端约束</text><path d="M279,409 L321,409" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="333" y="378" width="453" height="62" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="559.5" y="417.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">dtype / head size / 块大小</text><rect x="809" y="378" width="362" height="62" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="990" y="416.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">核对实现要求</text><path d="M148,444 L148,458" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="31" y="462" width="237" height="62" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="149.5" y="501.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">5  内存规划</text><path d="M279,493 L321,493" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="333" y="462" width="453" height="62" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="559.5" y="501.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">权重、工作区与 KV</text><rect x="809" y="462" width="362" height="62" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="990" y="500.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">实际分配结果</text><path d="M148,528 L148,542" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="31" y="546" width="237" height="62" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="149.5" y="585.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">6  图与执行</text><path d="M279,577 L321,577" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="333" y="546" width="453" height="62" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="559.5" y="585.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">捕获、命中、输出正确性</text><rect x="809" y="546" width="362" height="62" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="990" y="584.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">运行证据</text><text x="600" y="695" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">本节完成配置规则演示；其余层次保持待验证，不能用一个 PASS 全部代替</text></g></svg>