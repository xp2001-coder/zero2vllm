<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="767" viewBox="0 0 1200 767" role="img" aria-labelledby="title desc"><title id="title">配置字段的逐阶段来源</title><desc id="desc">预算由CLI覆盖，prefix的false保留，chunked的false被固定版本V1策略改写。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="767" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">同样是用户输入，最终值可能来自不同阶段</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">课程示例：合并输入之后，仍会执行固定版本 V1 的默认和策略规则</text><rect x="31" y="119" width="330" height="58" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="196" y="156.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">字段</text><rect x="381" y="119" width="180" height="58" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="471" y="156.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">文件</text><rect x="581" y="119" width="170" height="58" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="666" y="156.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">CLI</text><rect x="771" y="119" width="220" height="58" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="881" y="156.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">后续规则</text><rect x="1011" y="119" width="160" height="58" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1091" y="156.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">最终</text><rect x="31" y="204" width="330" height="60" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="196" y="242.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">token 预算</text><rect x="381" y="204" width="180" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="471" y="241.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">4096</text><rect x="581" y="204" width="170" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="666" y="241.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">3072</text><rect x="771" y="204" width="220" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="881" y="241.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">显式值保留</text><rect x="1011" y="204" width="160" height="60" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="1091" y="241.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">3072</text><rect x="31" y="281" width="330" height="60" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="196" y="319.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">序列上限</text><rect x="381" y="281" width="180" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="471" y="318.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">64</text><rect x="581" y="281" width="170" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="666" y="318.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">未提供</text><rect x="771" y="281" width="220" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="881" y="318.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">显式值保留</text><rect x="1011" y="281" width="160" height="60" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="1091" y="318.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">64</text><rect x="31" y="358" width="330" height="60" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="196" y="396.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">prefix caching</text><rect x="381" y="358" width="180" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="471" y="395.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">true</text><rect x="581" y="358" width="170" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="666" y="395.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">false</text><rect x="771" y="358" width="220" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="881" y="395.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">只补空值</text><rect x="1011" y="358" width="160" height="60" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="1091" y="395.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">false</text><rect x="31" y="435" width="330" height="60" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="196" y="473.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">chunked prefill</text><rect x="381" y="435" width="180" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="471" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">false</text><rect x="581" y="435" width="170" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="666" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">未提供</text><rect x="771" y="435" width="220" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="881" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V1 强制开启</text><rect x="1011" y="435" width="160" height="60" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="1091" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">true</text><rect x="31" y="512" width="330" height="60" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="196" y="550.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">block size</text><rect x="381" y="512" width="180" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="471" y="549.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">未提供</text><rect x="581" y="512" width="170" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="666" y="549.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">未提供</text><rect x="771" y="512" width="220" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="881" y="549.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">CUDA 普通默认</text><rect x="1011" y="512" width="160" height="60" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="1091" y="549.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">16</text><rect x="31" y="622" width="1140" height="109" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="52" y="664" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">预算：None → 文件 4096 → CLI 3072</text><text x="52" y="704" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">分块：None → 文件 false → V1 策略 true；仅看输入优先级无法解释最后一步。</text></g></svg>