<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="733" viewBox="0 0 1200 733" role="img" aria-labelledby="title desc"><title id="title">两个平台的独立证据记录</title><desc id="desc">共享模型和负载，CUDA与MACA分别记录软件栈、实际配置及运行结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="733" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">双平台记录：共享实验问题，分别保存实现证据</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">本图是后续 A100 / C500 验证模板，不是已经测得的支持列表</text><rect x="31" y="120" width="1140" height="75" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="601" y="165.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">共同负载：模型 revision / 输入 / 生成策略 / 正确性标准 / 计时范围</text><path d="M600,206 L600,231 L307,231 L307,267" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M600,231 L893,231 L893,267" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="31" y="279" width="550" height="358" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="51" y="299" width="510" height="64" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="306" y="340.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">单卡 A100 · CUDA</text><text x="58" y="409" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">准确提交、驱动与运行时</text><text x="58" y="440" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">PyTorch / 扩展 / 模型权重格式</text><text x="58" y="471" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">实际后端、dtype、块大小</text><text x="58" y="502" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">缓存容量、图模式与命中</text><text x="58" y="533" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">输出验证、预热与性能记录</text><text x="58" y="609" font-size="22" fill="#64707a" font-weight="600" text-anchor="start">状态：待实机填写</text><rect x="621" y="279" width="550" height="358" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="641" y="299" width="510" height="64" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="896" y="340.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">单卡 C500 · MACA</text><text x="648" y="409" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">准确提交、驱动与运行时</text><text x="648" y="440" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">PyTorch / 扩展 / 模型权重格式</text><text x="648" y="471" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">实际后端、dtype、块大小</text><text x="648" y="502" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">缓存容量、图模式与命中</text><text x="648" y="533" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">输出验证、预热与性能记录</text><text x="648" y="609" font-size="22" fill="#64707a" font-weight="600" text-anchor="start">状态：待实机填写</text><text x="600" y="691" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">同名参数不保证同一实现；一边的通过记录不能替另一边填写</text></g></svg>