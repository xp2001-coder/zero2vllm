<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">模型长度与两种调度上限</title><desc id="desc">长提示分八轮，每轮预算与序列数上限不同，不能替代缓存容量检查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="750" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">三个上限：一条请求多长，一轮算多少，同时安排多少条</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">例子：模型长度 4096，单轮 token 预算 512，序列数上限 16</text><rect x="30" y="118" width="1140" height="234" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="54" y="161" font-size="24" fill="#3da8e8" font-weight="600" text-anchor="start">(a) 一条长提示可以分多轮处理</text><rect x="57" y="190" width="125" height="67" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="119.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="195" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="257.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="333" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="395.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="471" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="533.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="609" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="671.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="747" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="809.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="885" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="947.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><rect x="1023" y="190" width="125" height="67" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1085.5" y="232.95" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">512</text><text x="54" y="310" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">8 × 512 = 4096：第一轮计算前 512 个 token，后续轮次继续推进。</text><rect x="30" y="387" width="560" height="194" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="620" y="387" width="550" height="194" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="54" y="430" font-size="24" fill="#ef8e38" font-weight="600" text-anchor="start">(b) 本轮计算量</text><text x="54" y="477" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">各请求本轮 q 的总和 ≤ 512</text><text x="54" y="548" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">不是全部历史 KV 长度之和。</text><text x="644" y="430" font-size="24" fill="#339c81" font-weight="600" text-anchor="start">(c) 序列数量上限</text><text x="644" y="477" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">本轮可安排的序列数 ≤ 16</text><text x="644" y="548" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">也不代表有足够缓存保存 16 条最长序列。</text><rect x="30" y="618" width="1140" height="93" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="600" y="674" font-size="25" fill="#22262b" font-weight="600" text-anchor="middle">分块开启时 512 &lt; 4096 可以合法；预算仍须 ≥ 序列上限。</text></g></svg>