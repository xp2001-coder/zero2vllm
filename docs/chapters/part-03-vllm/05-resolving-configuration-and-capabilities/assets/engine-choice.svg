<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">引擎意图与能力分类</title><desc id="desc">自动模式可回退，显式V1面对不支持条件报错，其他校验仍然存在。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="750" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">引擎选择：自动尝试、明确选择和能力检查共同决定</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">教学分类表示 oracle 已经检查过的条件；本实验不会自动检测功能或设备</text><rect x="31" y="128" width="268" height="66" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="165" y="169.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">输入意图</text><rect x="315" y="128" width="268" height="66" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="449" y="169.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">支持</text><rect x="600" y="128" width="268" height="66" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="734" y="169.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">实验性</text><rect x="885" y="128" width="268" height="66" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1019" y="169.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">不支持</text><rect x="31" y="225" width="268" height="78" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="165" y="272.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">未设置（自动）</text><rect x="315" y="225" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="449" y="272.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">V1</text><rect x="600" y="225" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="734" y="272.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">回退 V0</text><rect x="885" y="225" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="1019" y="272.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">回退 V0</text><rect x="31" y="329" width="268" height="78" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="165" y="376.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">显式 1</text><rect x="315" y="329" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="449" y="376.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">V1</text><rect x="600" y="329" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="734" y="376.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">警告并尝试 V1</text><rect x="885" y="329" width="268" height="78" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="1019" y="376.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">报错</text><rect x="31" y="433" width="268" height="78" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="165" y="480.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">显式 0</text><rect x="315" y="433" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="449" y="480.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">V0</text><rect x="600" y="433" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="734" y="480.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">V0</text><rect x="885" y="433" width="268" height="78" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="1019" y="480.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">V0</text><rect x="31" y="574" width="1122" height="135" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="55" y="617" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">V0 被选中，不等于全部配置已经验证通过。</text><text x="55" y="659" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">这里只解释固定 v0.8.5 的选择语义，没有重建 V0 配置系统。</text><text x="55" y="690" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">显式要求某引擎不能让不支持的功能自动变得可用。</text></g></svg>