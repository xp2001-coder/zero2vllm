<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc"><title id="title">共享缓冲与独立快照</title><desc id="desc">共享引用延迟读取会收到下一轮值；独立快照保留提交时数据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="765" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">异步读取的隐患：提交时的数据，不一定是读取时的数据</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">顺序示意：课程使用列表引用和副本，不启动线程，也不执行 DMA</text><text x="239" y="145" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">① 安排读取</text><text x="612" y="145" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">② CPU 改写源存储</text><text x="985" y="145" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">③ 消费者随后读取</text><rect x="30" y="173" width="1140" height="160" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="52" y="213" font-size="23" fill="#ef8e38" font-weight="600" text-anchor="start">共享引用</text><rect x="51" y="236" width="308" height="68" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="205" y="278.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">source = [3,7]</text><path d="M369,270 L421,270" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="431" y="236" width="308" height="68" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="585" y="278.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">source = [9,7]</text><path d="M749,270 L801,270" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="811" y="236" width="330" height="68" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="976" y="279.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">收到 [9,7]</text><rect x="30" y="365" width="1140" height="203" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="52" y="407" font-size="23" fill="#339c81" font-weight="600" text-anchor="start">独立快照</text><rect x="51" y="429" width="308" height="68" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="205" y="471.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">snapshot = [3,7]</text><path d="M369,463 L421,463" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="431" y="429" width="308" height="68" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="585" y="471.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">source = [9,7]</text><path d="M749,463 L801,463" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="811" y="429" width="330" height="68" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="976" y="472.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">收到 [3,7]</text><text x="434" y="542" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">快照仍为 [3,7]，原存储的修改不会改变它。</text><rect x="30" y="605" width="1140" height="76" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="600" y="652" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">副本也有寿命：设备读完前不能释放或复用；non_blocking 不会冻结源存储。</text><text x="600" y="729" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">需要保护的是这一轮数据的存储与生命周期</text></g></svg>