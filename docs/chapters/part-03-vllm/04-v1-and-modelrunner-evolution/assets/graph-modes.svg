<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">图模式的条件分派</title><desc id="desc">不同形状和捕获状态决定FULL、PIECEWISE或NONE。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="780" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">图执行：配置意图还要经过本轮形状与捕获状态检查</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">示意：单卡普通 decode，形状桶 [1,2,4,8]，不是 CUDA Graph 实测</text><rect x="31" y="118" width="1140" height="59" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="601" y="155.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">FULL_AND_PIECEWISE：普通均匀 decode → FULL；混合批次 → PIECEWISE</text><text x="51" y="232" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">本轮 q</text><text x="315" y="232" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">实际 token / 形状桶</text><text x="645" y="232" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">就绪条件</text><text x="1005" y="232" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">决策</text><rect x="31" y="261" width="1140" height="65" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="58" y="302" font-size="25" fill="#22262b" font-weight="400" text-anchor="start">[1,1,1]</text><text x="323" y="302" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">3 → 桶 4</text><text x="652" y="302" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">整图 4 已捕获</text><text x="1016" y="302" font-size="23" fill="#339c81" font-weight="600" text-anchor="middle">FULL</text><rect x="31" y="341" width="1140" height="65" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="58" y="382" font-size="25" fill="#22262b" font-weight="400" text-anchor="start">[1,3]</text><text x="323" y="382" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">4 → 桶 4</text><text x="652" y="382" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">分段包装器另验收</text><text x="1016" y="382" font-size="23" fill="#339c81" font-weight="600" text-anchor="middle">PIECEWISE</text><rect x="31" y="421" width="1140" height="65" rx="7" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="58" y="462" font-size="25" fill="#22262b" font-weight="400" text-anchor="start">[1,1,1]</text><text x="323" y="462" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">3 → 桶 4</text><text x="652" y="462" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">整图 4 未捕获</text><text x="1016" y="462" font-size="23" fill="#ef8e38" font-weight="600" text-anchor="middle">NONE</text><rect x="31" y="501" width="1140" height="65" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="58" y="542" font-size="25" fill="#22262b" font-weight="400" text-anchor="start">[9]</text><text x="323" y="542" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">9 → 无合适桶</text><text x="652" y="542" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">无法匹配形状</text><text x="1016" y="542" font-size="23" fill="#ef8e38" font-weight="600" text-anchor="middle">NONE</text><rect x="31" y="617" width="1140" height="79" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="600" y="664" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">配置为 FULL_DECODE_ONLY 时，[1,3] 这样的混合批次会选择 NONE。</text><text x="600" y="744" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">配置可选、形状匹配、图已就绪、实际命中，是不同的事实</text></g></svg>