<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">三个独立的版本与执行维度</title><desc id="desc">V1引擎包含两条Runner路径，各自的图模式需要独立确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="715" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">版本名称：引擎、Runner、图模式要分开记录</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">v0.17.1 的两个 GPUModelRunner 路径都位于 V1 引擎内部</text><rect x="30" y="119" width="1140" height="330" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="55" y="150" width="220" height="240" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="165" y="280.85" font-size="31" fill="#22262b" font-weight="500" text-anchor="middle">V1 引擎</text><path d="M283,268 L343,268" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M343,209 L343,336" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M343,209 L389,209" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M343,336 L389,336" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="400" y="169" width="350" height="81" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="575" y="218.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">原有 Runner（MRV1）</text><rect x="400" y="296" width="350" height="81" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="575" y="345.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">新的 Runner（MRV2）</text><path d="M761,209 L820,209" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M761,336 L820,336" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="833" y="157" width="310" height="226" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="988" y="217" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">执行模式另行选择</text><text x="988" y="270" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">NONE / PIECEWISE</text><text x="988" y="318" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">FULL / 组合策略</text><text x="57" y="423" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">引擎负责请求与调度；Runner 负责执行组织；图模式还要经过配置、捕获和本轮分派。</text><rect x="30" y="485" width="1140" height="144" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="56" y="529" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">固定提交中的开关</text><text x="339" y="529" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">VLLM_USE_V2_MODEL_RUNNER</text><text x="56" y="573" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">v0.17.1 默认值为 0；选择 MRV2 不等于模型、后端和全部功能组合已验证。</text><text x="56" y="604" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">v0.8.5 用于回看旧状态组织；两版本耗时之差不能直接归因于 Runner。</text><text x="600" y="679" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">“用了 V2”信息不足：先说明是哪一层、哪个提交、哪种实际执行路径</text></g></svg>