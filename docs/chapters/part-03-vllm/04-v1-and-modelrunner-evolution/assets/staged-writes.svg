<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="title desc"><title id="title">增量更新的数组与目标表</title><desc id="desc">索引、起点、累计结束位置和内容一起组成更新；逻辑载荷36字节不是性能测试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="726" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">增量写入：先记位置和内容，再统一应用</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">两个更新：第 0 行从列 2 写 [8,3]；第 2 行从列 0 写 [5]</text><rect x="30" y="118" width="525" height="365" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="53" y="157" font-size="24" fill="#3da8e8" font-weight="600" text-anchor="start">(a) 打包后的更新</text><text x="54" y="221" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">indices</text><rect x="307" y="182" width="219" height="51" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="416.5" y="215.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">[0,2]</text><text x="54" y="285" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">starts</text><rect x="307" y="246" width="219" height="51" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="416.5" y="279.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">[2,0]</text><text x="54" y="349" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">contents</text><rect x="307" y="310" width="219" height="51" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="416.5" y="343.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">[8,3,5]</text><text x="54" y="413" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">cumulative_ends</text><rect x="307" y="374" width="219" height="51" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="416.5" y="407.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">[2,3]</text><path d="M565,295 L626,295" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="596" y="268" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">应用</text><rect x="641" y="118" width="529" height="365" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="665" y="157" font-size="24" fill="#ef8e38" font-weight="600" text-anchor="start">(b) 修改后的 3 × 6 表</text><text x="752" y="202" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">0</text><text x="818" y="202" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">1</text><text x="884" y="202" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">2</text><text x="950" y="202" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">3</text><text x="1016" y="202" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">4</text><text x="1082" y="202" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">5</text><text x="667" y="257" font-size="21" fill="#22262b" font-weight="400" text-anchor="start">行 0</text><rect x="722" y="221" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="751" y="254.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="788" y="221" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="817" y="254.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="854" y="221" width="58" height="50" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="883" y="254.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">8</text><rect x="920" y="221" width="58" height="50" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="949" y="254.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="986" y="221" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1015" y="254.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="1052" y="221" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1081" y="254.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><text x="667" y="324" font-size="21" fill="#22262b" font-weight="400" text-anchor="start">行 1</text><rect x="722" y="288" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="751" y="321.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="788" y="288" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="817" y="321.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="854" y="288" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="883" y="321.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="920" y="288" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="949" y="321.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="986" y="288" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1015" y="321.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="1052" y="288" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1081" y="321.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><text x="667" y="391" font-size="21" fill="#22262b" font-weight="400" text-anchor="start">行 2</text><rect x="722" y="355" width="58" height="50" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="751" y="388.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">5</text><rect x="788" y="355" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="817" y="388.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="854" y="355" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="883" y="388.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="920" y="355" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="949" y="388.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="986" y="355" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1015" y="388.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="1052" y="355" width="58" height="50" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1081" y="388.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><text x="667" y="454" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">其余位置保持为 0；stage 阶段不修改表。</text><rect x="30" y="520" width="1140" height="121" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="53" y="562" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">逻辑载荷</text><text x="248" y="562" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">3 个内容 + 6 个元数据 = 9 × 4 = 36 字节</text><text x="54" y="609" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">整表 72 字节；此处没有计入对齐、分配、启动或真实传输路径的开销。</text><text x="600" y="690" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">载荷更小是一个条件；是否更快，要结合实际更新密度与执行开销</text></g></svg>