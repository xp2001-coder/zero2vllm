<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="766" viewBox="0 0 1200 766" role="img" aria-labelledby="title desc"><title id="title">Runner与图模式的对照设计</title><desc id="desc">两个Runner乘三个图模式的实验矩阵，强调同提交和逐格验证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="766" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">受控比较：一次只改变一个因素</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">在同一份支持两条 Runner 路径的提交上，固定模型、设备、负载和计时范围</text><text x="51" y="179" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">Runner</text><rect x="261" y="128" width="275" height="78" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="398.5" y="176.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">NONE</text><rect x="561" y="128" width="275" height="78" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="698.5" y="176.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">PIECEWISE</text><rect x="861" y="128" width="275" height="78" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="998.5" y="176.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">FULL</text><rect x="31" y="245" width="193" height="109" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="127.5" y="309.3" font-size="28" fill="#22262b" font-weight="500" text-anchor="middle">MRV1</text><rect x="261" y="245" width="275" height="109" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="399" y="292" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">独立验证</text><text x="399" y="326" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">支持 / 正确性 / 实际命中</text><rect x="561" y="245" width="275" height="109" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="699" y="292" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">独立验证</text><text x="699" y="326" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">支持 / 正确性 / 实际命中</text><rect x="861" y="245" width="275" height="109" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="999" y="292" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">独立验证</text><text x="999" y="326" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">支持 / 正确性 / 实际命中</text><rect x="31" y="401" width="193" height="109" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="127.5" y="465.3" font-size="28" fill="#22262b" font-weight="500" text-anchor="middle">MRV2</text><rect x="261" y="401" width="275" height="109" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="399" y="448" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">独立验证</text><text x="399" y="482" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">支持 / 正确性 / 实际命中</text><rect x="561" y="401" width="275" height="109" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="699" y="448" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">独立验证</text><text x="699" y="482" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">支持 / 正确性 / 实际命中</text><rect x="861" y="401" width="275" height="109" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="999" y="448" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">独立验证</text><text x="999" y="482" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">支持 / 正确性 / 实际命中</text><path d="M299,547 L1081,547" fill="none" stroke="#22262b" stroke-width="1.7" marker-end="url(#arrow)"/><text x="690" y="583" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">横向：同一 Runner，比较图模式</text><rect x="30" y="619" width="1140" height="112" rx="7" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="53" y="660" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">分开记录</text><text x="256" y="660" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">首次加载、编译、捕获  /  预热后运行</text><text x="54" y="705" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">本图是实验设计；所有格子都需要真实记录，未运行不能填“已支持”或“更快”。</text></g></svg>