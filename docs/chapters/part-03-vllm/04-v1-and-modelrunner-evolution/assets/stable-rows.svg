<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">稳定状态与执行视图</title><desc id="desc">B访问行一，A访问行零，反馈按同一映射更新，C保持不变。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="700" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">状态行保持不动，本轮执行顺序通过映射表示</text><text x="30" y="81" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">状态池 [A,B,C]；本轮执行 [B,A]；idx_mapping = [1,0]</text><rect x="30" y="116" width="480" height="370" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="690" y="116" width="480" height="370" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="54" y="156" font-size="24" fill="#3da8e8" font-weight="600" text-anchor="start">(a) 持久状态池</text><text x="714" y="156" font-size="24" fill="#ef8e38" font-weight="600" text-anchor="start">(b) 本轮紧凑视图</text><rect x="54" y="186" width="70" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="89" y="223.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="135" y="186" width="337" height="60" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="303.5" y="224.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">A：已计算 2</text><rect x="54" y="273" width="70" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="89" y="310.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="135" y="273" width="337" height="60" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="303.5" y="311.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">B：已计算 3</text><rect x="54" y="360" width="70" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="89" y="397.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="135" y="360" width="337" height="60" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="303.5" y="398.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">C：已计算 0</text><rect x="716" y="203" width="72" height="73" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="752" y="247.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="801" y="203" width="340" height="73" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="971" y="247.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">B：取状态行 1</text><rect x="716" y="330" width="72" height="73" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="752" y="374.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="801" y="330" width="340" height="73" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="971" y="374.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">A：取状态行 0</text><path d="M479,303 L598,303 L598,240 L708,240" fill="none" stroke="#3da8e8" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M479,216 L552,216 L552,367 L708,367" fill="none" stroke="#ef8e38" stroke-width="1.7" marker-end="url(#arrow)"/><text x="59" y="461" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">C 没参加本轮，状态不推进。</text><text x="718" y="456" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">本轮增量 [1,3] 仍按映射写回。</text><rect x="31" y="526" width="352" height="86" rx="7" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="207" y="578.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">A：2 + 3 = 5</text><rect x="425" y="526" width="352" height="86" rx="7" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="601" y="578.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">B：3 + 1 = 4</text><rect x="819" y="526" width="351" height="86" rx="7" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="994.5" y="578.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">C：0 → 0</text><text x="600" y="663" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">批次行、状态行和 KV 地址是三种坐标，不能因为都是整数就混用</text></g></svg>