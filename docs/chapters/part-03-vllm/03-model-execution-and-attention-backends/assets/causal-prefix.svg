<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728" role="img" aria-labelledby="title desc"><title id="title">带历史偏移的因果可见范围</title><desc id="desc">三个 Query 位置二三四分别可见三个四个五个 Key，另一个请求的 K/V 完全隔离。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="728" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">带历史前缀的因果 Attention：可见范围按绝对位置判断</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">A 已有 2 个 token 的 K/V，本轮 Query 位于 2、3、4，读取 A 的 5 个 Key</text><rect x="25" y="111" width="718" height="393" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="783" y="111" width="392" height="393" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="184" y="151" font-size="21" fill="#3da8e8" font-weight="600" text-anchor="start">历史 K/V</text><text x="415" y="151" font-size="21" fill="#ef8e38" font-weight="600" text-anchor="start">本轮写入的 K/V</text><rect x="185" y="171" width="90" height="46" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="230" y="201.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K 0</text><rect x="286" y="171" width="90" height="46" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="331" y="201.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K 1</text><rect x="387" y="171" width="90" height="46" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="432" y="201.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K 2</text><rect x="488" y="171" width="90" height="46" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="533" y="201.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K 3</text><rect x="589" y="171" width="90" height="46" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="634" y="201.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K 4</text><text x="47" y="264" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">Q 2</text><rect x="185" y="232" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="230" y="267" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="286" y="232" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="331" y="267" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="387" y="232" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="432" y="267" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="488" y="232" width="90" height="56" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="533" y="267" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">屏蔽</text><rect x="589" y="232" width="90" height="56" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="634" y="267" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">屏蔽</text><text x="47" y="334" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">Q 3</text><rect x="185" y="302" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="230" y="337" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="286" y="302" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="331" y="337" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="387" y="302" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="432" y="337" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="488" y="302" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="533" y="337" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="589" y="302" width="90" height="56" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="634" y="337" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">屏蔽</text><text x="47" y="404" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">Q 4</text><rect x="185" y="372" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="230" y="407" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="286" y="372" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="331" y="407" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="387" y="372" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="432" y="407" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="488" y="372" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="533" y="407" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><rect x="589" y="372" width="90" height="56" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="634" y="407" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">可见</text><text x="49" y="477" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">条件：key_position ≤ query_position</text><text x="808" y="152" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">请求边界先于因果判断</text><rect x="809" y="180" width="340" height="65" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="979" y="219.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">只按 A 的块表 [8,3] 取 K/V</text><path d="M979,254 L979,289" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="809" y="300" width="340" height="65" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="979" y="339.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">再屏蔽 A 序列中的未来位置</text><text x="809" y="409" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">B 的块 [5] 不参与这次读取。</text><text x="809" y="438" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">批次相邻，不代表可以相互关注。</text><rect x="25" y="537" width="1150" height="105" rx="8" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="49" y="578" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">不能直接套一个左上角 3 × 5 的普通下三角 mask。</text><text x="49" y="616" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">本轮第一个 Query 的绝对位置是 2，因此它一开始就能看见 K0、K1、K2。</text><text x="600" y="689" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">可见范围由“自己的请求 + 正确的历史偏移”共同决定</text></g></svg>