<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title desc"><title id="title">两条请求的打包输入</title><desc id="desc">B 的一行和 A 的三行拼接为四行；三类坐标不可互换。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="744" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">打包输入：每一行都要保留自己的位置和写入地址</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">执行顺序 [B,A]；块大小 4；B 的块表 [5]，A 的块表 [8,3]</text><rect x="27" y="109" width="547" height="65" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="300.5" y="149.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B：已计算 3，本轮计算 1</text><rect x="626" y="109" width="547" height="65" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="899.5" y="149.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A：已计算 2，本轮计算 3</text><text x="47" y="225" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">扁平行号</text><text x="47" y="288" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">请求</text><text x="47" y="351" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">input_ids</text><text x="47" y="414" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">positions</text><text x="47" y="477" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">slot_mapping</text><rect x="250" y="190" width="200" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="350" y="222.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="250" y="253" width="200" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="350" y="285.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B</text><rect x="250" y="316" width="200" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="350" y="348.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">23</text><rect x="250" y="379" width="200" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="350" y="411.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="250" y="442" width="200" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="350" y="472.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">5 × 4 + 3 = 23</text><rect x="472" y="190" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="572" y="222.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="472" y="253" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="572" y="285.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A</text><rect x="472" y="316" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="572" y="348.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">12</text><rect x="472" y="379" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="572" y="411.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="472" y="442" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="572" y="472.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">8 × 4 + 2 = 34</text><rect x="694" y="190" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="794" y="222.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="694" y="253" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="794" y="285.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A</text><rect x="694" y="316" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="794" y="348.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">13</text><rect x="694" y="379" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="794" y="411.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="694" y="442" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="794" y="472.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">8 × 4 + 3 = 35</text><rect x="916" y="190" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1016" y="222.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="916" y="253" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1016" y="285.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A</text><rect x="916" y="316" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1016" y="348.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">14</text><rect x="916" y="379" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1016" y="411.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">4</text><rect x="916" y="442" width="200" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1016" y="472.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">3 × 4 + 0 = 12</text><path d="M461,183 L461,502" fill="none" stroke="#22262b" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="25" y="536" width="1150" height="125" rx="8" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="50" y="577" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">本轮分段边界</text><text x="282" y="577" font-size="24" fill="#22262b" font-weight="400" text-anchor="start">query_start_loc = [0, 1, 4]</text><text x="50" y="622" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">每条请求的 KV 长度</text><text x="333" y="622" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">seq_lens = [4, 5] ＝ 已计算长度 + 本轮输入数</text><text x="600" y="706" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">行号决定批次位置，positions 决定序列位置，slot_mapping 决定写入位置</text></g></svg>