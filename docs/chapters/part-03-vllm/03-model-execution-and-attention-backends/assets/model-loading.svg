<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="698" viewBox="0 0 1200 698" role="img" aria-labelledby="title desc"><title id="title">模型加载的三个阶段</title><desc id="desc">固定 v0.8.5 的模型类解析、参数加载与后处理；每轮前向复用模型。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="698" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">模型启动：从配置、权重，到可执行的层</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">注册到模型类、载入正确参数、完成后处理，是三个不同的检查点</text><rect x="25" y="116" width="350" height="306" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="40" y="136" width="320" height="52" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="200" y="169.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">① 找到并初始化模型类</text><text x="49" y="228" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">配置中的 architectures</text><text x="49" y="257" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">模型注册表解析对应类</text><text x="49" y="286" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">创建层与参数容器</text><rect x="40" y="356" width="320" height="45" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="200" y="385.15" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">此时不代表权重已经正确</text><rect x="425" y="116" width="350" height="306" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="440" y="136" width="320" height="52" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="600" y="169.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">② 将权重写入参数</text><text x="449" y="228" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">checkpoint 名称映射</text><text x="449" y="257" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">核对布局、分片与 dtype</text><text x="449" y="286" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">Q / K / V 写入融合参数</text><rect x="440" y="356" width="320" height="45" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="600" y="385.15" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">形状相同，也可能装反</text><rect x="825" y="116" width="350" height="306" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="840" y="136" width="320" height="52" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1000" y="169.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">③ 执行加载后处理</text><text x="849" y="228" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">执行层的后处理钩子</text><text x="849" y="257" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">必要时重排或转换权重</text><text x="849" y="286" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">model.eval()，准备执行</text><rect x="840" y="356" width="320" height="45" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1000" y="385.15" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">量化布局依具体方法而定</text><path d="M379,264 L417,264" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M779,264 L817,264" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="460" width="1150" height="156" rx="10" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="48" y="498" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">启动时完成</text><text x="230" y="498" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">load_model → get_model → loader.load_model</text><text x="48" y="548" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">每轮复用</text><text x="230" y="548" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">准备输入 → 执行模型 → 选取 logits → 处理采样结果</text><text x="230" y="584" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">普通迭代复用已经加载的模型参数；不会每轮重新读取 checkpoint。</text><text x="600" y="661" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">名称和形状是第一层检查；数值对照才能进一步验证计算语义</text></g></svg>