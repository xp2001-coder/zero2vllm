<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="724" viewBox="0 0 1200 724" role="img" aria-labelledby="title desc"><title id="title">注意力后端选择与执行链</title><desc id="desc">平台选后端，后端约定布局，Runner 传上下文，Attention 先写缓存再按块表计算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="724" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">注意力后端：选择实现，再遵守它的布局与调用约定</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">固定 v0.8.5 / V1，图示 FlashAttention 普通路径；其他分支需单独核对</text><rect x="25" y="108" width="1150" height="173" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="47" y="135" width="305" height="65" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="199.5" y="175.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">平台 / 配置 → 选择后端</text><path d="M362,167 L410,167" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="419" y="135" width="334" height="65" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="586" y="174.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">后端规定缓存布局与元数据</text><path d="M763,167 L811,167" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="820" y="135" width="332" height="65" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="986" y="174.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">创建缓存、准备本轮 metadata</text><text x="52" y="250" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">FlashAttention 缓存视图：[2, 物理块数, 块大小, KV 头数, 每头维度]</text><rect x="25" y="315" width="1150" height="317" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="47" y="343" width="273" height="74" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="183.5" y="386.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">Runner 设置 forward context</text><path d="M326,380 L369,380" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="380" y="343" width="266" height="74" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="513" y="387.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">模型中的 Attention 层</text><path d="M652,380 L695,380" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="707" y="343" width="440" height="74" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="927" y="387.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">取得 metadata 与本层 KV 缓存</text><path d="M926,425 L926,464" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="707" y="475" width="440" height="69" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="927" y="516.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">按 slot_mapping 写入新增 K / V</text><path d="M699,509 L655,509" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="379" y="475" width="267" height="69" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="512.5" y="516.15" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">按块表与长度做 Attention</text><path d="M369,509 L326,509" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="47" y="475" width="273" height="69" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="183.5" y="516.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">输出真实 token 的结果</text><text x="48" y="602" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">写入算子 reshape_and_cache_flash → 读取与计算 flash_attn_varlen_func</text><text x="600" y="683" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">CPU 图解可核对接口语义；实际平台选择与 GPU 内核仍需实机证据</text></g></svg>