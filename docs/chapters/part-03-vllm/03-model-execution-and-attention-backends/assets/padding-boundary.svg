<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-labelledby="title desc"><title id="title">真实 token 与填充缓冲区</title><desc id="desc">八行缓冲仅前四行有效，slot mapping 四项，query边界与序列长度不变。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="634" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">填充只扩大缓冲区，不应虚构 token 的语义</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">本实验用 CPU 模拟 4 行填充到 8 行的边界；没有捕获或执行 CUDA Graph</text><text x="35" y="156" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">输入缓冲</text><rect x="212" y="114" width="105" height="72" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="264.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">B:23</text><rect x="328" y="114" width="105" height="72" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="380.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A:12</text><rect x="444" y="114" width="105" height="72" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="496.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A:13</text><rect x="560" y="114" width="105" height="72" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="612.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A:14</text><rect x="676" y="114" width="105" height="72" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="728.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">填充</text><rect x="792" y="114" width="105" height="72" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="844.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">填充</text><rect x="908" y="114" width="105" height="72" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="960.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">填充</text><rect x="1024" y="114" width="105" height="72" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1076.5" y="157.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">填充</text><path d="M670,102 L670,313" fill="none" stroke="#22262b" stroke-width="1.5" stroke-dasharray="5 5"/><text x="35" y="264" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">写入槽位</text><rect x="212" y="222" width="105" height="63" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="264.5" y="261.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">23</text><rect x="328" y="222" width="105" height="63" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="380.5" y="261.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">34</text><rect x="444" y="222" width="105" height="63" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="496.5" y="261.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">35</text><rect x="560" y="222" width="105" height="63" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="612.5" y="261.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">12</text><text x="710" y="260" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">后四行没有 slot_mapping 条目</text><rect x="25" y="344" width="1150" height="193" rx="8" fill="white" stroke="#b9c2c8" stroke-width="1.4" /><text x="52" y="390" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">真实数量</text><text x="247" y="390" font-size="25" fill="#339c81" font-weight="600" text-anchor="start">num_actual_tokens = 4</text><text x="731" y="390" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">Query 边界仍为 [0,1,4]</text><text x="52" y="444" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">缓冲区行数</text><text x="247" y="444" font-size="25" fill="#64707a" font-weight="600" text-anchor="start">num_input_tokens = 8</text><text x="731" y="444" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">序列长度仍为 [4,5]</text><text x="52" y="503" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">只允许真实 token 更新缓存；输出选择也只能使用真实行号 0 和 3。</text><text x="600" y="590" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">形状为图执行服务，长度与地址为请求语义服务</text></g></svg>