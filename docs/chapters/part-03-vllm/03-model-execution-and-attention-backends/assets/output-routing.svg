<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title desc"><title id="title">采样候选的请求归属与部分 prefill 过滤</title><desc id="desc">B候选24可保留；A已处理五个但已知六个，候选16丢弃。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="756" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">从行号回到请求：有候选 token，不一定有对外输出</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">执行顺序 [B,A]；非推测解码主路径；图中候选值来自本节固定 CPU fixture</text><rect x="26" y="112" width="1148" height="58" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="600" y="149.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">query_start_loc = [0,1,4] → 每段末行 = [0,3] → 候选 token = [24,16]</text><rect x="25" y="211" width="1150" height="153" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="48" y="235" width="134" height="97" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="115" y="292.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">请求 B</text><path d="M190,283 L231,283" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="241" y="235" width="183" height="97" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="332.5" y="291.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">取第 0 行</text><path d="M432,283 L473,283" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="482" y="235" width="193" height="97" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="578.5" y="291.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">候选 24</text><path d="M683,283 L724,283" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="738" y="263" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">已处理 4 / 已知 4</text><text x="738" y="299" font-size="26" fill="#339c81" font-weight="600" text-anchor="start">保留 [24]</text><text x="738" y="334" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">本轮已覆盖全部已知输入</text><rect x="25" y="394" width="1150" height="153" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="48" y="418" width="134" height="97" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="115" y="475.25" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">请求 A</text><path d="M190,466 L231,466" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="241" y="418" width="183" height="97" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="332.5" y="474.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">取第 3 行</text><path d="M432,466 L473,466" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="482" y="418" width="193" height="97" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="578.5" y="474.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">候选 16</text><path d="M683,466 L724,466" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="738" y="446" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">已处理 5 / 已知 6</text><text x="738" y="482" font-size="26" fill="#ef8e38" font-weight="600" text-anchor="start">丢弃 → []</text><text x="738" y="517" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">仍在处理分块提示，不能提前生成</text><rect x="25" y="580" width="1150" height="91" rx="8" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="50" y="620" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">req_id_to_index = {B:0, A:1}；结果按请求 ID 归属，不能默认原始入队顺序。</text><text x="50" y="651" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">交换执行顺序时，行号随之改变；同一请求的有效结果应保持一致。</text><text x="600" y="719" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">logits 的数值正确、候选选择正确、输出时机正确，三项都要验证</text></g></svg>