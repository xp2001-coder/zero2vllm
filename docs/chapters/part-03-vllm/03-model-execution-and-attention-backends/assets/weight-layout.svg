<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="663" viewBox="0 0 1200 663" role="img" aria-labelledby="title desc"><title id="title">Linear 权重方向与融合 QKV</title><desc id="desc">PyTorch 存储输出行输入列；本实验融合 QKV 的行数为八四四。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="663" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">权重布局：公式里的矩阵，和参数里的矩阵</text><text x="30" y="81" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">本图取 H = 8，Q 头数 = 4，KV 头数 = 2，每头维度 = 2</text><rect x="25" y="110" width="550" height="330" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="625" y="110" width="550" height="330" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="48" y="150" font-size="23" fill="#3da8e8" font-weight="600" text-anchor="start">(a) Linear 的两个视角</text><rect x="52" y="180" width="495" height="65" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="299.5" y="220.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">数学：X[M,K] × W[K,N] → Y[M,N]</text><rect x="52" y="272" width="495" height="65" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="299.5" y="312.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">PyTorch 参数：weight[N,K]</text><text x="54" y="375" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">F.linear(X, weight) 计算 X @ weight.T</text><text x="54" y="404" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">方阵转置后形状不变，数值仍可能错误。</text><text x="648" y="150" font-size="23" fill="#ef8e38" font-weight="600" text-anchor="start">(b) 沿输出行融合 Q / K / V</text><rect x="650" y="178" width="158" height="58" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="729" y="214.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">Q：[8,8]</text><rect x="650" y="245" width="158" height="48" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="729" y="276.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">K：[4,8]</text><rect x="650" y="312" width="158" height="48" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="729" y="343.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">V：[4,8]</text><path d="M820,268 L884,268" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="896" y="205" width="250" height="119" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1021" y="272.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">融合参数 [16,8]</text><text x="651" y="402" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">行数 = 8 + 4 + 4；输入列数始终为 8</text><rect x="53" y="486" width="225" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="165.5" y="524.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">输入 X：[T,8]</text><path d="M284,516 L338,516" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="347" y="486" width="249" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="471.5" y="524.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">投影结果：[T,16]</text><path d="M602,516 L656,516" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="665" y="469" width="484" height="95" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="907" y="524.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">按 8 / 4 / 4 切开，而非平均三等分</text><text x="600" y="624" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">GQA 的 Q 与 KV 头数不同，融合后的分段长度也不同</text></g></svg>