<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc"><title id="title">输入、缓存与输出的时序</title><desc id="desc">两项 prompt、三项输出需要三次调用；最后缓存四个位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="625" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="56" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">每轮先处理输入，再选出一个新 token</text><text x="195" y="112" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">本轮送入模型</text><text x="535" y="112" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">调用后缓存</text><text x="935" y="112" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">刚选出的输出</text><rect x="55" y="146" width="280" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="195" y="189.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">A、B</text><rect x="395" y="146" width="340" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="565" y="189.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">A、B</text><rect x="795" y="146" width="335" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="962.5" y="189.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">C</text><path d="M345,180 L385,180" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M745,180 L785,180" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="55" y="256" width="280" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="195" y="299.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">C</text><rect x="395" y="256" width="340" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="565" y="299.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">A、B、C</text><rect x="795" y="256" width="335" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="962.5" y="299.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">D</text><path d="M345,290 L385,290" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M745,290 L785,290" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="55" y="366" width="280" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="195" y="409.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">D</text><rect x="395" y="366" width="340" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="565" y="409.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">A、B、C、D</text><rect x="795" y="366" width="335" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="962.5" y="409.1" font-size="26" fill="#22262b" font-weight="500" text-anchor="middle">E → 停止</text><path d="M345,400 L385,400" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M745,400 L785,400" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="490" width="1120" height="105" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="66" y="532" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">共选出 3 项：C、D、E；实际处理过 4 个位置：A、B、C、D。</text><text x="66" y="568" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">最后一项 E 已返回，但没有再次进入前向，因此未写入这次缓存。</text></g></svg>