<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">不同结构保存的状态</title><desc id="desc">KV和latent逐位置增长，线性Attention及标量SSM例子更新固定形状状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="630" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="55" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">下一轮还要用什么？先找到每种结构的状态</text><rect x="30" y="94" width="1140" height="134" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="55" y="139" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">完整 K/V</text><text x="55" y="186" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">每个新位置追加一份 K 和 V</text><rect x="520" y="126" width="90" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="565" y="167.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K / V</text><rect x="630" y="126" width="90" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="675" y="167.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K / V</text><rect x="740" y="126" width="90" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="785" y="167.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K / V</text><rect x="850" y="126" width="90" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="895" y="167.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K / V</text><rect x="960" y="126" width="90" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="1005" y="167.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">K / V</text><path d="M1082,159 L1140,159" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="248" width="1140" height="134" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="55" y="293" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">内容 latent</text><text x="55" y="340" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">每个新位置仍追加一份 latent</text><rect x="520" y="280" width="90" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="565" y="320.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">latent</text><rect x="630" y="280" width="90" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="675" y="320.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">latent</text><rect x="740" y="280" width="90" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="785" y="320.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">latent</text><rect x="850" y="280" width="90" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="895" y="320.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">latent</text><rect x="960" y="280" width="90" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1005" y="320.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">latent</text><path d="M1082,313 L1140,313" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="402" width="1140" height="134" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="55" y="447" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">递推 S、z / h</text><text x="55" y="494" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">更新固定形状状态，融合历史</text><rect x="550" y="435" width="206" height="65" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="653" y="475.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">旧状态</text><path d="M771,467 L855,467" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="872" y="435" width="242" height="65" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="993" y="474.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">更新后的同形状状态</text><text x="600" y="597" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">前两类随 T 增长；固定形状状态不等于可以无损还原全部历史。</text></g></svg>