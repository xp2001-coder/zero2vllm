<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc"><title id="title">latent 内容分支的形状与等价计算</title><desc id="desc">从C展开K与先变换query两条线性等价路径，保留矩阵转置和形状。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="627" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="54" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">latent 内容分支：调整线性计算次序</text><rect x="25" y="89" width="1150" height="214" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="25" y="329" width="1150" height="214" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="52" y="131" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">(a) 先展开历史 key，再与当前 query 点积</text><rect x="55" y="170" width="224" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="167" y="212.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">C [T,r]</text><path d="M291,204 L376,204" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="386" y="170" width="318" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="545" y="212.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">K = C Wk [T,d]</text><path d="M717,204 L802,204" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="814" y="170" width="325" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="976.5" y="212.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">q Kᵀ → [1,T]</text><text x="333" y="269" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">Wk [r,d]</text><text x="795" y="269" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">q [1,d]</text><text x="52" y="371" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">(b) 先变换本轮 query，再与历史 latent 点积</text><rect x="55" y="410" width="224" height="68" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="167" y="452.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">q [1,d]</text><path d="M291,444 L376,444" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="386" y="410" width="318" height="68" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="545" y="452.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">q Wkᵀ [1,r]</text><path d="M717,444 L802,444" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="814" y="410" width="325" height="68" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="976.5" y="451.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">(q Wkᵀ) Cᵀ → [1,T]</text><text x="333" y="510" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">Wkᵀ [d,r]</text><text x="795" y="510" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">Cᵀ [r,T]</text><text x="600" y="588" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">两边保持相同缩放和概率；这里只演示内容分支，没有加入解耦 RoPE。</text></g></svg>