<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc"><title id="title">GQA 分组读取</title><desc id="desc">Q0和Q1读取KV0，Q2和Q3读取KV1，各查询仍有独立权重。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="615" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="57" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">GQA：四个查询头，读取两组历史 K/V</text><rect x="75" y="106" width="247" height="64" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="198.5" y="146.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">Q head 0</text><path d="M333,138 L550,138 L550,183 L675,183" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="75" y="205" width="247" height="64" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="198.5" y="245.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">Q head 1</text><path d="M333,237 L550,237 L550,183 L675,183" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="75" y="304" width="247" height="64" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="198.5" y="344.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">Q head 2</text><path d="M333,336 L550,336 L550,381 L675,381" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="75" y="403" width="247" height="64" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="198.5" y="443.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">Q head 3</text><path d="M333,435 L550,435 L550,381 L675,381" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="687" y="139" width="380" height="88" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="877" y="191.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">KV head 0：历史 K、V</text><rect x="687" y="337" width="380" height="88" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="877" y="389.75" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">KV head 1：历史 K、V</text><text x="600" y="538" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">组内共享 K/V；各 Q 仍独立打分、归一化并得到输出。</text><text x="600" y="581" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">本例映射：kv_head = q_head // 2；不必真的复制 K/V。</text></g></svg>