<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">并发测量窗口与统计样本</title><desc id="desc">四个请求共用2.3秒窗口；成功、达标和间隔样本不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="620" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="55" font-size="28" fill="#22262b" font-weight="600" text-anchor="start">同一份输入，统计窗口与样本集合各有定义</text><rect x="25" y="90" width="608" height="438" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="658" y="90" width="516" height="438" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="52" y="134" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">(a) 并发请求：共用 2.3 秒窗口</text><text x="65" y="206" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">A</text><rect x="114" y="179" width="222.39130434782612" height="37" rx="4" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="343.3913043478261" y="205" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">1.1</text><text x="65" y="273" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">B</text><rect x="134.2173913043478" y="246" width="181.95652173913044" height="37" rx="4" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="323.17391304347825" y="272" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">1.0</text><text x="65" y="340" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">C</text><rect x="154.43478260869566" y="313" width="384.13043478260875" height="37" rx="4" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="545.5652173913044" y="339" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">2.1</text><text x="65" y="407" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">D</text><rect x="174.65217391304347" y="380" width="404.3478260869565" height="37" rx="4" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="586" y="406" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">2.3</text><path d="M114,471 L579,471" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="114" y="502" font-size="17" fill="#22262b" font-weight="400" text-anchor="start">0</text><text x="579" y="502" font-size="17" fill="#64707a" font-weight="400" text-anchor="end">2.3 s</text><text x="684" y="134" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">(b) 先问每个样本代表谁</text><rect x="686" y="175" width="460" height="63" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="916" y="214.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">成功请求：A、B、C → 3 条</text><rect x="686" y="267" width="460" height="63" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="916" y="306.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">达到 SLO：A、B → 2 条</text><rect x="686" y="359" width="460" height="63" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="916" y="397.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">ITL 样本：0.2、0.3、0.6 秒</text><text x="692" y="467" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">D 失败，但仍决定窗口的结束时刻。</text><text x="600" y="582" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">成功输出吞吐 = 6 / 2.3；Goodput = 2 / 2.3。</text></g></svg>