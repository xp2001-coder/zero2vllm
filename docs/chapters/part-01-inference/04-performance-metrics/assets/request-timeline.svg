<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" role="img" aria-labelledby="title desc"><title id="title">请求 A 的时间与延迟</title><desc id="desc">A在0提交、0.2开始服务、0.5/0.7/1.0输出、1.1完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="624" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="56" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">先标出时间点，再选择要计算的时间段</text><path d="M100,205 L1100,205" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M100,180 L100,225" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="100" y="157" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">提交</text><text x="100" y="255" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">0.0 s</text><path d="M281.8181818181818,180 L281.8181818181818,225" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="281.8181818181818" y="157" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">开始服务</text><text x="281.8181818181818" y="255" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">0.2 s</text><path d="M554.5454545454545,180 L554.5454545454545,225" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="554.5454545454545" y="157" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">首项</text><text x="554.5454545454545" y="255" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">0.5 s</text><path d="M736.3636363636363,180 L736.3636363636363,225" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="736.3636363636363" y="157" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">第二项</text><text x="736.3636363636363" y="255" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">0.7 s</text><path d="M1009.090909090909,180 L1009.090909090909,225" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="1009.090909090909" y="157" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">第三项</text><text x="1009.090909090909" y="255" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">1.0 s</text><path d="M1100,180 L1100,225" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="1100" y="157" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">完成</text><text x="1100" y="255" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">1.1 s</text><rect x="100" y="297" width="181.8181818181818" height="43" rx="4" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="190.9090909090909" y="326" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">排队 0.2 s</text><rect x="100" y="362" width="454.5454545454545" height="43" rx="4" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="327.27272727272725" y="391" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">TTFT = 0.5 s</text><rect x="554.5454545454545" y="427" width="181.81818181818176" height="43" rx="4" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="645.4545454545454" y="456" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">0.2 s</text><rect x="736.3636363636363" y="427" width="272.72727272727275" height="43" rx="4" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="872.7272727272726" y="456" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">ITL = 0.3 s</text><rect x="1009.090909090909" y="427" width="90.90909090909099" height="43" rx="4" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="1054.5454545454545" y="456" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">尾部</text><rect x="100" y="492" width="1000" height="43" rx="4" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="600" y="521" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">E2E = 1.1 s</text><text x="600" y="587" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">A：0.5 + 0.2 + 0.3 + 0.1 = 1.1 秒；这是教学模拟时间线。</text></g></svg>