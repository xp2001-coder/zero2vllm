<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">本课采样处理顺序</title><desc id="desc">logits经过penalty和mask，再经过温度、顺序筛选、归一化和抽样；零温度另走greedy。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="545" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="55" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">一次采样：先定义候选分布，再选择 ID</text><rect x="35" y="127" width="209" height="123" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="139" y="169" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">原始分数</text><text x="139" y="215" font-size="17" fill="#64707a" font-weight="400" text-anchor="middle">logits</text><path d="M249,189 L266,189" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="271" y="127" width="209" height="123" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="375" y="169" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">历史与屏蔽</text><text x="375" y="215" font-size="17" fill="#64707a" font-weight="400" text-anchor="middle">penalty / mask</text><path d="M485,189 L502,189" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="507" y="127" width="209" height="123" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="611" y="169" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">温度</text><text x="611" y="215" font-size="17" fill="#64707a" font-weight="400" text-anchor="middle">T &gt; 0</text><path d="M721,189 L738,189" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="743" y="127" width="209" height="123" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="847" y="169" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">筛选</text><text x="847" y="215" font-size="17" fill="#64707a" font-weight="400" text-anchor="middle">k → p → min-p</text><path d="M957,189 L974,189" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="979" y="127" width="209" height="123" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1083" y="169" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">归一化与抽样</text><text x="1083" y="215" font-size="17" fill="#64707a" font-weight="400" text-anchor="middle">输出一个 ID</text><rect x="35" y="302" width="1130" height="152" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="61" y="347" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">温度为 0：在 penalty / mask 后直接选择最大项。</text><text x="61" y="393" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">本课约定跳过概率筛选；并列最大项选择较小 ID。</text><text x="600" y="509" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">正温度路径必须重新归一化；删掉候选后，剩余概率之和通常小于 1。</text></g></svg>