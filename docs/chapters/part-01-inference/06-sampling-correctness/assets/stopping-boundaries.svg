<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="581" viewBox="0 0 1200 581" role="img" aria-labelledby="title desc"><title id="title">停止字符串、输出ID与缓存</title><desc id="desc">两次选择ID2后命中停止字符串，文本裁空，缓存只消费第一项输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="581" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="55" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">跨 token 的停止条件：四份记录要分开</text><text x="176" y="118" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">轮次与输入</text><text x="474" y="118" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">本轮选出</text><text x="777" y="118" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">暂存的新文本</text><text x="1045" y="118" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">缓存长度</text><rect x="48" y="156" width="256" height="75" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="176" y="200.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">1：我、喜欢</text><rect x="331" y="156" width="286" height="75" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="474" y="200.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">ID 2：推理</text><rect x="644" y="156" width="266" height="75" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="777" y="200.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">推理</text><rect x="936" y="156" width="218" height="75" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1045" y="200.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="48" y="274" width="256" height="75" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="176" y="318.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">2：第一项推理</text><rect x="331" y="274" width="286" height="75" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="474" y="318.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">ID 2：推理</text><rect x="644" y="274" width="266" height="75" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="777" y="318.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">推理推理</text><rect x="936" y="274" width="218" height="75" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1045" y="318.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="35" y="402" width="1130" height="148" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="61" y="449" font-size="23" fill="#22262b" font-weight="500" text-anchor="start">匹配 stop = “推理推理”：保留原始 ID [2,2]，显示文本裁为 ""。</text><text x="61" y="499" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">第二项输出没有再次前向；因此输入长度 2 + 已消费输出 1 = 缓存长度 3。</text></g></svg>