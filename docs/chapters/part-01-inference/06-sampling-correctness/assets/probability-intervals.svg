<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="541" viewBox="0 0 1200 541" role="img" aria-labelledby="title desc"><title id="title">累计概率与随机选择</title><desc id="desc">四个候选概率0.4/0.3/0.2/0.1，手工随机数0.65落在ID1。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="541" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><text x="40" y="55" font-size="29" fill="#22262b" font-weight="600" text-anchor="start">用累计概率把 [0,1) 划成可抽中的区间</text><rect x="70" y="185" width="424" height="103" rx="0" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="282" y="226" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">ID 0</text><text x="282" y="265" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">0.4</text><rect x="494" y="185" width="318" height="103" rx="0" fill="#e6f5ef" stroke="#b9c2c8" stroke-width="1.4" /><text x="653" y="226" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">ID 1</text><text x="653" y="265" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">0.3</text><rect x="812" y="185" width="212" height="103" rx="0" fill="#fff0df" stroke="#b9c2c8" stroke-width="1.4" /><text x="918" y="226" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">ID 2</text><text x="918" y="265" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">0.2</text><rect x="1024" y="185" width="106" height="103" rx="0" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><text x="1077" y="226" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">ID 3</text><text x="1077" y="265" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">0.1</text><text x="70" y="328" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">0.0</text><text x="494" y="328" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">0.4</text><text x="812" y="328" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">0.7</text><text x="1024" y="328" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">0.9</text><text x="1130" y="328" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">1.0</text><path d="M759,119 L759,174" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="759" y="103" font-size="22" fill="#22262b" font-weight="600" text-anchor="middle">u = 0.65</text><rect x="84" y="383" width="480" height="67" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="324" y="424.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">0.4 ≤ 0.65 &lt; 0.7 → ID 1</text><rect x="611" y="383" width="480" height="67" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="851" y="424.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">0.7 ≤ 0.75 &lt; 0.9 → ID 2</text><text x="600" y="504" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">区间宽度是概率；一次抽样只返回一个 ID，零概率项没有区间。</text></g></svg>