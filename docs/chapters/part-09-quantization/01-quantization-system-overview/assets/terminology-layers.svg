<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc"><title id="title">terminology-layers</title><desc id="desc">六层信息图：方法、数值、存储、执行、系统和证据；技术名词依上下文分类。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="752" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">同一个量化模型，需要分层描述</text><text x="32" y="82" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">Qwen3-8B-W4A16-G128 是一个标签；下面很多信息仍需读取配置、文件或运行证据</text><rect x="31" y="122" width="1138" height="75" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="59" y="168" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">方法</text><text x="163" y="151" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">算法</text><text x="163" y="180" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">RTN / GPTQ / AWQ / AutoRound</text><text x="910" y="167" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">怎样找到量化参数？</text><rect x="31" y="213" width="1138" height="75" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="59" y="259" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">数值</text><text x="163" y="242" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">方案 + 表示 + 参数</text><text x="163" y="271" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">W4A16；INT4；scale s、zero-point z</text><text x="910" y="258" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">这些数字表示什么？</text><rect x="31" y="304" width="1138" height="75" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="59" y="350" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">存储</text><text x="163" y="333" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">格式 + packing</text><text x="163" y="362" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">checkpoint 张量、位序与版本</text><text x="910" y="349" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">怎样保存、怎样解释？</text><rect x="31" y="395" width="1138" height="75" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="59" y="441" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">执行</text><text x="163" y="424" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">计算布局 + kernel</text><text x="163" y="453" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">repack；Q / DQ / RQ；实际运算类型</text><text x="910" y="440" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">怎样被硬件读入和计算？</text><rect x="31" y="486" width="1138" height="75" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="59" y="532" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">系统</text><text x="163" y="515" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">运行时 + 硬件</text><text x="163" y="544" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">vLLM；A100 或 C500 的实际软件栈</text><text x="910" y="531" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">谁调度执行，在哪里运行？</text><rect x="31" y="577" width="1138" height="75" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="59" y="623" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">证据</text><text x="163" y="606" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">校验 + 实测</text><text x="163" y="635" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">配置 / 文件检查 / 日志 / profiler</text><text x="910" y="622" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">这一行依据是什么？</text><text x="600" y="719" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">一个名称可能跨层复用：GPTQ 算法、GPTQ-compatible 格式要写明上下文。</text></g></svg>