<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="922" viewBox="0 0 1200 922" role="img" aria-labelledby="title desc"><title id="title">requantization-vs-repack</title><desc id="desc">重量化的DQ-Q参考路径、完整含zero-point公式、逐值例子，以及与反量化和repack的区别。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="922" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">重量化 RQ：从一套量化参数转到另一套</text><text x="32" y="82" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">源表示 (q₁, s₁ = 0.5, z₁ = 3) → 目标表示 (q₂, s₂ = 1, z₂ = 2)，两者均为 [0,15]</text><rect x="34" y="125" width="300" height="110" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="184" y="167" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">源量化表示 q₁</text><text x="184" y="202" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">[0, 3, 4, 8, 15]</text><path d="M345,181 L435,181" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="448" y="125" width="304" height="110" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="167" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">反量化 DQ₁</text><text x="600" y="202" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">x̂₁ = s₁ × (q₁ − z₁)</text><path d="M763,181 L853,181" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="866" y="125" width="300" height="110" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="1016" y="167" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">目标量化 Q₂</text><text x="1016" y="202" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">q₂ = clip(round(x̂₁/s₂) + z₂)</text><rect x="34" y="267" width="1132" height="95" rx="9" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="305" font-size="26" fill="#26343e" font-weight="600" text-anchor="middle">q₂ = clip₀…₁₅(round((s₁ / s₂) × (q₁ − z₁)) + z₂)</text><text x="600" y="341" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">本节用浮点中间值验证数学；实际 kernel 可用定点乘数、移位等实现。</text><text x="175" y="408" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">源编码 q₁</text><text x="438" y="408" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">DQ₁ 后 x̂₁</text><text x="706" y="408" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">重量化编码 q₂</text><text x="996" y="408" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">DQ₂ 后 x̂₂</text><rect x="34" y="426" width="1132" height="39" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" /><text x="175" y="454" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">0</text><text x="438" y="454" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">-1.5</text><text x="706" y="454" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">0</text><text x="996" y="454" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">-2</text><rect x="34" y="470" width="1132" height="39" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="175" y="498" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">3</text><text x="438" y="498" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">0</text><text x="706" y="498" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">2</text><text x="996" y="498" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">0</text><rect x="34" y="514" width="1132" height="39" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" /><text x="175" y="542" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">4</text><text x="438" y="542" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">0.5</text><text x="706" y="542" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">2</text><text x="996" y="542" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">0</text><rect x="34" y="558" width="1132" height="39" rx="9" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.4" /><text x="175" y="586" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">8</text><text x="438" y="586" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">2.5</text><text x="706" y="586" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">4</text><text x="996" y="586" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">2</text><rect x="34" y="602" width="1132" height="39" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" /><text x="175" y="630" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">15</text><text x="438" y="630" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">6</text><text x="706" y="630" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">8</text><text x="996" y="630" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">6</text><rect x="34" y="679" width="546" height="112" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="307" y="721" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">反量化 DQ：整数 → 实数</text><text x="307" y="756" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">使用原 s、z 解释已有编码</text><rect x="620" y="679" width="546" height="112" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="893" y="721" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">重量化 RQ：量化表示 → 新量化表示</text><text x="893" y="756" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">目标 s、z、范围决定新舍入和饱和</text><rect x="34" y="815" width="1132" height="73" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="846" font-size="21" fill="#26343e" font-weight="600" text-anchor="middle">repack：改变存储排列，保持逻辑数值；不会自动切换到另一套 scale / zero-point。</text><text x="600" y="873" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">RQ 不保证无损，也不能恢复第一次量化已经丢失的信息。</text></g></svg>