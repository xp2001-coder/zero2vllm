<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="799" viewBox="0 0 1200 799" role="img" aria-labelledby="title desc"><title id="title">production-consumption</title><desc id="desc">量化生产与消费职责图，明确Q、DQ、可选RQ、zero-point与repack的边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="799" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">量化模型的生产与消费</text><text x="32" y="82" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">量化 Q 改变数值；反量化 DQ 解释数值；重量化 RQ 转换到另一套数值参数</text><rect x="30" y="115" width="1140" height="205" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="53" y="150" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(a) 生产：求参数，保存可解释的产物</text><rect x="55" y="179" width="235" height="105" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="172.5" y="221" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">浮点模型与数据</text><text x="172.5" y="256" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">固定权重与校准协议</text><path d="M301,231 L330,231" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="340" y="179" width="235" height="105" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="457.5" y="221" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">算法与参数</text><text x="457.5" y="256" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">求 s、z；定义量化规则</text><path d="M586,231 L615,231" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="625" y="179" width="235" height="105" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="742.5" y="221" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">量化 Q</text><text x="742.5" y="256" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">浮点 x → 逻辑整数 q</text><path d="M871,231 L900,231" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="910" y="179" width="235" height="105" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="1027.5" y="221" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">导出 checkpoint</text><text x="1027.5" y="256" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">打包 q；保存 s、z 等</text><path d="M1028,285 L1028,347" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="55" y="359" width="1090" height="86" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="394" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">共同契约：q + scale s + zero-point z + 范围 / 分组 / 布局</text><text x="600" y="425" font-size="22" fill="#26343e" font-weight="400" text-anchor="middle">Q：q = clip(round(x / s) + z)      DQ：x̂ = s × (q − z)</text><rect x="30" y="482" width="1140" height="205" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="341" y="521" font-size="24" fill="#2d947a" font-weight="600" text-anchor="start">(b) 消费：解释产物，组织计算，再检查收益</text><path d="M172,446 L172,546" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="55" y="550" width="235" height="105" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="172.5" y="592" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">加载与 repack</text><text x="172.5" y="627" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">保持数值含义，调整布局</text><path d="M301,602 L330,602" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="340" y="550" width="235" height="105" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="457.5" y="592" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">计算路径</text><text x="457.5" y="627" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">反量化 DQ / 低精度计算</text><path d="M586,602 L615,602" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="625" y="550" width="235" height="105" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="742.5" y="592" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">输出转换</text><text x="742.5" y="627" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">浮点输出 / 重量化 RQ</text><path d="M871,602 L900,602" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="910" y="550" width="235" height="105" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="1027.5" y="592" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">验证与测量</text><text x="1027.5" y="627" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">质量 / 显存 / 延迟</text><text x="600" y="730" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">RQ 只在需要另一套量化表示时发生；并非每次加载或每个算子都需要。</text><text x="600" y="765" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">图为职责分工；DQ 可在 kernel 内融合，实际路径由格式、算子和硬件共同决定。</text></g></svg>