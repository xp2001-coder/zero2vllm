<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="854" viewBox="0 0 1200 854" role="img" aria-labelledby="title desc"><title id="title">linear-lifecycle</title><desc id="desc">Linear的数值、存储和执行分层，显式标注zero-point、Q、DQ以及条件化RQ。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="854" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">一个 Linear 的生命周期：数值、文件与执行各有一步</text><text x="32" y="82" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">本课手算 Y = XW，W[K,N]；PyTorch Linear.weight 通常存放为 [N,K]</text><rect x="31" y="118" width="1138" height="195" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="152" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(a) 数学层：本节亲手实现</text><rect x="56" y="181" width="300" height="98" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="206" y="223" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">浮点 W[K,N]</text><text x="206" y="258" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">Q：clip(round(W/s) + z)</text><path d="M367,230 L438,230" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="451" y="181" width="300" height="98" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="601" y="223" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">逻辑表示 (q, s, z)</text><text x="601" y="258" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">量化值和解释参数一起保留</text><path d="M762,230 L833,230" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="846" y="181" width="298" height="98" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="995" y="223" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">反量化权重 Ŵ</text><text x="995" y="258" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">DQ：s × (q − z)</text><rect x="31" y="341" width="1138" height="178" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="376" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(b) 存储层：后续 9.7 / 9.8</text><rect x="56" y="405" width="300" height="87" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="206" y="447" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">逻辑值与元数据</text><text x="206" y="482" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">q、s、z、group</text><path d="M367,450 L438,450" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="451" y="405" width="300" height="87" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="601" y="447" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">packing + 写入文件</text><text x="601" y="482" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">规定 bit 位置与格式</text><path d="M762,450 L833,450" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="846" y="405" width="298" height="87" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="995" y="447" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">加载与 repack</text><text x="995" y="482" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">准备后端要求的排列</text><rect x="31" y="548" width="1138" height="187" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="583" font-size="24" fill="#2d947a" font-weight="600" text-anchor="start">(c) 执行层：后续 9.9 / 9.13</text><rect x="56" y="611" width="300" height="96" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="206" y="653" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">vLLM 的量化方法</text><text x="206" y="688" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">创建、加载、前向职责</text><path d="M367,658 L438,658" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="451" y="611" width="300" height="96" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="601" y="653" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">实际 kernel</text><text x="601" y="688" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">DQ + GEMM 或低精度计算</text><path d="M762,658 L833,658" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="846" y="611" width="298" height="96" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="995" y="653" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">浮点或量化输出</text><text x="995" y="688" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">需要量化输出时定义 s₂、z₂</text><text x="600" y="783" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">重量化 RQ：从 (q₁, s₁, z₁) 转到 (q₂, s₂, z₂)，可能再次舍入和饱和。</text><text x="600" y="819" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">repack 只改变布局；RQ 改变量化表示。是否融合执行，需要具体 kernel 证据。</text></g></svg>