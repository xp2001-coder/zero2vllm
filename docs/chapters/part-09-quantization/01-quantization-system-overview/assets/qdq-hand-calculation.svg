<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc"><title id="title">qdq-hand-calculation</title><desc id="desc">手算非方阵的量化、反量化和Linear结果；所有数字对应固定实验夹具。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="755" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">对称特例：zero-point z = 0 的 Linear 手算</text><text x="32" y="82" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">W[3,2] 使用 [-7,7]；s = 3.5 / 7 = 0.5；Q 与 DQ 仍遵循含 z 的通式</text><text x="195" y="146" font-size="25" fill="#2497d0" font-weight="600" text-anchor="middle">原始 W</text><text x="600" y="146" font-size="22" fill="#e8872c" font-weight="600" text-anchor="middle">q = clip(round(W/s) + 0)</text><text x="1005" y="146" font-size="24" fill="#2d947a" font-weight="600" text-anchor="middle">Ŵ = s × (q − 0)</text><rect x="45" y="166" width="300" height="207" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="130" y="219" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">-3.5</text><text x="265" y="219" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">-0.75</text><text x="130" y="278" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">0.25</text><text x="265" y="278" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">1.25</text><text x="130" y="337" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">2.5</text><text x="265" y="337" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">3.5</text><rect x="450" y="166" width="300" height="207" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="535" y="219" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">-7</text><text x="670" y="219" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">-2</text><text x="535" y="278" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">0</text><text x="670" y="278" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">2</text><text x="535" y="337" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">5</text><text x="670" y="337" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">7</text><rect x="855" y="166" width="300" height="207" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="940" y="219" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">-3.5</text><text x="1075" y="219" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">-1</text><text x="940" y="278" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">0</text><text x="1075" y="278" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">1</text><text x="940" y="337" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">2.5</text><text x="1075" y="337" font-size="28" fill="#26343e" font-weight="500" text-anchor="middle">3.5</text><path d="M357,270 L438,270" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="400" y="234" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">÷ 0.5</text><text x="400" y="310" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">取整</text><path d="M762,270 L843,270" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="800" y="234" font-size="18" fill="#64717b" font-weight="400" text-anchor="middle">减 z = 0</text><text x="800" y="310" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">× 0.5</text><rect x="45" y="413" width="1110" height="87" rx="9" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="449" font-size="24" fill="#26343e" font-weight="500" text-anchor="middle">0.25 / 0.5 = 0.5 → q = 0；1.25 / 0.5 = 2.5 → q = 2</text><text x="600" y="479" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">恰在中点时取偶数；这是已明确的舍入规则。</text><rect x="45" y="535" width="530" height="103" rx="9" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.4" /><text x="310" y="577" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">X = [1, 2, −1]，原始 XW</text><text x="310" y="612" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">[−5.5, −1.75]</text><rect x="625" y="535" width="530" height="103" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="890" y="577" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">同一输入，量化后 XŴ</text><text x="890" y="612" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">[−6, −2.5]</text><text x="600" y="684" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">权重最大误差 = 0.25；输出最大误差 = 0.75。两者回答不同的问题。</text><text x="600" y="723" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">本图的 q 是未打包的 Python 整数；尚未得到 4-bit 文件或 GPU 显存收益。</text></g></svg>