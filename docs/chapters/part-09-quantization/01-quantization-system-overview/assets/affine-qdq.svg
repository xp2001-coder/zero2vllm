<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="791" viewBox="0 0 1200 791" role="img" aria-labelledby="title desc"><title id="title">affine-qdq</title><desc id="desc">非零zero-point的仿射Q/DQ网格和手算，展示unsigned编码如何表示负实数与零。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="791" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="45" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">非零 zero-point：整数 3 表示实数 0</text><text x="32" y="82" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">固定仿射参数：s = 0.5，z = 3，q ∈ [0,15]；这是一套无符号 4-bit 逻辑编码</text><rect x="32" y="111" width="1136" height="92" rx="9" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="148" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">量化 Q：q = clip₀…₁₅(round(x / 0.5) + 3)</text><text x="600" y="182" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">反量化 DQ：x̂ = 0.5 × (q − 3)</text><text x="54" y="247" font-size="23" fill="#2497d0" font-weight="600" text-anchor="start">量化网格</text><text x="54" y="281" font-size="19" fill="#64717b" font-weight="400" text-anchor="start">q（编码）</text><text x="54" y="375" font-size="19" fill="#64717b" font-weight="400" text-anchor="start">x̂（实数）</text><line x1="203" y1="320" x2="1128" y2="320" stroke="#bbc8d0" stroke-width="2"/><line x1="205" y1="309" x2="205" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="205" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">0</text><text x="205" y="373" font-size="21" fill="#26343e" font-weight="400" text-anchor="middle">-1.5</text><line x1="266" y1="309" x2="266" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="266" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">1</text><line x1="327" y1="309" x2="327" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="327" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">2</text><line x1="388" y1="309" x2="388" y2="331" stroke="#e8872c" stroke-width="4"/><text x="388" y="286" font-size="20" fill="#e8872c" font-weight="700" text-anchor="middle">3</text><text x="388" y="373" font-size="21" fill="#e8872c" font-weight="700" text-anchor="middle">0</text><line x1="449" y1="309" x2="449" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="449" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">4</text><text x="449" y="373" font-size="21" fill="#26343e" font-weight="400" text-anchor="middle">0.5</text><line x1="510" y1="309" x2="510" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="510" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">5</text><line x1="571" y1="309" x2="571" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="571" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">6</text><line x1="632" y1="309" x2="632" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="632" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">7</text><line x1="693" y1="309" x2="693" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="693" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">8</text><text x="693" y="373" font-size="21" fill="#26343e" font-weight="400" text-anchor="middle">2.5</text><line x1="754" y1="309" x2="754" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="754" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">9</text><line x1="815" y1="309" x2="815" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="815" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">10</text><line x1="876" y1="309" x2="876" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="876" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">11</text><line x1="937" y1="309" x2="937" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="937" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">12</text><line x1="998" y1="309" x2="998" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="998" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">13</text><line x1="1059" y1="309" x2="1059" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="1059" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">14</text><line x1="1120" y1="309" x2="1120" y2="331" stroke="#bbc8d0" stroke-width="2"/><text x="1120" y="286" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">15</text><text x="1120" y="373" font-size="21" fill="#26343e" font-weight="400" text-anchor="middle">6</text><text x="600" y="424" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">s 决定格点间距；z 指出哪一个整数编码对应实数零。</text><rect x="32" y="458" width="1136" height="184" rx="9" fill="white" stroke="#bbc8d0" stroke-width="1.4" /><text x="175" y="492" font-size="20" fill="#64717b" font-weight="600" text-anchor="middle">原值 x</text><text x="370" y="492" font-size="20" fill="#64717b" font-weight="600" text-anchor="middle">x / s</text><text x="565" y="492" font-size="20" fill="#64717b" font-weight="600" text-anchor="middle">round(x/s) + z</text><text x="760" y="492" font-size="20" fill="#64717b" font-weight="600" text-anchor="middle">编码 q</text><text x="955" y="492" font-size="20" fill="#64717b" font-weight="600" text-anchor="middle">DQ：s(q−z)</text><text x="175" y="536" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">-1.5</text><text x="370" y="536" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">-3</text><text x="565" y="536" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">−3 + 3</text><text x="760" y="536" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0</text><text x="955" y="536" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">-1.5</text><text x="175" y="578" font-size="23" fill="#e8872c" font-weight="500" text-anchor="middle">0</text><text x="370" y="578" font-size="23" fill="#e8872c" font-weight="500" text-anchor="middle">0</text><text x="565" y="578" font-size="23" fill="#e8872c" font-weight="500" text-anchor="middle">0 + 3</text><text x="760" y="578" font-size="23" fill="#e8872c" font-weight="500" text-anchor="middle">3</text><text x="955" y="578" font-size="23" fill="#e8872c" font-weight="500" text-anchor="middle">0</text><text x="175" y="620" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.5</text><text x="370" y="620" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">1</text><text x="565" y="620" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">1 + 3</text><text x="760" y="620" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">4</text><text x="955" y="620" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.5</text><rect x="32" y="672" width="1136" height="87" rx="9" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.4" /><text x="600" y="707" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">忘记减 z：0.5 × q = 正确结果 + 1.5；原来的零会被还原成 1.5。</text><text x="600" y="741" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">本课约定先 round(x/s)，再加 z；ties-to-even 下不能随意交换这两步。</text></g></svg>