<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="667" viewBox="0 0 1200 667" role="img" aria-labelledby="title"><title id="title">gptq-compensation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="667" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">GPTQ 的局部补偿：先固定一个坐标，再调整剩余浮点权重</text><text x="32" y="82" font-size="20" fill="#657580" font-weight="400" text-anchor="start">当前残差 e = wᵢ − Q(wᵢ)；δ = −e B[:,i] / B[i,i]，B 是剩余 Hessian 的逆</text><rect x="32" y="123" width="329" height="110" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="196.5" y="165" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">开始：[0.49,0.49]ᵀ</text><text x="196.5" y="205" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">H = [[4,2],[2,2]]</text><path d="M375,178 L421,178" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="434" y="123" width="331" height="110" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="599.5" y="165" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">第一项：0.49 → 0</text><text x="599.5" y="205" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">B = [[0.5,−0.5],[−0.5,1]]</text><path d="M779,178 L826,178" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="839" y="123" width="329" height="110" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="1003.5" y="165" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">变化量：[-0.49,+0.49]ᵀ</text><text x="1003.5" y="205" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">第二项尚未固定</text><rect x="32" y="272" width="1136" height="120" rx="9" fill="#f3f5f7" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="317" font-size="30" fill="#26343e" font-weight="600" text-anchor="middle">剩余第二项：0.49 + 0.49 = 0.98</text><text x="600" y="359" font-size="25" fill="#24866d" font-weight="600" text-anchor="middle">再舍入：0.98 → 1；最终量化权重 [0,1]ᵀ</text><rect x="32" y="430" width="551" height="146" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="57" y="470" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">最近舍入，没有补偿</text><text x="57" y="517" font-size="26" fill="#26343e" font-weight="400" text-anchor="start">输出 SSE = 1.2005</text><rect x="610" y="430" width="558" height="146" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="635" y="470" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">本例的逐步补偿</text><text x="635" y="517" font-size="26" fill="#26343e" font-weight="400" text-anchor="start">输出 SSE = 0.2405</text><text x="600" y="626" font-size="22" fill="#26343e" font-weight="500" text-anchor="middle">条件二次问题可以解析求解；逐步离散选择仍不保证所有问题的全局最优。</text></g></svg>