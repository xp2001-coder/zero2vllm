<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title"><title id="title">algorithm-map</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="725" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">算法从哪里改变结果：先找变量，再看目标</text><text x="32" y="82" font-size="20" fill="#657580" font-weight="400" text-anchor="start">统一数值入口：q = clip(round(w/s) + z)，还原值 ŵ = s(q − z)</text><rect x="32" y="120" width="1136" height="86" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="61" y="172" font-size="27" fill="#26343e" font-weight="600" text-anchor="start">范围</text><text x="230" y="171" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">移动边界与格点间距</text><text x="708" y="171" font-size="22" fill="#657580" font-weight="400" text-anchor="start">裁剪阈值 → s / z</text><rect x="32" y="223" width="1136" height="86" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="61" y="275" font-size="27" fill="#26343e" font-weight="600" text-anchor="start">舍入</text><text x="230" y="274" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">固定网格，改变落点</text><text x="708" y="274" font-size="22" fill="#657580" font-weight="400" text-anchor="start">floor / ceil → 输出误差</text><rect x="32" y="326" width="1136" height="86" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="61" y="378" font-size="27" fill="#26343e" font-weight="600" text-anchor="start">补偿</text><text x="230" y="377" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">固定一项，调整剩余项</text><text x="708" y="377" font-size="22" fill="#657580" font-weight="400" text-anchor="start">输入相关性 → 补偿方向</text><rect x="32" y="429" width="1136" height="86" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="61" y="481" font-size="27" fill="#26343e" font-weight="600" text-anchor="start">变换</text><text x="230" y="480" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">改坐标，保持浮点函数</text><text x="708" y="480" font-size="22" fill="#657580" font-weight="400" text-anchor="start">缩放 / 平移 / 正交旋转</text><rect x="32" y="532" width="1136" height="86" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="61" y="584" font-size="27" fill="#26343e" font-weight="600" text-anchor="start">训练</text><text x="230" y="583" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">更新主权重与量化参数</text><text x="708" y="583" font-size="22" fill="#657580" font-weight="400" text-anchor="start">FakeQuant 前向 + 替代反向</text><text x="600" y="686" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">算法可以组合；每次比较都记录变量、目标、所需信息与搜索成本。</text></g></svg>