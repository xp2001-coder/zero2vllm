<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="659" viewBox="0 0 1200 659" role="img" aria-labelledby="title"><title id="title">rounding-choices</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="659" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">两个权重，四种选择：最近的权重不一定给出最近的输出</text><text x="32" y="82" font-size="20" fill="#657580" font-weight="400" text-anchor="start">X = [[1,1],[1,0]]，W = [0.49,0.49]ᵀ；s=1，z=0，原输出为 [0.98,0.49]ᵀ</text><text x="175" y="141" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">还原权重</text><text x="465" y="141" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">权重 SSE</text><text x="728" y="141" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">层输出</text><text x="1020" y="141" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">输出 SSE</text><rect x="32" y="166" width="1136" height="63" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="175" y="208" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">[0,0]ᵀ · RTN</text><text x="465" y="208" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">.4802</text><text x="728" y="208" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">[0,0]ᵀ</text><text x="1020" y="208" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">1.2005</text><rect x="32" y="244" width="1136" height="63" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="175" y="286" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">[0,1]ᵀ</text><text x="465" y="286" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">.5002</text><text x="728" y="286" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">[1,0]ᵀ</text><text x="1020" y="286" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">.2405</text><rect x="32" y="322" width="1136" height="63" rx="9" fill="white" stroke="#bfd0d8" stroke-width="1.3" /><text x="175" y="364" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">[1,0]ᵀ</text><text x="465" y="364" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">.5002</text><text x="728" y="364" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">[1,1]ᵀ</text><text x="1020" y="364" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">.2605</text><rect x="32" y="400" width="1136" height="63" rx="9" fill="white" stroke="#bfd0d8" stroke-width="1.3" /><text x="175" y="442" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">[1,1]ᵀ</text><text x="465" y="442" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">.5202</text><text x="728" y="442" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">[2,1]ᵀ</text><text x="1020" y="442" font-size="25" fill="#26343e" font-weight="400" text-anchor="middle">1.3005</text><rect x="32" y="507" width="1136" height="112" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="549" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">[0,1] 让权重更远，却让第一行输出里的两个误差更好地抵消。</text><text x="600" y="590" font-size="21" fill="#657580" font-weight="400" text-anchor="middle">穷举只保证给定 floor/ceil 集合内最优；自由变量数量增加时，成本指数增长。</text></g></svg>