<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img" aria-labelledby="title"><title id="title">order-and-groups</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="696" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">不要混淆：原始坐标、处理顺序、量化组和计算块</text><text x="32" y="82" font-size="20" fill="#657580" font-weight="400" text-anchor="start">K=4，原始 G=2；这里只展示映射，不声称已实现动态分组 checkpoint</text><text x="50" y="164" font-size="22" fill="#26343e" font-weight="600" text-anchor="start">原始坐标</text><rect x="397" y="126" width="148" height="62" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="471" y="167" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">0</text><rect x="574" y="126" width="148" height="62" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="648" y="167" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">1</text><rect x="751" y="126" width="148" height="62" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="825" y="167" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">2</text><rect x="928" y="126" width="148" height="62" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="1002" y="167" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">3</text><text x="50" y="258" font-size="22" fill="#26343e" font-weight="600" text-anchor="start">处理顺序 perm</text><rect x="397" y="220" width="148" height="62" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="471" y="261" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">2</text><rect x="574" y="220" width="148" height="62" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="648" y="261" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">0</text><rect x="751" y="220" width="148" height="62" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="825" y="261" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">3</text><rect x="928" y="220" width="148" height="62" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="1002" y="261" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">1</text><text x="50" y="352" font-size="22" fill="#26343e" font-weight="600" text-anchor="start">静态组：随坐标携带组号</text><rect x="397" y="314" width="148" height="62" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="471" y="355" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">1</text><rect x="574" y="314" width="148" height="62" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="648" y="355" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">0</text><rect x="751" y="314" width="148" height="62" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="825" y="355" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">1</text><rect x="928" y="314" width="148" height="62" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="1002" y="355" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">0</text><text x="50" y="446" font-size="22" fill="#26343e" font-weight="600" text-anchor="start">动态组：按处理顺序成组</text><rect x="397" y="408" width="148" height="62" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="471" y="449" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">0</text><rect x="574" y="408" width="148" height="62" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="648" y="449" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">0</text><rect x="751" y="408" width="148" height="62" rx="9" fill="#f3f5f7" stroke="#bfd0d8" stroke-width="1.3" /><text x="825" y="449" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">1</text><rect x="928" y="408" width="148" height="62" rx="9" fill="#f3f5f7" stroke="#bfd0d8" stroke-width="1.3" /><text x="1002" y="449" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">1</text><rect x="32" y="507" width="1136" height="100" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="547" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">动态组映射还原到原始坐标后：g_idx = [0,1,0,1]</text><text x="600" y="583" font-size="21" fill="#657580" font-weight="400" text-anchor="middle">形状正确不代表映射正确；组号必须指向正确的 scale / zero-point。</text><text x="600" y="653" font-size="22" fill="#26343e" font-weight="500" text-anchor="middle">计算 block B=2 只组织两项补偿更新，不自动定义 G=2 或任何磁盘布局。</text></g></svg>