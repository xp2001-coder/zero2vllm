<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title"><title id="title">rotation-boundary</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="690" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">旋转重分布坐标峰值，也带来明确的图变换边界</text><text x="32" y="82" font-size="20" fill="#657580" font-weight="400" text-anchor="start">R为归一化Hadamard；RᵀR=I，XW=(XR)(RᵀW)</text><rect x="32" y="127" width="339" height="110" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="201.5" y="169" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">原输入：[8,0]</text><text x="201.5" y="209" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">最大绝对值 8</text><path d="M386,182 L434,182" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="448" y="127" width="304" height="110" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="169" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">乘以正交矩阵 R</text><text x="600" y="209" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">长度 / 能量保持</text><path d="M767,182 L815,182" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="829" y="127" width="339" height="110" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="998.5" y="169" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">新输入：[4√2,4√2]</text><text x="998.5" y="209" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">最大绝对值 ≈ 5.657</text><rect x="32" y="275" width="1136" height="100" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="316" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">输入平方能量：64 → 64；配套变换权重后，输出：2 → 2</text><text x="600" y="352" font-size="21" fill="#657580" font-weight="400" text-anchor="middle">这个输入的峰值降低，不等于所有输入或所有量化粒度都会改善。</text><rect x="32" y="419" width="1136" height="177" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="57" y="459" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">不能任意穿过非线性</text><text x="57" y="507" font-size="24" fill="#26343e" font-weight="400" text-anchor="start">x=[−1,1]：ReLU(xR) = [0,0]</text><text x="57" y="551" font-size="24" fill="#26343e" font-weight="400" text-anchor="start">但 ReLU(x)R = [1/√2,−1/√2]</text><text x="600" y="645" font-size="22" fill="#26343e" font-weight="500" text-anchor="middle">生产模型还需处理 Norm、残差分支及无法折叠的在线旋转。</text></g></svg>