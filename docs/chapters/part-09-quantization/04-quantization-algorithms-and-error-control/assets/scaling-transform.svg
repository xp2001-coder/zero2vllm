<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title"><title id="title">scaling-transform</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="670" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">通道缩放 d 与量化步长 s：两者不能混为一谈</text><text x="32" y="82" font-size="20" fill="#657580" font-weight="400" text-anchor="start">浮点恒等式 XW = (XD⁻¹)(DW)，D = diag(d)；必须同时变换输入和权重</text><rect x="32" y="130" width="324" height="110" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="194" y="172" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">输入路径：XD⁻¹</text><text x="194" y="212" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">每个输入通道除以 d</text><path d="M370,185 L424,185" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="438" y="130" width="324" height="110" rx="9" fill="#fff0df" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="172" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">权重路径：DW</text><text x="600" y="212" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">对应权重行乘以 d</text><path d="M777,185 L828,185" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="842" y="130" width="326" height="110" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="1005" y="172" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">重算量化参数</text><text x="1005" y="212" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">s / z → Q → DQ</text><rect x="32" y="277" width="1136" height="100" rx="9" fill="#f3f5f7" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="317" font-size="29" fill="#26343e" font-weight="600" text-anchor="middle">量化后输出：Ŷ = (XD⁻¹) · DQ(Q(DW))</text><text x="600" y="355" font-size="22" fill="#657580" font-weight="400" text-anchor="middle">等价变换保持原浮点函数；Q/DQ 之后的误差需要重新测量。</text><text x="56" y="425" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">固定缩放例：X=[[8,1],[8,−1]]，W=[0.13,1]ᵀ</text><rect x="32" y="459" width="208" height="112" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="136" y="500" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">α = 0</text><text x="136" y="545" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">MSE 0.010580</text><rect x="264" y="459" width="208" height="112" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="368" y="500" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">α = 0.25</text><text x="368" y="545" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">MSE 0.101821</text><rect x="496" y="459" width="208" height="112" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="600" y="500" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">α = 0.5</text><text x="600" y="545" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">MSE 0.029647</text><rect x="728" y="459" width="208" height="112" rx="9" fill="#e9f4fb" stroke="#bfd0d8" stroke-width="1.3" /><text x="832" y="500" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">α = 0.75</text><text x="832" y="545" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">MSE 0.006237</text><rect x="960" y="459" width="208" height="112" rx="9" fill="#e5f4ed" stroke="#bfd0d8" stroke-width="1.3" /><text x="1064" y="500" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">α = 1</text><text x="1064" y="545" font-size="20" fill="#657580" font-weight="400" text-anchor="middle">MSE 0.001600</text><text x="600" y="628" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">α=.25 比恒等变换更差；共享网格与舍入变化使收益不单调。</text></g></svg>