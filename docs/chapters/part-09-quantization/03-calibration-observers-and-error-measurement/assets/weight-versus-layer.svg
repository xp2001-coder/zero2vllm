<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="678" viewBox="0 0 1200 678" role="img" aria-labelledby="title"><title id="title">weight-versus-layer</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="678" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">权重误差和输出误差：输入决定哪些方向更重要</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">W=[1,1]ᵀ，X=[8,0]，正确输出 XW=8；候选 A/B 是人为误差探针，不是算法排名</text><rect x="32" y="120" width="550" height="303" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="307" y="163" font-size="27" fill="#26343e" font-weight="600" text-anchor="middle">候选 A</text><text x="307" y="221" font-size="27" fill="#26343e" font-weight="500" text-anchor="middle">ŴA = [0.875, 1]ᵀ</text><text x="307" y="281" font-size="24" fill="#64717b" font-weight="400" text-anchor="middle">权重 MSE = 0.0078125</text><text x="307" y="342" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">输出 = 7；输出 MSE = 1</text><text x="307" y="389" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">权重更接近，输出却更差</text><rect x="617" y="120" width="550" height="303" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="892" y="163" font-size="27" fill="#26343e" font-weight="600" text-anchor="middle">候选 B</text><text x="892" y="221" font-size="27" fill="#26343e" font-weight="500" text-anchor="middle">ŴB = [1, 0.75]ᵀ</text><text x="892" y="281" font-size="24" fill="#64717b" font-weight="400" text-anchor="middle">权重 MSE = 0.03125</text><text x="892" y="342" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">输出 = 8；输出 MSE = 0</text><text x="892" y="389" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">第二维误差在这个输入下没有贡献</text><rect x="32" y="459" width="1136" height="124" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="504" font-size="27" fill="#26343e" font-weight="600" text-anchor="middle">ΔY = XΔW；‖XΔW‖²F = tr(ΔWᵀ XᵀX ΔW)</text><text x="600" y="554" font-size="22" fill="#64717b" font-weight="400" text-anchor="middle">XᵀX = diag(64, 0)：第一维的误差被放大，第二维在这个小样本中未被激发。</text><text x="600" y="639" font-size="22" fill="#26343e" font-weight="500" text-anchor="middle">不能据此永远忽略第二维；换一个输入分布，敏感方向和候选排名也可能改变。</text></g></svg>