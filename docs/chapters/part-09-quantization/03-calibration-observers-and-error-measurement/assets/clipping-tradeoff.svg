<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title"><title id="title">clipping-tradeoff</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="805" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">裁剪阈值：校准误差最小，不保证另一分布也最小</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">合成校准值：256 个 ±0.5、一个 7、一个 0；候选 T 固定，s=T/7，z=0</text><text x="150" y="140" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">阈值 T</text><text x="395" y="140" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">scale s</text><text x="650" y="140" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">校准 MSE</text><text x="957" y="140" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">验证 MSE</text><rect x="32" y="169" width="1136" height="54" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" /><text x="150" y="205" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.5</text><text x="395" y="205" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.071429</text><text x="650" y="205" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.163760</text><text x="957" y="205" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">21.125000</text><rect x="32" y="233" width="1136" height="54" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" /><text x="150" y="269" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">1</text><text x="395" y="269" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.142857</text><text x="650" y="269" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.144597</text><text x="957" y="269" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">18.002551</text><rect x="32" y="297" width="1136" height="54" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" /><text x="150" y="333" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">2</text><text x="395" y="333" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.285714</text><text x="650" y="333" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.101962</text><text x="957" y="333" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">12.502551</text><rect x="32" y="361" width="1136" height="54" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="150" y="397" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">4</text><text x="395" y="397" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">0.571429</text><text x="650" y="397" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">0.039946</text><text x="957" y="397" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">4.502551</text><rect x="32" y="425" width="1136" height="54" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="150" y="461" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">7</text><text x="395" y="461" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">1.000000</text><text x="650" y="461" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.248062</text><text x="957" y="461" font-size="24" fill="#26343e" font-weight="400" text-anchor="middle">0.125000</text><rect x="32" y="525" width="1136" height="99" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="564" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">T=4 在给定候选中校准 MSE 最低；但验证集更偏好 T=7。</text><text x="600" y="602" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">验证输入为 [0.5, −0.5, 7, −7]；这里用于揭示分布变化，没有拿它回头调这次阈值。</text><text x="56" y="677" font-size="23" fill="#2497d0" font-weight="600" text-anchor="start">舍入误差：范围放大，格点变粗。</text><text x="56" y="722" font-size="23" fill="#e8872c" font-weight="600" text-anchor="start">裁剪误差：范围缩小，尾部值被压到端点。</text><text x="56" y="767" font-size="22" fill="#26343e" font-weight="400" text-anchor="start">损失始终对原始值计算；若先裁剪 target 再算误差，会漏掉尾部损失。</text></g></svg>