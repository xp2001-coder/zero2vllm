<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title"><title id="title">reconstruction-inputs</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="756" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">重构输入来自哪里，会改变你在优化的问题</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">FP 主干给 h=[4,1]；上游量化后 h̃=[3,1]；统一教师目标 y=[5]</text><rect x="32" y="120" width="1136" height="187" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="158" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(a) 使用 FP 层输入：隔离当前层误差</text><rect x="57" y="179" width="272" height="104" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="193" y="219" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">h = [4,1]</text><text x="193" y="257" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">固定浮点输入</text><path d="M340,229 L429,229" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="463" y="219" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">A：W₂=[1,1]ᵀ → 输出 5 → MSE=0</text><text x="463" y="264" font-size="24" fill="#26343e" font-weight="400" text-anchor="start">B：W₂=[1.25,1]ᵀ → 输出 6 → MSE=1</text><rect x="32" y="340" width="1136" height="187" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="378" font-size="24" fill="#e8872c" font-weight="600" text-anchor="start">(b) 使用上游量化后的输入：包含已累积偏差</text><rect x="57" y="399" width="272" height="104" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="193" y="439" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">h̃ = [3,1]</text><text x="193" y="477" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">来自量化后的上游</text><path d="M340,449 L429,449" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="463" y="439" font-size="24" fill="#26343e" font-weight="400" text-anchor="start">A：W₂=[1,1]ᵀ → 输出 4 → MSE=1</text><text x="463" y="484" font-size="22" fill="#26343e" font-weight="600" text-anchor="start">B：W₂=[1.25,1]ᵀ → 输出 4.75 → MSE=0.0625</text><rect x="32" y="561" width="1136" height="110" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="604" font-size="25" fill="#26343e" font-weight="600" text-anchor="middle">同一个教师目标、同两组候选参数，输入路径不同，排名反转。</text><text x="600" y="644" font-size="21" fill="#64717b" font-weight="400" text-anchor="middle">记录：缓存位置、输入来自哪条主干、目标来自哪条主干，以及何时释放激活。</text><text x="600" y="719" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">这是两层线性例；真实 block 中的残差、Norm 与非线性需要在明确边界内一起评估。</text></g></svg>