<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="title"><title id="title">ema-order</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="795" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">EMA 不是全局 MinMax：顺序与批次划分都重要</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">本课 α=0.25 是新批次权重；第一次有效输入直接初始化，不从零开始混合</text><rect x="32" y="126" width="1136" height="143" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="56" y="163" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">先 A=[−1,1]，再 B=[−4,8]</text><text x="57" y="221" font-size="23" fill="#64717b" font-weight="400" text-anchor="start">初始范围 [−1,1]</text><path d="M450,213 L631,213" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="691" y="221" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">最终范围 [−1.75,2.75]</text><rect x="32" y="290" width="1136" height="143" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="56" y="327" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">先 B=[−4,8]，再 A=[−1,1]</text><text x="57" y="385" font-size="23" fill="#64717b" font-weight="400" text-anchor="start">初始范围 [−4,8]</text><path d="M450,377 L631,377" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="691" y="385" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">最终范围 [−3.25,6.25]</text><rect x="32" y="454" width="1136" height="143" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="56" y="491" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">把 A、B 合并成一个批次</text><text x="57" y="549" font-size="23" fill="#64717b" font-weight="400" text-anchor="start">一次观察四个元素</text><path d="M450,541 L631,541" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="691" y="549" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">最终范围 [−4,8]</text><rect x="32" y="627" width="1136" height="92" rx="8" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="664" font-size="26" fill="#26343e" font-weight="600" text-anchor="middle">minₜ = (1−α) minₜ₋₁ + α batch_minₜ；max 同理</text><text x="600" y="701" font-size="22" fill="#64717b" font-weight="400" text-anchor="middle">例如 min₂ = 0.75×(−1) + 0.25×(−4) = −1.75</text><text x="600" y="759" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">全局 MinMax 对以上三种组织方式都得到 [−4,8]；EMA 协议还必须记录顺序和 batch。</text></g></svg>