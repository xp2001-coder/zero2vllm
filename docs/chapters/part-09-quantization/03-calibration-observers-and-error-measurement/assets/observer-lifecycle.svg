<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="797" viewBox="0 0 1200 797" role="img" aria-labelledby="title"><title id="title">observer-lifecycle</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="797" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">Observer 先收集，再冻结；Q/DQ 才改变数值</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">静态量化的校准范围固定后，验证集与测试集不能继续更新统计量</text><rect x="32" y="113" width="1136" height="208" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" stroke-dasharray="5 4"/><text x="56" y="150" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(a) 校准阶段：只使用 calibration split</text><rect x="56" y="179" width="280" height="104" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="196" y="219" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">有效激活 X</text><text x="196" y="257" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">剔除 padding 行</text><path d="M347,230 L432,230" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="444" y="179" width="302" height="104" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="595" y="219" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">Observer</text><text x="595" y="257" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">MinMax / EMA / Histogram</text><path d="M757,230 L842,230" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="854" y="179" width="289" height="104" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="998.5" y="219" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">统计量</text><text x="998.5" y="257" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">范围 / 计数 / 候选误差</text><path d="M997,293 L997,365" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="55" y="372" width="1089" height="93" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="409" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">freeze：选规则与范围 → 得到 scale s、zero-point z、qmin / qmax</text><text x="600" y="445" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">本课默认对称 INT4：s = max(|min|,|max|) / 7，z = 0；非对称例保留非零 z。</text><rect x="32" y="514" width="1136" height="203" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" stroke-dasharray="5 4"/><text x="56" y="552" font-size="24" fill="#2d947a" font-weight="600" text-anchor="start">(b) 验证 / 测试：读取冻结参数，禁止 update</text><rect x="56" y="578" width="280" height="104" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="196" y="618" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">独立输入</text><text x="196" y="656" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">校准未使用的记录</text><path d="M347,629 L432,629" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="444" y="578" width="302" height="104" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="595" y="609" font-size="23" fill="#26343e" font-weight="600" text-anchor="middle">量化 Q → 反量化 DQ</text><text x="595" y="640" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">q = clip(round(x/s) + z)</text><text x="595" y="668" font-size="19" fill="#64717b" font-weight="400" text-anchor="middle">x̂ = s(q − z)</text><path d="M757,629 L842,629" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="854" y="578" width="289" height="104" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="998.5" y="618" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">误差与饱和率</text><text x="998.5" y="656" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">MSE / cosine / 超界比例</text><text x="600" y="760" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">FakeQuant 的前向可以模拟 Q/DQ；单纯观察统计量不会自动把浮点网络变成量化网络。</text></g></svg>