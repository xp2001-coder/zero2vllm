<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" role="img" aria-labelledby="title"><title id="title">controlled-studies</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="786" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">两组受控对照：不要一次同时改变所有变量</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">全部为本课合成特征的静态 INT4 Q/DQ；共同测试集含 24 个有效 token、48 个特征元素</text><text x="55" y="132" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(a) 固定数据池、seed 与嵌套顺序，只增加样本数</text><text x="171" y="180" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">文档数</text><text x="464" y="180" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">有效 token</text><text x="739" y="180" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">冻结 scale</text><text x="1010" y="180" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">独立测试 MSE</text><rect x="32" y="202" width="1136" height="47" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="171" y="234" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">2</text><text x="464" y="234" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">11</text><text x="739" y="234" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.142857</text><text x="1010" y="234" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">3.850553</text><rect x="32" y="258" width="1136" height="47" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="171" y="290" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">4</text><text x="464" y="290" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">24</text><text x="739" y="290" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.214286</text><text x="1010" y="290" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">3.013287</text><rect x="32" y="314" width="1136" height="47" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="171" y="346" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">8</text><text x="464" y="346" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">50</text><text x="739" y="346" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">1.000000</text><text x="1010" y="346" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.093750</text><text x="55" y="427" font-size="24" fill="#2d947a" font-weight="600" text-anchor="start">(b) 固定 16 个有效 token，只改变合成数据分布</text><text x="171" y="475" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">分布标签</text><text x="464" y="475" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">有效 token</text><text x="739" y="475" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">冻结 scale</text><text x="1010" y="475" font-size="21" fill="#64717b" font-weight="600" text-anchor="middle">同一测试集 MSE</text><rect x="32" y="497" width="1136" height="47" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="171" y="529" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">general</text><text x="464" y="529" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">16</text><text x="739" y="529" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.214286</text><text x="1010" y="529" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">3.013287</text><rect x="32" y="553" width="1136" height="47" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="171" y="585" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">code</text><text x="464" y="585" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">16</text><text x="739" y="585" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">1.000000</text><text x="1010" y="585" font-size="23" fill="#26343e" font-weight="500" text-anchor="middle">0.093750</text><rect x="32" y="645" width="1136" height="108" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="686" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">本例展示覆盖范围的影响，不证明样本越多必然更好，也不证明某类真实语料更优。</text><text x="600" y="725" font-size="21" fill="#64717b" font-weight="400" text-anchor="middle">测试集只用于报告预先规定的对照；选方案用 validation，最终 test 应独立保留。</text></g></svg>