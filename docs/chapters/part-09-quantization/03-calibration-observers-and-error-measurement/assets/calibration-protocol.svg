<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="729" viewBox="0 0 1200 729" role="img" aria-labelledby="title"><title id="title">calibration-protocol</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="729" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">校准协议：样本数、有效 token 数与 padding 分开记</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">本节使用合成 token ID 与固定特征表；先验证流程，不把它当成真实语言模型</text><rect x="33" y="124" width="224" height="104" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="145" y="164" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">固定原始记录</text><text x="145" y="202" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">split / domain / 摘要</text><path d="M263,176 L326,176" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="336" y="124" width="224" height="104" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="448" y="164" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">固定抽样</text><text x="448" y="202" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">seed + 文档顺序</text><path d="M566,176 L629,176" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="639" y="124" width="224" height="104" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="751" y="164" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">预处理与预算</text><text x="751" y="202" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">特殊 token 与截断</text><path d="M869,176 L932,176" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="942" y="124" width="224" height="104" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="1054" y="164" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">观察有效位置</text><text x="1054" y="202" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">mask → 有效位置</text><rect x="33" y="266" width="1133" height="233" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" stroke-dasharray="5 4"/><text x="57" y="305" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">同样申请 4 个样本、最大长度 8，实际看到的数据可以不同</text><text x="168" y="343" font-size="19" fill="#64717b" font-weight="600" text-anchor="middle">预算</text><text x="415" y="343" font-size="19" fill="#64717b" font-weight="600" text-anchor="middle">使用文档数</text><text x="614" y="343" font-size="19" fill="#64717b" font-weight="600" text-anchor="middle">有效 token</text><text x="811" y="343" font-size="19" fill="#64717b" font-weight="600" text-anchor="middle">padding 槽位</text><text x="1011" y="343" font-size="19" fill="#64717b" font-weight="600" text-anchor="middle">统计元素（2 通道）</text><text x="168" y="400" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">未设 token 上限</text><text x="415" y="400" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">4</text><text x="614" y="400" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">24</text><text x="811" y="400" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">8</text><text x="1011" y="400" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">48</text><text x="168" y="457" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">精确 16 token</text><text x="415" y="457" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">3</text><text x="614" y="457" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">16</text><text x="811" y="457" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">8</text><text x="1011" y="457" font-size="23" fill="#26343e" font-weight="400" text-anchor="middle">32</text><rect x="33" y="533" width="1133" height="112" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="573" font-size="23" fill="#26343e" font-weight="600" text-anchor="start">长度截断：先为 BOS/EOS 留位置；token 预算：最后一个样本只保留前缀。</text><text x="57" y="615" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">预算截断可能去掉 EOS，所以报告同时记录申请数、实际数、BOS/EOS 和 padding。</text><text x="600" y="690" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">统计 mask 和 loss mask 不是同一张表：本节观察保留的 BOS/EOS，评测只计有效预测目标。</text></g></svg>