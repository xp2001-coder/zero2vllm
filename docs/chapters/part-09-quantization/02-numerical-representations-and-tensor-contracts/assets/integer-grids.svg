<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="727" viewBox="0 0 1200 727" role="img" aria-labelledby="title desc"><title id="title">对称与非对称INT4的Q/DQ网格，突出非零zero-point和量化器窄范围。</title><desc id="desc">对称与非对称INT4的Q/DQ网格，突出非零zero-point和量化器窄范围。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="727" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">整数编码与量化网格：zero-point 不能省略</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">本课：先取最近偶数 round(x/s)，再加 z，最后将编码限制在声明范围内</text><rect x="32" y="112" width="1136" height="190" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="55" y="148" font-size="24" fill="#2497d0" font-weight="600" text-anchor="start">(a) 对称：s = 0.5，z = 0，量化器采用 [-7, 7]</text><text x="56" y="188" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">编码 q</text><text x="56" y="266" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">实数 x̂</text><text x="224" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-7</text><circle cx="224" cy="218" r="4" fill="#2497d0"/><text x="224" y="269" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">-3.5</text><text x="284" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-6</text><circle cx="284" cy="218" r="4" fill="#2497d0"/><text x="344" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-5</text><circle cx="344" cy="218" r="4" fill="#2497d0"/><text x="404" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-4</text><circle cx="404" cy="218" r="4" fill="#2497d0"/><text x="404" y="269" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">-2</text><text x="464" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-3</text><circle cx="464" cy="218" r="4" fill="#2497d0"/><text x="524" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-2</text><circle cx="524" cy="218" r="4" fill="#2497d0"/><text x="584" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">-1</text><circle cx="584" cy="218" r="4" fill="#2497d0"/><text x="644" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">0</text><circle cx="644" cy="218" r="7" fill="#e8872c"/><text x="644" y="269" font-size="21" fill="#e8872c" font-weight="500" text-anchor="middle">0</text><text x="704" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">1</text><circle cx="704" cy="218" r="4" fill="#2497d0"/><text x="764" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">2</text><circle cx="764" cy="218" r="4" fill="#2497d0"/><text x="824" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">3</text><circle cx="824" cy="218" r="4" fill="#2497d0"/><text x="884" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">4</text><circle cx="884" cy="218" r="4" fill="#2497d0"/><text x="884" y="269" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">2</text><text x="944" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">5</text><circle cx="944" cy="218" r="4" fill="#2497d0"/><text x="1004" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">6</text><circle cx="1004" cy="218" r="4" fill="#2497d0"/><text x="1064" y="189" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">7</text><circle cx="1064" cy="218" r="4" fill="#2497d0"/><text x="1064" y="269" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">3.5</text><rect x="32" y="327" width="1136" height="190" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="55" y="364" font-size="24" fill="#e8872c" font-weight="600" text-anchor="start">(b) 非对称：s = 0.2，z = 5，采用无符号编码 [0, 15]</text><text x="56" y="404" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">编码 q</text><text x="56" y="483" font-size="18" fill="#64717b" font-weight="400" text-anchor="start">实数 x̂</text><text x="224" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">0</text><circle cx="224" cy="437" r="4" fill="#e8872c"/><text x="224" y="484" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">-1</text><text x="280" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">1</text><circle cx="280" cy="437" r="4" fill="#e8872c"/><text x="336" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">2</text><circle cx="336" cy="437" r="4" fill="#e8872c"/><text x="392" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">3</text><circle cx="392" cy="437" r="4" fill="#e8872c"/><text x="448" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">4</text><circle cx="448" cy="437" r="4" fill="#e8872c"/><text x="504" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">5</text><circle cx="504" cy="437" r="7" fill="#2d947a"/><text x="504" y="484" font-size="21" fill="#2d947a" font-weight="500" text-anchor="middle">0</text><text x="560" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">6</text><circle cx="560" cy="437" r="4" fill="#e8872c"/><text x="616" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">7</text><circle cx="616" cy="437" r="4" fill="#e8872c"/><text x="672" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">8</text><circle cx="672" cy="437" r="4" fill="#e8872c"/><text x="728" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">9</text><circle cx="728" cy="437" r="4" fill="#e8872c"/><text x="784" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">10</text><circle cx="784" cy="437" r="4" fill="#e8872c"/><text x="784" y="484" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">1</text><text x="840" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">11</text><circle cx="840" cy="437" r="4" fill="#e8872c"/><text x="896" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">12</text><circle cx="896" cy="437" r="4" fill="#e8872c"/><text x="952" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">13</text><circle cx="952" cy="437" r="4" fill="#e8872c"/><text x="1008" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">14</text><circle cx="1008" cy="437" r="4" fill="#e8872c"/><text x="1064" y="405" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">15</text><circle cx="1064" cy="437" r="4" fill="#e8872c"/><text x="1064" y="484" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">2</text><rect x="32" y="544" width="1136" height="106" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="580" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">量化 Q：q = clip(round(x/s) + z)       反量化 DQ：x̂ = s(q − z)</text><text x="600" y="619" font-size="22" fill="#64717b" font-weight="400" text-anchor="middle">整数编码 5 可以表示实数 0；编码无符号，不等于原来的实数只能为正。</text><text x="600" y="692" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">有符号 INT4 可编码 [-8,7]；本课对称量化器只用 [-7,7]，两种范围要分别记录。</text></g></svg>