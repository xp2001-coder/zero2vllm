<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">E4M3FN、E5M2、E2M1位域及1.625手算；同一字节的不同解释。</title><desc id="desc">E4M3FN、E5M2、E2M1位域及1.625手算；同一字节的不同解释。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="715" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">低精度浮点：位数相同，数值规则可以不同</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">S 是符号位，E 是指数域，M 是尾数字段；先解释编码，再讨论缩放与计算</text><text x="47" y="152" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">E4M3FN</text><rect x="253" y="123" width="42" height="39" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="274" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">S</text><rect x="300" y="123" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="321" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="347" y="123" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="368" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="394" y="123" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="415" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="441" y="123" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="462" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="488" y="123" width="42" height="39" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="509" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">M</text><rect x="535" y="123" width="42" height="39" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="556" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">M</text><rect x="582" y="123" width="42" height="39" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="603" y="150" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">M</text><text x="670" y="150" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">bias = 7</text><text x="252" y="196" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">最大有限值 448；有 NaN，无 Inf</text><text x="47" y="255" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">E5M2</text><rect x="253" y="226" width="42" height="39" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="274" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">S</text><rect x="300" y="226" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="321" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="347" y="226" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="368" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="394" y="226" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="415" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="441" y="226" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="462" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="488" y="226" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="509" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="535" y="226" width="42" height="39" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="556" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">M</text><rect x="582" y="226" width="42" height="39" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="603" y="253" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">M</text><text x="670" y="253" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">bias = 15</text><text x="252" y="299" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">最大有限值 57344；有 NaN / Inf</text><text x="47" y="358" font-size="25" fill="#26343e" font-weight="600" text-anchor="start">E2M1</text><rect x="253" y="329" width="42" height="39" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="274" y="356" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">S</text><rect x="300" y="329" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="321" y="356" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="347" y="329" width="42" height="39" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="368" y="356" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">E</text><rect x="394" y="329" width="42" height="39" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="415" y="356" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">M</text><text x="670" y="356" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">bias = 1</text><text x="252" y="402" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">最大有限值 6；无 NaN / Inf</text><rect x="32" y="454" width="1136" height="103" rx="8" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="492" font-size="27" fill="#26343e" font-weight="600" text-anchor="middle">E4M3FN：0x3D = 0 | 0111 | 101</text><text x="600" y="531" font-size="25" fill="#26343e" font-weight="500" text-anchor="middle">(−1)⁰ × 2⁽⁷⁻⁷⁾ × (1 + 5/8) = 1.625</text><rect x="32" y="584" width="550" height="96" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="307" y="621" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">同一字节 0x38</text><text x="307" y="657" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">UINT8：56     E4M3FN：1     E5M2：0.5</text><rect x="617" y="584" width="551" height="96" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="892" y="621" font-size="24" fill="#26343e" font-weight="600" text-anchor="middle">类型转换 ≠ 重新解释位模式</text><text x="892" y="657" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">数值 56 转 FP8，与把 0x38 视为 FP8 不同。</text></g></svg>