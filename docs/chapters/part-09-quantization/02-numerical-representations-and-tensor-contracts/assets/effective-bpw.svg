<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" role="img" aria-labelledby="title desc"><title id="title">逐项计算INT4权重、scale、zero-point、尾组和对齐后的25.6bpw。</title><desc id="desc">逐项计算INT4权重、scale、zero-point、尾组和对齐后的25.6bpw。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="786" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">4 bit 权重，需要为哪些额外数据付费？</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">15 个真实权重；INT4 非对称、G=2、FP16 scale；补至 [6,3]；4 字节头，整体 16 字节对齐</text><rect x="32" y="125" width="1136" height="50" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="158" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">真实权重</text><text x="501" y="158" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">15 × 4</text><text x="1095" y="158" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">60 bit</text><rect x="32" y="185" width="1136" height="50" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="218" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">补齐元素</text><text x="501" y="218" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">3 × 4</text><text x="1095" y="218" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">12 bit</text><rect x="32" y="245" width="1136" height="50" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="278" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">9 个 scale</text><text x="501" y="278" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">9 × 16</text><text x="1095" y="278" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">144 bit</text><rect x="32" y="305" width="1136" height="50" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="338" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">9 个 zero-point</text><text x="501" y="338" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">9 × 4</text><text x="1095" y="338" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">36 bit</text><rect x="32" y="365" width="1136" height="50" rx="8" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="398" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">示例头部</text><text x="501" y="398" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">4 × 8</text><text x="1095" y="398" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">32 bit</text><rect x="32" y="425" width="1136" height="50" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="458" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">缓冲区补齐到字节</text><text x="501" y="458" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">zp：36 → 40 bit</text><text x="1095" y="458" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">4 bit</text><rect x="32" y="485" width="1136" height="50" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="518" font-size="22" fill="#26343e" font-weight="500" text-anchor="start">整体分配对齐</text><text x="501" y="518" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">36 → 48 byte</text><text x="1095" y="518" font-size="23" fill="#26343e" font-weight="600" text-anchor="end">96 bit</text><rect x="32" y="567" width="1136" height="107" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" stroke-dasharray="5 4"/><text x="600" y="607" font-size="27" fill="#26343e" font-weight="600" text-anchor="middle">合计 384 bit = 48 byte；effective bpw = 384 / 15 = 25.6</text><text x="600" y="648" font-size="22" fill="#64717b" font-weight="400" text-anchor="middle">分母是 15 个真实权重；不能把补齐出来的 3 个元素也计入分母。</text><text x="600" y="717" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">这是刻意放大的小矩阵开销；大矩阵对称 G128 + FP16 scale 的理想值为 4.125 bpw。</text><text x="600" y="753" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">本课估算声明的三个缓冲区，不代表 Python 对象大小、checkpoint 实际文件或 GPU 显存。</text></g></svg>