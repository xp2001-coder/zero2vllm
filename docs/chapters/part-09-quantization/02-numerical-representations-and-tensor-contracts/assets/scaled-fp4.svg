<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="763" viewBox="0 0 1200 763" role="img" aria-labelledby="title desc"><title id="title">MXFP4和NVFP4的元素数、scale编码、反量化乘数及理想payload位宽。</title><desc id="desc">MXFP4和NVFP4的元素数、scale编码、反量化乘数及理想payload位宽。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="763" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">MXFP4 与 NVFP4：元素编码之外，还有缩放结构</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">下图是数学分解，不定义 checkpoint 排列；scale 的位宽也必须计入成本</text><rect x="32" y="119" width="1136" height="250" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" stroke-dasharray="5 4"/><text x="56" y="157" font-size="25" fill="#2497d0" font-weight="600" text-anchor="start">(a) MXFP4：32 个 E2M1 元素共享 1 个 E8M0 scale</text><rect x="58" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="76" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">1</text><rect x="101" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="119" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">2</text><rect x="144" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="162" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">3</text><rect x="187" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="205" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">4</text><rect x="230" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="248" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">5</text><rect x="273" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="291" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">6</text><rect x="316" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="334" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">7</text><rect x="359" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="377" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">8</text><rect x="402" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="420" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">9</text><rect x="445" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="463" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">10</text><rect x="488" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="506" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">11</text><rect x="531" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="549" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">12</text><rect x="574" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="592" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">13</text><rect x="617" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="635" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">14</text><rect x="660" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="678" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">15</text><rect x="703" y="183" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="721" y="210" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">16</text><rect x="58" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="76" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">17</text><rect x="101" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="119" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">18</text><rect x="144" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="162" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">19</text><rect x="187" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="205" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">20</text><rect x="230" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="248" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">21</text><rect x="273" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="291" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">22</text><rect x="316" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="334" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">23</text><rect x="359" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="377" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">24</text><rect x="402" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="420" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">25</text><rect x="445" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="463" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">26</text><rect x="488" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="506" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">27</text><rect x="531" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="549" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">28</text><rect x="574" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="592" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">29</text><rect x="617" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="635" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">30</text><rect x="660" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="678" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">31</text><rect x="703" y="235" width="36" height="40" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="721" y="262" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">32</text><rect x="798" y="190" width="335" height="99" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="965" y="230" font-size="24" fill="#e8872c" font-weight="600" text-anchor="middle">E8M0：8 bit</text><text x="965" y="265" font-size="21" fill="#26343e" font-weight="400" text-anchor="middle">scale = 2^(code − 127)</text><text x="965" y="312" font-size="17" fill="#64717b" font-weight="400" text-anchor="middle">code 0—254；255 是 NaN，无零编码</text><path d="M754,232 L786,232" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="57" y="339" font-size="22" fill="#26343e" font-weight="400" text-anchor="start">x̂ᵢ = scale × E2M1(codeᵢ)；例：scale code=128 → 2，元素 6 → 实数 12。</text><rect x="32" y="399" width="1136" height="285" rx="8" fill="white" stroke="#bbc8d0" stroke-width="1.3" stroke-dasharray="5 4"/><text x="56" y="438" font-size="24" fill="#2d947a" font-weight="600" text-anchor="start">(b) NVFP4：16 个 E2M1 元素 + E4M3 块 scale + FP32 全局 scale</text><rect x="58" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="76" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">1</text><rect x="101" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="119" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">2</text><rect x="144" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="162" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">3</text><rect x="187" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="205" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">4</text><rect x="230" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="248" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">5</text><rect x="273" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="291" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">6</text><rect x="316" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="334" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">7</text><rect x="359" y="471" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="377" y="498" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">8</text><rect x="58" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="76" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">9</text><rect x="101" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="119" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">10</text><rect x="144" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="162" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">11</text><rect x="187" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="205" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">12</text><rect x="230" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="248" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">13</text><rect x="273" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="291" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">14</text><rect x="316" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="334" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">15</text><rect x="359" y="523" width="36" height="40" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="377" y="550" font-size="17" fill="#26343e" font-weight="400" text-anchor="middle">16</text><rect x="456" y="484" width="286" height="90" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="599" y="520" font-size="23" fill="#e8872c" font-weight="600" text-anchor="middle">块 scale：8 bit</text><text x="599" y="555" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">本课解码采用 E4M3FN</text><path d="M405,529 L444,529" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="813" y="484" width="320" height="90" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="973" y="520" font-size="23" fill="#2497d0" font-weight="600" text-anchor="middle">全局 scale：32 bit</text><text x="973" y="555" font-size="19" fill="#26343e" font-weight="400" text-anchor="middle">本课参数为直接 DQ 乘数</text><path d="M753,529 L800,529" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="57" y="625" font-size="24" fill="#26343e" font-weight="600" text-anchor="start">x̂ᵢ = global_scale × block_scale × E2M1(codeᵢ)</text><text x="57" y="662" font-size="21" fill="#64717b" font-weight="400" text-anchor="start">例：0.5 × 1 × 6 = 3；实际 kernel 的 inverse-scale 变量需先换算约定。</text><text x="600" y="726" font-size="21" fill="#26343e" font-weight="500" text-anchor="middle">MXFP4 payload：4.25 bpw；NVFP4：4.5 + 32/N bpw（完整块，尚未加文件与对齐开销）。</text></g></svg>