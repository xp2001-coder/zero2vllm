<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="657" viewBox="0 0 1200 657" role="img" aria-labelledby="title desc"><title id="title">E2M1非均匀格点与整数均匀格点对比，显示subnormal和FTZ差异。</title><desc id="desc">E2M1非均匀格点与整数均匀格点对比，显示subnormal和FTZ差异。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="657" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">FP4 格点不等距；subnormal 与 FTZ 也影响结果</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">只画非负半轴：E2M1 非负值为 0、0.5、1、1.5、2、3、4、6</text><text x="46" y="148" font-size="23" fill="#2497d0" font-weight="600" text-anchor="start">E2M1</text><line x1="180" y1="190" x2="1080" y2="190" stroke="#bbc8d0" stroke-width="2"/><circle cx="180" cy="190" r="5" fill="#2497d0"/><text x="180" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">0</text><circle cx="250" cy="190" r="5" fill="#2497d0"/><text x="250" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">0.5</text><circle cx="320" cy="190" r="5" fill="#2497d0"/><text x="320" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">1</text><circle cx="390" cy="190" r="5" fill="#2497d0"/><text x="390" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">1.5</text><circle cx="460" cy="190" r="5" fill="#2497d0"/><text x="460" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">2</text><circle cx="600" cy="190" r="5" fill="#2497d0"/><text x="600" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">3</text><circle cx="740" cy="190" r="5" fill="#2497d0"/><text x="740" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">4</text><circle cx="1020" cy="190" r="5" fill="#2497d0"/><text x="1020" y="227" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">6</text><text x="600" y="277" font-size="21" fill="#64717b" font-weight="400" text-anchor="middle">指数越大，相邻格点可以越远：2 → 3 的间隔是 1，4 → 6 的间隔是 2。</text><text x="46" y="333" font-size="23" fill="#e8872c" font-weight="600" text-anchor="start">整数网格</text><line x1="180" y1="369" x2="1080" y2="369" stroke="#bbc8d0" stroke-width="2"/><circle cx="180" cy="369" r="5" fill="#e8872c"/><text x="180" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">0</text><circle cx="320" cy="369" r="5" fill="#e8872c"/><text x="320" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">1</text><circle cx="460" cy="369" r="5" fill="#e8872c"/><text x="460" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">2</text><circle cx="600" cy="369" r="5" fill="#e8872c"/><text x="600" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">3</text><circle cx="740" cy="369" r="5" fill="#e8872c"/><text x="740" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">4</text><circle cx="880" cy="369" r="5" fill="#e8872c"/><text x="880" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">5</text><circle cx="1020" cy="369" r="5" fill="#e8872c"/><text x="1020" y="406" font-size="20" fill="#26343e" font-weight="400" text-anchor="middle">6</text><text x="600" y="450" font-size="22" fill="#64717b" font-weight="400" text-anchor="middle">图示整数网格 s = 1，间隔固定；仿射 zero-point 只平移网格。</text><rect x="32" y="484" width="550" height="135" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="522" font-size="23" fill="#2497d0" font-weight="600" text-anchor="start">E4M3FN：最小正 subnormal</text><text x="307" y="566" font-size="22" fill="#26343e" font-weight="500" text-anchor="middle">0 | 0000 | 001 = 2⁻⁹ = 0.001953125</text><text x="307" y="602" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">这里没有正规数的隐藏前导 1。</text><rect x="617" y="484" width="551" height="135" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="642" y="522" font-size="23" fill="#e8872c" font-weight="600" text-anchor="start">同一编码，显式启用 FTZ</text><text x="892" y="566" font-size="24" fill="#26343e" font-weight="500" text-anchor="middle">2⁻⁹ → 0；信息被丢弃</text><text x="892" y="602" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">本图演示策略，不宣称某块 GPU 的行为。</text></g></svg>