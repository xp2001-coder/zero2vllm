<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="title desc"><title id="title">非方阵K轴分组、scale索引、换轴后的shape及非零zero-point的尾组补零。</title><desc id="desc">非方阵K轴分组、scale索引、换轴后的shape及非零zero-point的尾组补零。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#26343e"/></marker></defs><rect width="1200" height="787" fill="white"/><g font-family="'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif"><text x="32" y="43" font-size="29" fill="#26343e" font-weight="600" text-anchor="start">非方阵与尾组：W[5,3] 沿 K 分组，G = 2</text><text x="32" y="81" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">9 个组各自拥有 (s, z)；最后一组只有一个真实元素，不能把 N 当成 K</text><text x="55" y="137" font-size="20" fill="#64717b" font-weight="400" text-anchor="start">k ↓    n →</text><rect x="75" y="157" width="80" height="44" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="115" y="185" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">-3.5</text><rect x="160" y="157" width="80" height="44" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="200" y="185" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0</text><rect x="245" y="157" width="80" height="44" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="285" y="185" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.25</text><rect x="75" y="206" width="80" height="44" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="115" y="234" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">-0.75</text><rect x="160" y="206" width="80" height="44" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="200" y="234" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">7</text><rect x="245" y="206" width="80" height="44" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="285" y="234" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">1.75</text><rect x="75" y="255" width="80" height="44" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="115" y="283" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.25</text><rect x="160" y="255" width="80" height="44" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="200" y="283" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">1.5</text><rect x="245" y="255" width="80" height="44" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="285" y="283" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">-3.5</text><rect x="75" y="304" width="80" height="44" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="115" y="332" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">1.75</text><rect x="160" y="304" width="80" height="44" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="200" y="332" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">3.5</text><rect x="245" y="304" width="80" height="44" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="285" y="332" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.75</text><rect x="75" y="353" width="80" height="44" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="115" y="381" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">2.5</text><rect x="160" y="353" width="80" height="44" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="200" y="381" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">14</text><rect x="245" y="353" width="80" height="44" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="285" y="381" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">-0.5</text><text x="52" y="187" font-size="18" fill="#64717b" font-weight="400" text-anchor="middle">0</text><text x="52" y="236" font-size="18" fill="#64717b" font-weight="400" text-anchor="middle">1</text><text x="52" y="285" font-size="18" fill="#64717b" font-weight="400" text-anchor="middle">2</text><text x="52" y="334" font-size="18" fill="#64717b" font-weight="400" text-anchor="middle">3</text><text x="52" y="383" font-size="18" fill="#64717b" font-weight="400" text-anchor="middle">4</text><text x="442" y="147" font-size="23" fill="#2497d0" font-weight="600" text-anchor="start">对称：s[g,n]，z 全部为 0</text><rect x="457" y="179" width="90" height="56" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="502" y="207" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.5</text><rect x="552" y="179" width="90" height="56" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="597" y="207" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">1</text><rect x="647" y="179" width="90" height="56" rx="8" fill="#e8f4fc" stroke="#bbc8d0" stroke-width="1.3" /><text x="692" y="207" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.25</text><rect x="457" y="240" width="90" height="56" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="502" y="268" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.25</text><rect x="552" y="240" width="90" height="56" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="597" y="268" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.5</text><rect x="647" y="240" width="90" height="56" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="692" y="268" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.5</text><rect x="457" y="301" width="90" height="56" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="502" y="329" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">2.5/7</text><rect x="552" y="301" width="90" height="56" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="597" y="329" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">2</text><rect x="647" y="301" width="90" height="56" rx="8" fill="#e7f5ee" stroke="#bbc8d0" stroke-width="1.3" /><text x="692" y="329" font-size="20" fill="#26343e" font-weight="500" text-anchor="middle">0.5/7</text><path d="M341,278 L429,278" fill="none" stroke="#26343e" stroke-width="1.7" marker-end="url(#arrow)"/><text x="913" y="179" font-size="22" fill="#26343e" font-weight="600" text-anchor="start">参数索引</text><text x="913" y="226" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">g = floor(k / 2)</text><text x="913" y="273" font-size="22" fill="#26343e" font-weight="400" text-anchor="start">s = scales[g,n]</text><text x="913" y="320" font-size="22" fill="#26343e" font-weight="400" text-anchor="start">z = zeros[g,n]</text><rect x="32" y="442" width="1136" height="90" rx="8" fill="#f0f3f5" stroke="#bbc8d0" stroke-width="1.3" /><text x="600" y="478" font-size="22" fill="#26343e" font-weight="600" text-anchor="middle">改沿 N 分组：W[5,3]，G=2 → 参数 shape [5,2]，最后一列成为尾组。</text><text x="600" y="511" font-size="21" fill="#64717b" font-weight="400" text-anchor="middle">同样的 group_size，不同的 axis，决定了不同的数值模型。</text><rect x="32" y="558" width="1136" height="153" rx="8" fill="#fff0de" stroke="#bbc8d0" stroke-width="1.3" /><text x="57" y="597" font-size="23" fill="#e8872c" font-weight="600" text-anchor="start">非对称尾组中的负数：最后一个真实元素 W[4,2] = −0.5</text><text x="57" y="642" font-size="23" fill="#26343e" font-weight="400" text-anchor="start">s = 0.5/15，z = 15；真实值 −0.5 的编码 q = 0。</text><text x="57" y="685" font-size="21" fill="#26343e" font-weight="400" text-anchor="start">补一行实数零时，q_pad 必须等于 15；若错误地填编码 0，DQ 后会得到 −0.5。</text><text x="600" y="752" font-size="20" fill="#64717b" font-weight="400" text-anchor="middle">上面尾组手算用 float64 scale；FP16 scale 的实际舍入值见实验输出。</text></g></svg>