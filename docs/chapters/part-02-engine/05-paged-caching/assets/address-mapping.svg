<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">逻辑位置与物理 KV 槽位</title><desc id="desc">块大小 B=2。请求 A 占用物理块 0、2，逻辑位置 0、1、2 映射到槽位 0、1、4；请求 B 占用物理块 1。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="510" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="546" height="370" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="594" y="20" width="586" height="370" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="44" y="56" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">请求 A · 逻辑位置</text><rect x="54" y="84" width="100" height="58" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="104" y="120.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 0</text><rect x="164" y="84" width="100" height="58" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="214" y="120.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 1</text><rect x="274" y="84" width="100" height="58" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="324" y="120.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 2</text><text x="426" y="117" font-size="23" fill="#64707a" font-weight="400" text-anchor="start">B = 2</text><path d="M54,157 L254,157" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M54,151 L54,163" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M254,151 L254,163" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="154" y="189" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">逻辑块 0</text><path d="M274,157 L374,157" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M274,151 L274,163" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M374,151 L374,163" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="324" y="189" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">逻辑块 1</text><path d="M154,203 L154,231" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M324,203 L324,231" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="48" y="269" font-size="21" fill="#22262b" font-weight="600" text-anchor="start">块表[A]</text><rect x="154" y="240" width="116" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="212" y="274.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0</text><rect x="324" y="240" width="116" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="382" y="274.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">2</text><text x="154" y="325" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">块表下标 = 逻辑块号</text><text x="154" y="354" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">块表表项 = 物理块号</text><text x="619" y="56" font-size="20" fill="#22262b" font-weight="600" text-anchor="start">共享物理池 · K 与 V 使用相同槽位映射</text><text x="622" y="117" font-size="20" fill="#22262b" font-weight="400" text-anchor="start">物理块 0</text><rect x="720" y="83" width="164" height="52" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="802" y="116.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A : p0</text><rect x="884" y="83" width="164" height="52" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="966" y="116.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A : p1</text><text x="1065" y="116" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">槽位 0,1</text><text x="622" y="189" font-size="20" fill="#22262b" font-weight="400" text-anchor="start">物理块 1</text><rect x="720" y="155" width="164" height="52" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="802" y="188.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">B : p0</text><rect x="884" y="155" width="164" height="52" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="966" y="188.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">B : p1</text><text x="1065" y="188" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">槽位 2,3</text><text x="622" y="261" font-size="20" fill="#22262b" font-weight="400" text-anchor="start">物理块 2</text><rect x="720" y="227" width="164" height="52" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="802" y="260.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A : p2</text><rect x="884" y="227" width="164" height="52" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="966" y="260.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">未写入</text><text x="1065" y="260" font-size="17" fill="#64707a" font-weight="400" text-anchor="start">槽位 4,5</text><path d="M440,267 L576,267 L576,331 L714,331" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="729" y="336" font-size="20" fill="#3da8e8" font-weight="600" text-anchor="start">p = 2 → 物理块 2，偏移 0 → 槽位 4</text><text x="292" y="428" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 逻辑历史保持连续</text><text x="887" y="428" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 物理块可以不相邻</text><text x="600" y="477" font-size="25" fill="#22262b" font-weight="500" text-anchor="middle">slot(p) = table[ floor(p / B) ] × B + (p mod B)</text></g></svg>