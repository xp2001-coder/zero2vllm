<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="588" viewBox="0 0 1200 588" role="img" aria-labelledby="title desc"><title id="title">物理块复用与旧数据的可见边界</title><desc id="desc">释放后的块可能保留旧值。新请求只写入一个位置时，只能读自己的第一个槽位。查询为零向量时，错误读入第二个槽位的旧数据，会把输出从 [3,7] 改成 [51,53]。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="588" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="25" width="350" height="311" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="425" y="25" width="350" height="311" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="830" y="25" width="350" height="311" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="195" y="63" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">旧请求</text><text x="600" y="63" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">归还块的使用权</text><text x="1005" y="63" font-size="24" fill="#22262b" font-weight="600" text-anchor="middle">新请求</text><text x="195" y="100" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">句柄 h1 · L = 2</text><text x="600" y="100" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">物理块 0 回到空闲池</text><text x="1005" y="100" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">句柄 h2 · L = 1</text><rect x="47" y="127" width="296" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="195" y="158.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V[0] = [10, 20]</text><rect x="47" y="185" width="296" height="48" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="195" y="216.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V[1] = [99, 99]</text><rect x="452" y="127" width="296" height="48" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="600" y="158.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V[0] = [10, 20]</text><rect x="452" y="185" width="296" height="48" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="600" y="216.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V[1] = [99, 99]</text><rect x="857" y="127" width="296" height="48" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1005" y="158.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V[0] = [3, 7]</text><rect x="857" y="185" width="296" height="48" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1005" y="216.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">V[1] = [99, 99]</text><path d="M375,176 L416,176" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M780,176 L821,176" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="195" y="274" font-size="20" fill="#3da8e8" font-weight="500" text-anchor="middle">两个槽位均可读取</text><text x="600" y="269" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">物理字节可以保持原样</text><text x="600" y="299" font-size="20" fill="#22262b" font-weight="600" text-anchor="middle">归还后，旧句柄 h1 失效</text><text x="1005" y="274" font-size="19" fill="#339c81" font-weight="600" text-anchor="middle">只允许读取第一个槽位</text><text x="1005" y="303" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">禁止通过旧句柄 h1 读取</text><path d="M866,199 L1143,220" fill="none" stroke="#64707a" stroke-width="1.5" /><text x="600" y="377" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 复用物理块时，旧请求历史不再可见</text><rect x="105" y="414" width="414" height="67" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="312" y="455.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">正确：读 1 个槽位 → [3, 7]</text><rect x="681" y="414" width="414" height="67" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="888" y="454.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">错误：读 2 个槽位 → [51, 53]</text><text x="600" y="515" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">q = [0, 0] 时，softmax 在允许读取的位置上均匀分配权重。</text><text x="600" y="558" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 有效长度限定注意力的读取范围</text></g></svg>