<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="604" viewBox="0 0 1200 604" role="img" aria-labelledby="title desc"><title id="title">有效前缀、预留长度与整块准入</title><desc id="desc">6 个槽位包含 3 个有效位置、2 个预留但未写入的位置和 1 个取整尾部空位。另一个例子中，块大小为 4，两个各预留 5 个位置的请求共需 16 个物理槽位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="604" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="222" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="55" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">B = 2 ｜ 已写入 L = 3 ｜ 预留 R = 5 ｜ 已分配 Q × B = 6</text><rect x="50" y="79" width="168" height="57" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="134" y="114.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 0</text><rect x="230" y="79" width="168" height="57" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="314" y="114.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 1</text><rect x="410" y="79" width="168" height="57" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="494" y="114.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 2</text><rect x="590" y="79" width="168" height="57" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="674" y="114.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 3</text><rect x="770" y="79" width="168" height="57" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="854" y="114.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 4</text><rect x="950" y="79" width="168" height="57" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1034" y="114.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">p = 5</text><path d="M50,153 L578,153" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M590,153 L938,153" fill="none" stroke="#22262b" stroke-width="1.5" /><path d="M950,153 L1118,153" fill="none" stroke="#22262b" stroke-width="1.5" /><text x="314" y="182" font-size="21" fill="#3da8e8" font-weight="600" text-anchor="middle">3 个有效位置</text><text x="764" y="182" font-size="21" fill="#ef8e38" font-weight="600" text-anchor="middle">2 个预留但未写入的位置</text><text x="1034" y="182" font-size="18" fill="#64707a" font-weight="600" text-anchor="middle">1 个取整空位</text><text x="314" y="216" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">注意力可读取</text><text x="764" y="216" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">后续可追加写入</text><text x="1034" y="216" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">超出预留范围 R</text><text x="600" y="279" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 预留容量与可读前缀分开管理</text><rect x="20" y="302" width="1160" height="232" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="339" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">B = 4 ｜ 缓存池：3 块，共 12 个槽位 ｜ R_A = R_B = 5</text><rect x="48" y="364" width="209" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="152.5" y="401.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A · 物理块 0</text><rect x="271" y="364" width="209" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="375.5" y="401.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A · 物理块 1</text><rect x="494" y="364" width="209" height="61" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="598.5" y="401.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">空闲块</text><text x="270" y="458" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A 需要 ⌈5 / 4⌉ = 2 块</text><path d="M725,394 L792,394" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="813" y="364" width="330" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="978" y="401.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">B 等待 · 需要 2 块</text><text x="978" y="459" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">当前仅剩 1 个空闲块</text><text x="600" y="509" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">逻辑预留：5 + 5 = 10 ｜ 物理占用：8 + 8 = 16 &gt; 12</text><text x="600" y="573" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 准入额度按完整物理块计算</text></g></svg>