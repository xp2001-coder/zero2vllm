<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="651" viewBox="0 0 1200 651" role="img" aria-labelledby="title desc"><title id="title">分页 KV 上的注意力计算与因果可见范围</title><desc id="desc">三组 K/V 的分数为 0.7071、0、0.7071，概率约为 0.4011、0.1978、0.4011，输出为 [20,10]。CPU 参考实现按逻辑顺序取回副本，每个查询只读取对应的因果前缀；未使用融合 GPU 算子。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="651" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="288" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="57" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">q = [1, 0] ｜ D = 2 ｜ 块表[A] = [0, 2] ｜ 槽位 = [0, 1, 4]</text><text x="155" y="103" font-size="19" fill="#22262b" font-weight="600" text-anchor="middle">按逻辑顺序取回 K/V</text><rect x="44" y="122" width="222" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="155" y="147.95" font-size="17" fill="#22262b" font-weight="500" text-anchor="middle">K = [1, 0]   V = [10, 0]</text><rect x="44" y="169" width="222" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="155" y="194.95" font-size="17" fill="#22262b" font-weight="500" text-anchor="middle">K = [0, 1]   V = [20, 10]</text><rect x="44" y="216" width="222" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="155" y="241.95" font-size="17" fill="#22262b" font-weight="500" text-anchor="middle">K = [1, 1]   V = [30, 20]</text><text x="433.5" y="103" font-size="19" fill="#22262b" font-weight="600" text-anchor="middle">qKᵀ / √D</text><rect x="330" y="122" width="207" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="433.5" y="149.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0.7071</text><rect x="330" y="169" width="207" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="433.5" y="196.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0.0000</text><rect x="330" y="216" width="207" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="433.5" y="243.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0.7071</text><text x="704.5" y="103" font-size="19" fill="#22262b" font-weight="600" text-anchor="middle">归一化（softmax）</text><rect x="601" y="122" width="207" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="704.5" y="149.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0.4011</text><rect x="601" y="169" width="207" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="704.5" y="196.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0.1978</text><rect x="601" y="216" width="207" height="40" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="704.5" y="243.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">0.4011</text><path d="M276,187 L318,187" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M548,187 L589,187" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M820,187 L866,187" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1004" y="137" font-size="20" fill="#22262b" font-weight="600" text-anchor="middle">对 V 加权求和</text><rect x="888" y="162" width="236" height="70" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="1006" y="206.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">[20, 10]</text><text x="1004" y="271" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">逻辑输入保持一致</text><text x="600" y="348" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 非连续存储保持注意力计算结果不变</text><rect x="20" y="374" width="570" height="205" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="614" y="374" width="566" height="205" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="411" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">因果可见范围</text><text x="45" y="451" font-size="21" fill="#22262b" font-weight="400" text-anchor="start">写入位置 p = i 后：</text><text x="45" y="485" font-size="21" fill="#22262b" font-weight="400" text-anchor="start">只读取位置 0 … i。</text><text x="45" y="546" font-size="18" fill="#64707a" font-weight="400" text-anchor="start">批量写入后，须显式限定可见前缀。</text><rect x="414" y="418" width="32" height="32" rx="2" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><rect x="452" y="418" width="32" height="32" rx="2" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><rect x="490" y="418" width="32" height="32" rx="2" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><rect x="414" y="456" width="32" height="32" rx="2" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><rect x="452" y="456" width="32" height="32" rx="2" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><rect x="490" y="456" width="32" height="32" rx="2" fill="#eef0f2" stroke="#b9c2c8" stroke-width="1.4" /><rect x="414" y="494" width="32" height="32" rx="2" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><rect x="452" y="494" width="32" height="32" rx="2" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><rect x="490" y="494" width="32" height="32" rx="2" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="638" y="411" font-size="22" fill="#22262b" font-weight="600" text-anchor="start">本节的参考执行路径</text><text x="638" y="451" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">按序取数 → 复制 K/V → 计算注意力</text><text x="638" y="480" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">用于检查逻辑顺序与可见范围。</text><text x="638" y="509" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">融合 GPU 算子将在后续章节实现。</text><text x="307" y="620" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 保持因果前缀</text><text x="897" y="620" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(c) CPU 正确性参考</text></g></svg>