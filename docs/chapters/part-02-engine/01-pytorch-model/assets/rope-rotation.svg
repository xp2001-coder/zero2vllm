<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">RoPE：在每对特征上旋转</title><desc id="desc">相邻配对 RoPE 示意。Dh=4 时，分量0、1构成第一对，角度为p；分量2、3构成第二对，角度为p/100。左侧单位圆按真实角度1弧度旋转，右侧给出位置1时向量[1,0,1,0]的数值结果。Q和K使用同样规则，V不旋转。</desc>
<defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1b"/><stop offset="1" stop-color="#101d33"/></linearGradient>
      <radialGradient id="aura"><stop stop-color="#17628b" stop-opacity=".3"/><stop offset="1" stop-color="#17628b" stop-opacity="0"/></radialGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132137"/><stop offset="1" stop-color="#0c1729"/></linearGradient>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#547698" stroke-opacity=".07"/></pattern>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="arrow-54dcff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#54dcff" stroke-width="1.5"/></marker><marker id="arrow-6aa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6aa8ff" stroke-width="1.5"/></marker><marker id="arrow-ae9aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ae9aff" stroke-width="1.5"/></marker><marker id="arrow-57e5be" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#57e5be" stroke-width="1.5"/></marker><marker id="arrow-ff9b99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff9b99" stroke-width="1.5"/></marker>
    </defs>
    <style>text {font-family:'Microsoft YaHei','Noto Sans SC',sans-serif} .mono {font-family:Consolas,'Roboto Mono',monospace}</style>
    <rect width="1600" height="1120" rx="28" fill="url(#bg)"/>
    <rect width="1600" height="1120" rx="28" fill="url(#grid)"/>
    <ellipse cx="1360" cy="80" rx="580" ry="380" fill="url(#aura)"/>
<rect x="64" y="52" width="32" height="32" rx="8" fill="#102a3b" stroke="#54dcff" />
<path d="M73 61 L87 75" fill="none" stroke="#54dcff" stroke-width="2" />
<path d="M87 61 L73 75" fill="none" stroke="#54dcff" stroke-width="2" />
<text x="112" y="76" font-size="27" fill="#e8f2ff" class="mono" font-weight="700">zero2vllm</text>
<text x="315" y="75" font-size="19" fill="#98aec9" class="mono" letter-spacing="1.5">/  COMPUTE NOTES</text>
<text x="1536" y="75" font-size="19" fill="#54dcff" class="mono" text-anchor="end" letter-spacing="1.8">02.01  /  POSITION</text>
<text x="64" y="157" font-size="49" fill="#e8f2ff" font-weight="700">RoPE：在每对特征上旋转</text>
<text x="64" y="205" font-size="25" fill="#98aec9" >保持每对向量的长度，用位置编号决定旋转角度。</text>
<path d="M64 236 L1536 236" fill="none" stroke="#30455f" stroke-width="1" />
<path d="M64 236 L190 236" fill="none" stroke="#54dcff" stroke-width="2" />
<rect x="64" y="276" width="1472" height="202" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 276 H176" stroke="#54dcff" stroke-width="3" opacity=".95"/>
<text x="92" y="326" font-size="21" fill="#54dcff" class="mono" >01</text>
<text x="136" y="326" font-size="27" fill="#e8f2ff" font-weight="600">每个 head 内，相邻两个分量配成一对</text>
<rect x="1290" y="299" width="216" height="36" rx="18" fill="#11243b" stroke="#54dcff" stroke-opacity=".5"/>
<text x="1398" y="323" font-size="18" fill="#54dcff" class="mono" text-anchor="middle">Dh=4 · base=10⁴</text>
<text x="92" y="397" font-size="24" fill="#98aec9" class="mono" >[B,H,T,Dh]</text>
<text x="92" y="441" font-size="24" fill="#98aec9" class="mono" >[1,2,3,4]</text>
<rect x="362" y="355" width="84" height="56" rx="7" fill="#14354b" stroke="#306780" stroke-width="1"/>
<text x="404" y="391" font-size="27" fill="#54dcff" class="mono" text-anchor="middle">q₀</text>
<rect x="458" y="355" width="84" height="56" rx="7" fill="#14354b" stroke="#306780" stroke-width="1"/>
<text x="500" y="391" font-size="27" fill="#54dcff" class="mono" text-anchor="middle">q₁</text>
<rect x="814" y="355" width="84" height="56" rx="7" fill="#292642" stroke="#554b80" stroke-width="1"/>
<text x="856" y="391" font-size="27" fill="#ae9aff" class="mono" text-anchor="middle">q₂</text>
<rect x="910" y="355" width="84" height="56" rx="7" fill="#292642" stroke="#554b80" stroke-width="1"/>
<text x="952" y="391" font-size="27" fill="#ae9aff" class="mono" text-anchor="middle">q₃</text>
<text x="362" y="449" font-size="25" fill="#54dcff" class="mono" >θ₀ = p</text>
<text x="814" y="449" font-size="25" fill="#ae9aff" class="mono" >θ₁ = p / 100</text>
<text x="1138" y="382" font-size="23" fill="#e8f2ff" >Q、K 使用相同规则</text>
<text x="1138" y="426" font-size="23" fill="#98aec9" >V 保持不变</text>
<rect x="64" y="522" width="700" height="480" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 522 H176" stroke="#54dcff" stroke-width="3" opacity=".95"/>
<text x="92" y="572" font-size="21" fill="#54dcff" class="mono" >02</text>
<text x="136" y="572" font-size="27" fill="#e8f2ff" font-weight="600">第一对：位置 p=1</text>
<circle cx="320" cy="798" r="142" fill="#102036" stroke="#35526d" stroke-width="1.5"/>
<path d="M142 798 L504 798" fill="none" stroke="#58728e" stroke-width="1.5" />
<path d="M320 964 L320 626" fill="none" stroke="#58728e" stroke-width="1.5" />
<text x="510" y="806" font-size="22" fill="#98aec9" class="mono" >q₀</text>
<text x="332" y="631" font-size="22" fill="#98aec9" class="mono" >q₁</text>
<text x="300" y="824" font-size="19" fill="#59718e" class="mono" >0</text>
<path d="M320 798 H462" fill="none" stroke="#6aa8ff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-6aa8ff)"/>
<circle cx="462" cy="798" r="5" fill="#6aa8ff" filter="url(#glow)"/>
<path d="M320 798 L396.72292743327586 678.5111201572787" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<circle cx="396.72292743327586" cy="678.5111201572787" r="5" fill="#54dcff" filter="url(#glow)"/>
<path d="M376 798 A56 56 0 0 0 350.2569291286158 750.8776248507578" fill="none" stroke="#54dcff" stroke-width="2"/>
<text x="405" y="758" font-size="22" fill="#54dcff" class="mono" >1 rad</text>
<text x="490" y="840" font-size="22" fill="#6aa8ff" class="mono" >[1,0]</text>
<text x="514" y="652" font-size="23" fill="#54dcff" >逆时针旋转</text>
<text x="514" y="691" font-size="23" fill="#98aec9" >约 57.3°</text>
<text x="92" y="979" font-size="24" fill="#54dcff" class="mono" >[cos(1), sin(1)] ≈ [0.5403, 0.8415]</text>
<path d="M396.72292743327586 678.5111201572787 L396.72292743327586 798" fill="none" stroke="#355c77" stroke-width="1.2" stroke-dasharray="5 5"/>
<rect x="824" y="522" width="712" height="480" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M848 522 H936" stroke="#ae9aff" stroke-width="3" opacity=".95"/>
<text x="852" y="572" font-size="21" fill="#ae9aff" class="mono" >03</text>
<text x="896" y="572" font-size="27" fill="#e8f2ff" font-weight="600">同一位置，两种旋转频率</text>
<text x="852" y="624" font-size="25" fill="#e8f2ff" class="mono" >p = 1</text>
<text x="852" y="670" font-size="25" fill="#98aec9" class="mono" >input  [1, 0 | 1, 0]</text>
<path d="M852 699 L1508 699" fill="none" stroke="#2c405b" stroke-width="1" />
<text x="852" y="742" font-size="25" fill="#54dcff" >第一对 · θ₀ = 1 rad</text>
<text x="852" y="788" font-size="30" fill="#54dcff" class="mono" >[0.540302, 0.841471]</text>
<text x="852" y="845" font-size="25" fill="#ae9aff" >第二对 · θ₁ = 0.01 rad</text>
<text x="852" y="891" font-size="30" fill="#ae9aff" class="mono" >[0.999950, 0.010000]</text>
<path d="M852 919 L1508 919" fill="none" stroke="#2c405b" stroke-width="1" />
<text x="852" y="965" font-size="23" fill="#98aec9" >两对的平方和都保持为 1（舍入前）</text>
<path d="M64 1042 L1536 1042" fill="none" stroke="#2c425d" stroke-width="1" />
<circle cx="71" cy="1071" r="5" fill="#57e5be" filter="url(#glow)"/>
<text x="90" y="1078" font-size="22" fill="#98aec9" >角度单位为弧度；本节使用相邻分量配对，不跨越 head 边界。</text>
<text x="1536" y="1078" font-size="19" fill="#59718e" class="mono" text-anchor="end">POSITION 0 → IDENTITY</text>
</svg>
