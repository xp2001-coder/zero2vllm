<path d="M580 348 H610" fill="none" stroke="#6aa8ff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-6aa8ff)"/>
<rect x="624" y="282" width="280" height="132" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M648 282 H736" stroke="#54dcff" stroke-width="3" opacity=".95"/>
<text x="764" y="333" font-size="25" fill="#54dcff" text-anchor="middle" font-weight="600">DecoderBlock × 2</text>
<text x="764" y="381" font-size="23" fill="#98aec9" class="mono" text-anchor="middle">[1,3,8]</text>
<path d="M906 348 H936" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<rect x="950" y="282" width="236" height="132" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M974 282 H1062" stroke="#57e5be" stroke-width="3" opacity=".95"/>
<text x="1068" y="333" font-size="25" fill="#57e5be" text-anchor="middle" font-weight="600">final RMSNorm</text>
<text x="1068" y="381" font-size="23" fill="#98aec9" class="mono" text-anchor="middle">[1,3,8]</text>
<path d="M1188 348 H1218" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<rect x="1232" y="282" width="304" height="132" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M1256 282 H1344" stroke="#ae9aff" stroke-width="3" opacity=".95"/>
<text x="1384" y="333" font-size="25" fill="#ae9aff" text-anchor="middle" font-weight="600">LM Head → logits</text>
<text x="1384" y="381" font-size="23" fill="#98aec9" class="mono" text-anchor="middle">[1,3,16]</text>
<path d="M764 415 V447 H610 V469" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<text x="796" y="454" font-size="20" fill="#98aec9" class="mono" >两层结构相同，参数各自独立</text>
<rect x="64" y="488" width="992" height="652" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 488 H176" stroke="#54dcff" stroke-width="3" opacity=".95"/>
<text x="92" y="538" font-size="21" fill="#54dcff" class="mono" >01</text>
<text x="136" y="538" font-size="27" fill="#e8f2ff" font-weight="600">展开一层：两次残差都保持 [1,3,8]</text>
<text x="610" y="581" font-size="26" fill="#e8f2ff" class="mono" text-anchor="middle">X</text>
<path d="M610 590 V607" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<rect x="410" y="620" width="400" height="62" rx="14" fill="#14263d" stroke="#34506b" />
<text x="610" y="654" font-size="25" fill="#54dcff" text-anchor="middle" font-weight="600">RMSNorm₁</text>
<path d="M610 683 V704" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<rect x="410" y="718" width="400" height="68" rx="14" fill="#14263d" stroke="#34506b" />
<text x="610" y="752" font-size="25" fill="#54dcff" text-anchor="middle" font-weight="600">Attention → 合头 → O</text>
<path d="M610 787 V807" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<circle cx="610" cy="838" r="24" fill="#192b43" stroke="#54dcff" stroke-width="2"/>
<text x="610" y="848" font-size="35" fill="#54dcff" text-anchor="middle">+</text>
<path d="M610 590 H298 V838 H576" fill="none" stroke="#6aa8ff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-6aa8ff)"/>
<circle cx="610" cy="590" r="5" fill="#6aa8ff" filter="url(#glow)"/>
<text x="273" y="666" font-size="25" fill="#6aa8ff" class="mono" text-anchor="end">X</text>
<text x="92" y="748" font-size="23" fill="#98aec9" >读取可见位置</text>
<text x="92" y="785" font-size="23" fill="#98aec9" >输出回到 D 维</text>
<text x="652" y="847" font-size="21" fill="#98aec9" class="mono" >U = X + Attention(...)</text>
<path d="M610 863 V883" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<rect x="410" y="896" width="400" height="62" rx="14" fill="#14263d" stroke="#34506b" />
<text x="610" y="930" font-size="25" fill="#57e5be" text-anchor="middle" font-weight="600">RMSNorm₂</text>
<path d="M610 959 V978" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<rect x="410" y="990" width="400" height="62" rx="14" fill="#14263d" stroke="#34506b" />
<text x="610" y="1024" font-size="25" fill="#57e5be" text-anchor="middle" font-weight="600">SwiGLU → down</text>
<path d="M610 1053 V1067" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<circle cx="610" cy="1097" r="24" fill="#192b43" stroke="#57e5be" stroke-width="2"/>
<text x="610" y="1107" font-size="35" fill="#57e5be" text-anchor="middle">+</text>
<path d="M610 874 H940 V1097 H644" fill="none" stroke="#ae9aff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-ae9aff)"/>
<circle cx="610" cy="874" r="5" fill="#ae9aff" filter="url(#glow)"/>
<text x="962" y="979" font-size="25" fill="#ae9aff" class="mono" >U</text>
<text x="92" y="943" font-size="24" fill="#57e5be" class="mono" >D → F → D</text>
<text x="92" y="982" font-size="24" fill="#98aec9" class="mono" >8 → 16 → 8</text>
<text x="92" y="1098" font-size="25" fill="#57e5be" class="mono" >Y = U + MLP(...)</text>
<path d="M585 1097 H353" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<rect x="1112" y="488" width="424" height="652" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M1136 488 H1224" stroke="#ae9aff" stroke-width="3" opacity=".95"/>
<text x="1140" y="538" font-size="21" fill="#ae9aff" class="mono" >02</text>
<text x="1184" y="538" font-size="27" fill="#e8f2ff" font-weight="600">取最后位置的预测</text>
<text x="1140" y="583" font-size="20" fill="#98aec9" >seed=7 / float64 / 未训练</text>
<text x="1140" y="634" font-size="22" fill="#98aec9" class="mono" >可见前缀</text>
<text x="1504" y="634" font-size="22" fill="#98aec9" class="mono" text-anchor="end">argmax</text>
<rect x="1140" y="656" width="368" height="58" rx="10" fill="#142138" stroke="#2b405c" />
<text x="1158" y="694" font-size="26" fill="#98aec9" class="mono" >[1]</text>
<text x="1488" y="694" font-size="29" fill="#98aec9" class="mono" text-anchor="end">5</text>
<rect x="1140" y="726" width="368" height="58" rx="10" fill="#142138" stroke="#2b405c" />
<text x="1158" y="764" font-size="26" fill="#98aec9" class="mono" >[1,2]</text>
<text x="1488" y="764" font-size="29" fill="#98aec9" class="mono" text-anchor="end">9</text>
<rect x="1140" y="796" width="368" height="58" rx="10" fill="#17423f" stroke="#377f71" />
<text x="1158" y="834" font-size="26" fill="#57e5be" class="mono" >[1,2,3]</text>
<text x="1488" y="834" font-size="29" fill="#57e5be" class="mono" text-anchor="end">10</text>
<path d="M1324 855 V883" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<text x="1140" y="925" font-size="25" fill="#e8f2ff" >追加一个新 ID</text>
<text x="1140" y="974" font-size="29" fill="#57e5be" class="mono" >[1,2,3] + [10]</text>
<path d="M1140 1002 L1508 1002" fill="none" stroke="#2c405b" stroke-width="1" />
<text x="1140" y="1045" font-size="23" fill="#98aec9" >下一轮输入 [1,2,3,10]</text>
<text x="1140" y="1088" font-size="23" fill="#98aec9" >重新计算完整前缀</text>
<path d="M64 1174 L1536 1174" fill="none" stroke="#2c425d" stroke-width="1" />
<circle cx="71" cy="1203" r="5" fill="#57e5be" filter="url(#glow)"/>
<text x="90" y="1210" font-size="22" fill="#98aec9" >两次残差相加都要求输出恢复为 [B,T,D]；当前模型每轮重算完整前缀。</text>
<text x="1536" y="1210" font-size="19" fill="#59718e" class="mono" text-anchor="end">CPU · EAGER · NO KV CACHE</text>
</svg>
