<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="687" viewBox="0 0 1200 687" role="img" aria-labelledby="title desc"><title id="title">断连取消与资源回收</title><desc id="desc">网络观察断连后应用取消请求，引擎关闭上下文并归还额度，随后结束传输任务与请求记录。同步前向不能被安全强制中断，共享块还需保留同伴引用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="687" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="467" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="62" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">客户端断开后，取消需要沿所有权一路传回去</text><rect x="51" y="92" width="420" height="64" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="261" y="132.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">① 网络层观察断连</text><text x="525" y="132" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">http.disconnect 或 send 失败</text><path d="M260,162 L260,181" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="51" y="187" width="420" height="64" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="261" y="227.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">② 应用撤销请求使用权</text><text x="525" y="227" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">service.cancel → engine.cancel</text><path d="M260,257 L260,276" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="51" y="282" width="420" height="64" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="261" y="322.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">③ 引擎归还资源</text><text x="525" y="322" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">context.close：归还 KV 引用与额度</text><path d="M260,352 L260,371" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="51" y="377" width="420" height="64" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="261" y="417.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">④ 结束传输与记录</text><text x="525" y="417" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">停止发送 / 监听任务，forget 请求</text><text x="600" y="531" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 关掉网页或跳出读取循环，本身并不会直接释放引擎的 KV</text><rect x="20" y="558" width="1160" height="101" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="600" y="601" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">已在同步前向中的工作，先等它返回；被其他请求引用的共享块继续存活</text><text x="600" y="633" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">断连观察与收尾存在延迟；测试核对最终状态与同伴输出，不要求恰好只生成一项</text></g></svg>