<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="698" viewBox="0 0 1200 698" role="img" aria-labelledby="title desc"><title id="title">请求路径与三个完成边界</title><desc id="desc">客户端 JSON 经 HTTP 服务器和应用校验进入引擎。输出依次经历模型提交、ASGI 发送完成和客户端读取，三者不能混为一谈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="698" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="272" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">一条请求，经过哪些层才成为模型输入？</text><rect x="48" y="110" width="231" height="70" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="163.5" y="153.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">客户端</text><path d="M286,145 L329,145" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="337" y="110" width="231" height="70" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="452.5" y="153.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">HTTP 服务器</text><path d="M575,145 L618,145" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="626" y="110" width="231" height="70" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="741.5" y="153.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">应用校验</text><path d="M864,145 L907,145" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="915" y="110" width="231" height="70" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1030.5" y="153.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">请求引擎</text><text x="164" y="226" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">提交 JSON</text><text x="453" y="226" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">解析 HTTP 协议</text><text x="742" y="226" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">检查字段与容量</text><text x="1031" y="226" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">分配 KV，执行前向</text><text x="600" y="334" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) Uvicorn 负责网络协议，课程代码负责生成请求的语义</text><rect x="20" y="364" width="1160" height="256" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="407" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">同一个输出，也有三个不同的完成时刻</text><rect x="57" y="446" width="287" height="62" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="200.5" y="485.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">模型已生成</text><text x="200" y="550" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">token 已提交到请求记录</text><path d="M352,477 L444,477" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="453" y="446" width="287" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="596.5" y="485.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">服务器已交出</text><text x="596" y="550" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">一次 ASGI send 已返回</text><path d="M748,477 L840,477" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="849" y="446" width="287" height="62" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="992.5" y="485.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">客户端已读到</text><text x="992" y="550" font-size="18" fill="#64707a" font-weight="400" text-anchor="middle">拼出完整事件并通过校验</text><text x="600" y="663" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 前一层完成，不自动证明后一层已经收到</text></g></svg>