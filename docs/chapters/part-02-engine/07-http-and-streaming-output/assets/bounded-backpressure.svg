<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="662" viewBox="0 0 1200 662" role="img" aria-labelledby="title desc"><title id="title">有界队列与慢客户端隔离</title><desc id="desc">A 的发送被阻塞，一条事件在途，容量为二的队列保留另外两条事件，驱动器暂缓 A；有可用运行名额和 KV 时，B 仍可完成。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="662" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="264" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">向客户端 A 发送受阻：限制服务端待发队列</text><rect x="48" y="110" width="243" height="65" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="169.5" y="150.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">A：暂缓下一步</text><path d="M299,143 L374,143" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="384" y="90" width="308" height="120" rx="6" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><rect x="405" y="120" width="119" height="57" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="464.5" y="155.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">事件 2</text><rect x="548" y="120" width="119" height="57" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="607.5" y="155.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">事件 3</text><path d="M700,143 L769,143" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="782" y="110" width="345" height="65" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="954.5" y="150.55" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">事件 1：发送仍在等待</text><text x="538" y="245" font-size="21" fill="#3da8e8" font-weight="600" text-anchor="middle">容量 Q = 2，已满</text><text x="954" y="245" font-size="21" fill="#ef8e38" font-weight="600" text-anchor="middle">另有 1 条在途事件</text><text x="600" y="325" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 本例最多积压 Q 条队列事件，再加一条发送中的事件</text><rect x="20" y="353" width="1160" height="228" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="395" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">另一个客户端 B 仍然可以推进</text><rect x="48" y="438" width="243" height="64" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="169.5" y="478.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B：执行下一步</text><path d="M299,470 L374,470" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="384" y="438" width="308" height="64" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="538" y="477.7" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">B 的独立队列有空位</text><path d="M700,470 L769,470" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="782" y="438" width="345" height="64" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="954.5" y="478.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">正常读取并最终完成</text><text x="600" y="548" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">前提：还有运行名额和 KV 额度；慢请求仍占用这些资源，超时后才撤销</text><text x="600" y="626" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 驱动器跳过满队列，不在某条请求的入队操作上等待</text></g></svg>