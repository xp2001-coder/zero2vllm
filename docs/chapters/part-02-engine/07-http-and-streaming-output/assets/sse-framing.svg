<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="674" viewBox="0 0 1200 674" role="img" aria-labelledby="title desc"><title id="title">SSE 事件与网络分块</title><desc id="desc">一条事件由 event 行、data 行和空行组成。网络可能拆分事件和 UTF-8 字符，也可能合并多条事件，客户端需增量拼帧。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="674" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="250" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">SSE 用空行标记一条事件的结束</text><rect x="48" y="87" width="710" height="144" rx="6" fill="#e7f4fd" stroke="#b9c2c8" stroke-width="1.4" /><text x="68" y="123" font-size="23" fill="#22262b" font-weight="400" text-anchor="start">event: token</text><text x="68" y="160" font-size="22" fill="#22262b" font-weight="400" text-anchor="start">data: {"seq":1,"index":0,"token_id":12,...}</text><text x="68" y="199" font-size="22" fill="#3da8e8" font-weight="600" text-anchor="start">↵ 空行</text><path d="M768,196 L822,196" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="845" y="145" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">完整事件到齐</text><text x="845" y="181" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">再解析其中的 JSON</text><text x="845" y="217" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">半条事件继续等待</text><text x="600" y="312" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 事件类型、JSON 数据、空行：三个部分一起构成帧</text><rect x="20" y="341" width="1160" height="252" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="382" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">网络读取的分块，可能落在任意字节位置</text><text x="221" y="427" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">第 1 次读取</text><rect x="56" y="450" width="330" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="221" y="488.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">event: to</text><path d="M394,480 L432,480" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="605" y="427" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">第 2 次读取</text><rect x="440" y="450" width="330" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="605" y="488.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">ken + 部分 data</text><path d="M778,480 L816,480" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><text x="989" y="427" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">第 3 次读取</text><rect x="824" y="450" width="330" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="989" y="488.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">剩余 data + 空行</text><text x="600" y="557" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">一个读取块也可能包含多条事件；中文字符的 UTF-8 字节也可能被拆开</text><text x="600" y="639" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) token、SSE 事件、ASGI 消息、网络读取块并不一一对应</text></g></svg>