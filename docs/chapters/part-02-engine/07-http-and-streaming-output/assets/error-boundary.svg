<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">HTTP 状态与流内终止事件</title><desc id="desc">响应开始前用 HTTP 状态表达错误，流开始后用 done 或 error 表达终态。连接结束但没有终止事件只能视为不完整结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="670" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="260" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">响应开始之前：仍可选择 HTTP 错误状态</text><rect x="51" y="101" width="233" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="167.5" y="141.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">400</text><text x="167" y="207" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">JSON 损坏</text><rect x="339" y="101" width="233" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="455.5" y="141.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">413</text><text x="455" y="207" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">请求体太大</text><rect x="627" y="101" width="233" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="743.5" y="141.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">422</text><text x="743" y="207" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">生成参数无效</text><rect x="915" y="101" width="233" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1031.5" y="141.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">503</text><text x="1031" y="207" font-size="22" fill="#64707a" font-weight="400" text-anchor="middle">服务入口已满</text><text x="600" y="303" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 返回普通 JSON 错误；尚未接受生成请求时不分配 KV</text><rect x="20" y="333" width="1160" height="258" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="376" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">流式响应已经开始：用终止事件说明结果</text><rect x="47" y="401" width="620" height="47" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="357" y="431.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">accepted → token → done</text><text x="710" y="433" font-size="22" fill="#22262b" font-weight="500" text-anchor="start">生成正常完成</text><rect x="47" y="459" width="620" height="47" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="357" y="489.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">accepted → token → error</text><text x="710" y="491" font-size="22" fill="#22262b" font-weight="500" text-anchor="start">生成中途失败或被取消</text><rect x="47" y="517" width="620" height="47" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="357" y="547.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">accepted → token → 连接结束</text><text x="710" y="549" font-size="22" fill="#22262b" font-weight="500" text-anchor="start">缺少终止事件：结果不完整</text><text x="600" y="635" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) HTTP 200 说明流已建立，不保证整段生成成功</text></g></svg>