<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title desc"><title id="title">异步任务与同步前向的边界</title><desc id="desc">单事件循环在等待处调度引擎、发送和断连监听。Tiny 同步前向不会自动并行，断连只能在同步执行返回后被处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="666" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="406" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">一个事件循环：在等待处让出执行机会</text><text x="45" y="151" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">引擎任务</text><path d="M203,143 L1130,143" fill="none" stroke="#b9c2c8" stroke-width="1.5" /><text x="45" y="255" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">发送任务</text><path d="M203,247 L1130,247" fill="none" stroke="#b9c2c8" stroke-width="1.5" /><text x="45" y="359" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">断连监听</text><path d="M203,351 L1130,351" fill="none" stroke="#b9c2c8" stroke-width="1.5" /><rect x="211" y="113" width="252" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="337" y="150.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">同步前向：占用线程</text><rect x="489" y="113" width="474" height="61" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="726" y="151.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">让出执行机会，处理其他任务</text><rect x="986" y="113" width="160" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1066" y="150.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">下一次前向</text><rect x="489" y="217" width="229" height="61" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="603.5" y="255.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">处理发送</text><rect x="746" y="217" width="217" height="61" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="854.5" y="254.5" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">等待下一项结果</text><rect x="211" y="321" width="507" height="61" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="464.5" y="358.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">等待断连消息</text><rect x="746" y="321" width="217" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="854.5" y="358.85" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">处理断连消息</text><text x="600" y="469" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 多个任务交替推进；同步前向期间，其他任务仍需等待</text><rect x="20" y="498" width="1160" height="134" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="541" font-size="23" fill="#22262b" font-weight="500" text-anchor="start">async def 声明协程，await 等待可等待对象，yield 交出一项结果</text><text x="45" y="586" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">等待有机会让出线程；把函数写成 async，不会自动把模型计算搬到另一张卡或另一条线程。</text></g></svg>