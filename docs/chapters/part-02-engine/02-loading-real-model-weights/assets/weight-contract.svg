<path d="M88 768 H176" stroke="#57e5be" stroke-width="3" opacity=".95"/>
<text x="96" y="811" font-size="28" fill="#57e5be" font-weight="600">共享参数</text>
<rect x="605" y="810" width="390" height="96" rx="14" fill="#142d3b" stroke="#57e5be" />
<text x="800" y="851" font-size="30" fill="#57e5be" class="mono" text-anchor="middle">E [49152,576]</text>
<text x="800" y="883" font-size="22" fill="#98aec9" text-anchor="middle">同一个 Parameter 对象</text>
<text x="117" y="872" font-size="28" fill="#e8f2ff" class="mono" >E[token_id]</text>
<text x="117" y="913" font-size="22" fill="#98aec9" >输入：按行查表</text>
<text x="1120" y="872" font-size="28" fill="#e8f2ff" class="mono" >hidden @ E.T</text>
<text x="1120" y="913" font-size="22" fill="#98aec9" >输出：映射回词表</text>
<path d="M605 858 H407" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<path d="M995 858 H1085" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<text x="800" y="957" font-size="23" fill="#98aec9" text-anchor="middle">tie_word_embeddings = true → 不必重复存储 lm_head.weight</text>
<path d="M64 1014 L1536 1014" fill="none" stroke="#2c425d" stroke-width="1" />
<circle cx="71" cy="1043" r="5" fill="#57e5be" filter="url(#glow)"/>
<text x="90" y="1050" font-size="22" fill="#98aec9" >本检查点：30 × 9 + 2 = 272 个张量</text>
<text x="1536" y="1050" font-size="19" fill="#59718e" class="mono" text-anchor="end">134,515,008 PARAMETERS</text>
