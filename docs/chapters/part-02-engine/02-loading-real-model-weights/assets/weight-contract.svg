<text x="94" y="324" font-size="24" fill="#98aec9" class="mono" >HF / model.layers.0.</text>
<text x="710" y="324" font-size="21" fill="#98aec9" class="mono" >OUR MODULE</text>
<text x="1260" y="324" font-size="22" fill="#98aec9" class="mono" >[out,in]</text>
