<text x="315" y="75" font-size="19" fill="#98aec9" class="mono" letter-spacing="1.5">/  COMPUTE NOTES</text>
<text x="1536" y="75" font-size="19" fill="#54dcff" class="mono" text-anchor="end" letter-spacing="1.8">02.02  /  WEIGHTS</text>
<text x="64" y="157" font-size="49" fill="#e8f2ff" font-weight="700">权重映射：名称变了，布局不能变</text>
<text x="64" y="205" font-size="25" fill="#98aec9" >HF 检查点与 nn.Linear 都按 [out,in] 存储；本节直接复制，不再转置。</text>
