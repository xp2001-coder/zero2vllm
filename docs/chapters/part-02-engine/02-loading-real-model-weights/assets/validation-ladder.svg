<path d="M930 455 V494 H1172 V528" fill="none" stroke="#ae9aff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-ae9aff)"/>
<rect x="64" y="536" width="704" height="273" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 536 H176" stroke="#6aa8ff" stroke-width="3" opacity=".95"/>
<rect x="832" y="536" width="704" height="273" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M856 536 H944" stroke="#ae9aff" stroke-width="3" opacity=".95"/>
<text x="94" y="578" font-size="24" fill="#6aa8ff" class="mono" >02 / OUR FORWARD</text>
<text x="864" y="578" font-size="24" fill="#ae9aff" class="mono" >03 / TRANSFORMERS</text>
<text x="94" y="625" font-size="30" fill="#e8f2ff" font-weight="600">LlamaDecoder</text>
<text x="864" y="625" font-size="30" fill="#e8f2ff" font-weight="600">LlamaForCausalLM</text>
<text x="94" y="671" font-size="26" fill="#98aec9" class="mono" >Embedding → Block 0 … 29</text>
<text x="94" y="713" font-size="25" fill="#98aec9" class="mono" >→ RMSNorm → logits [B,T,V]</text>
<text x="864" y="671" font-size="26" fill="#98aec9" class="mono" >Embedding → Block 0 … 29</text>
<text x="864" y="713" font-size="25" fill="#98aec9" class="mono" >→ RMSNorm → logits [B,T,V]</text>
<rect x="94" y="741" width="410" height="36" rx="18" fill="#11243b" stroke="#6aa8ff" stroke-opacity=".5"/>
<text x="299" y="765" font-size="18" fill="#6aa8ff" class="mono" text-anchor="middle">CPU FP32 / eager / no cache</text>
<rect x="864" y="741" width="410" height="36" rx="18" fill="#11243b" stroke="#ae9aff" stroke-opacity=".5"/>
<text x="1069" y="765" font-size="18" fill="#ae9aff" class="mono" text-anchor="middle">CPU FP32 / eager / no cache</text>
<path d="M416 809 V843 H800 V868" fill="none" stroke="#6aa8ff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-6aa8ff)"/>
<path d="M1184 809 V843 H800 V868" fill="none" stroke="#ae9aff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-ae9aff)"/>
<rect x="64" y="874" width="1472" height="117" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 874 H176" stroke="#57e5be" stroke-width="3" opacity=".95"/>
<text x="94" y="919" font-size="24" fill="#57e5be" class="mono" >04 / COMPARE</text>
<text x="400" y="918" font-size="28" fill="#e8f2ff" >每个输入 33 个检查点 + 独立贪心生成</text>
<text x="400" y="962" font-size="28" fill="#57e5be" class="mono" >|ours − ref| ≤ 1e−4 + 1e−4 × |ref|</text>
<path d="M64 1014 L1536 1014" fill="none" stroke="#2c425d" stroke-width="1" />
<circle cx="71" cy="1043" r="5" fill="#57e5be" filter="url(#glow)"/>
<text x="90" y="1050" font-size="22" fill="#98aec9" >本轮 3 个输入：全部阶段通过，生成 ID 一致</text>
<text x="1536" y="1050" font-size="19" fill="#59718e" class="mono" text-anchor="end">MEASURED / WINDOWS CPU</text>
</svg>
