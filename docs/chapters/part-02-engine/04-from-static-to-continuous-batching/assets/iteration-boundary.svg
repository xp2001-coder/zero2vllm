<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">先确定本轮成员，再执行模型</title><desc id="desc">一次调度的六个步骤，从边界事件到 FIFO 准入、预算规划、串行参考执行、结果收尾和下一轮。</desc>
<defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e1b"/><stop offset="1" stop-color="#101d33"/></linearGradient>
      <radialGradient id="aura"><stop stop-color="#17628b" stop-opacity=".3"/><stop offset="1" stop-color="#17628b" stop-opacity="0"/></radialGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132137"/><stop offset="1" stop-color="#0c1729"/></linearGradient>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#547698" stroke-opacity=".07"/></pattern>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="arrow-54dcff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#54dcff" stroke-width="1.5"/></marker><marker id="arrow-6aa8ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6aa8ff" stroke-width="1.5"/></marker><marker id="arrow-ae9aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ae9aff" stroke-width="1.5"/></marker><marker id="arrow-57e5be" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#57e5be" stroke-width="1.5"/></marker><marker id="arrow-ff9b99" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff9b99" stroke-width="1.5"/></marker>
    </defs>
    <style>text {font-family:'Microsoft YaHei','Noto Sans SC',sans-serif} .mono {font-family:Consolas,'Roboto Mono',monospace}</style>
    <rect width="1600" height="1060" rx="28" fill="url(#bg)"/>
    <rect width="1600" height="1060" rx="28" fill="url(#grid)"/>
    <ellipse cx="1360" cy="80" rx="580" ry="380" fill="url(#aura)"/>
<rect x="64" y="52" width="32" height="32" rx="8" fill="#102a3b" stroke="#54dcff" />
<path d="M73 61 L87 75" fill="none" stroke="#54dcff" stroke-width="2" />
<path d="M87 61 L73 75" fill="none" stroke="#54dcff" stroke-width="2" />
<text x="112" y="76" font-size="27" fill="#e8f2ff" class="mono" font-weight="700">zero2vllm</text>
<text x="315" y="75" font-size="19" fill="#98aec9" class="mono" letter-spacing="1.5">/  COMPUTE NOTES</text>
<text x="1536" y="75" font-size="19" fill="#54dcff" class="mono" text-anchor="end" letter-spacing="1.8">02.04  /  ITERATION</text>
<text x="64" y="157" font-size="49" fill="#e8f2ff" font-weight="700">先确定本轮成员，再执行模型</text>
<text x="64" y="205" font-size="25" fill="#98aec9" >资源可以在本轮释放，新请求在下一轮补位。</text>
<path d="M64 236 L1536 236" fill="none" stroke="#30455f" stroke-width="1" />
<path d="M64 236 L190 236" fill="none" stroke="#54dcff" stroke-width="2" />
<rect x="64" y="295" width="456" height="220" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 295 H176" stroke="#6aa8ff" stroke-width="3" opacity=".95"/>
<text x="90" y="339" font-size="21" fill="#6aa8ff" class="mono" >01</text>
<text x="134" y="339" font-size="27" fill="#e8f2ff" font-weight="600">边界事件</text>
<text x="90" y="395" font-size="25" fill="#e8f2ff" >接收到达请求，处理取消</text>
<text x="90" y="438" font-size="23" fill="#98aec9" >清除队列中的终态成员</text>
<rect x="572" y="295" width="456" height="220" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M596 295 H684" stroke="#54dcff" stroke-width="3" opacity=".95"/>
<text x="598" y="339" font-size="21" fill="#54dcff" class="mono" >02</text>
<text x="642" y="339" font-size="27" fill="#e8f2ff" font-weight="600">FIFO 准入</text>
<text x="598" y="395" font-size="25" fill="#e8f2ff" >检查活跃数量与可用容量</text>
<text x="598" y="438" font-size="23" fill="#98aec9" >静态组额外检查整组屏障</text>
<rect x="1080" y="295" width="456" height="220" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M1104 295 H1192" stroke="#ae9aff" stroke-width="3" opacity=".95"/>
<text x="1106" y="339" font-size="21" fill="#ae9aff" class="mono" >03</text>
<text x="1150" y="339" font-size="27" fill="#e8f2ff" font-weight="600">生成计划</text>
<text x="1106" y="395" font-size="25" fill="#e8f2ff" >prefill 按 P，decode 按 1</text>
<text x="1106" y="438" font-size="23" fill="#98aec9" >在 T 以内选择，随后冻结</text>
<rect x="1080" y="635" width="456" height="220" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M1104 635 H1192" stroke="#ae9aff" stroke-width="3" opacity=".95"/>
<text x="1106" y="679" font-size="21" fill="#ae9aff" class="mono" >04</text>
<text x="1150" y="679" font-size="27" fill="#e8f2ff" font-weight="600">执行计划</text>
<text x="1106" y="735" font-size="25" fill="#e8f2ff" >逐请求调用 lifecycle.step</text>
<text x="1106" y="778" font-size="23" fill="#98aec9" >本节使用串行参考执行器</text>
<rect x="572" y="635" width="456" height="220" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M596 635 H684" stroke="#57e5be" stroke-width="3" opacity=".95"/>
<text x="598" y="679" font-size="21" fill="#57e5be" class="mono" >05</text>
<text x="642" y="679" font-size="27" fill="#e8f2ff" font-weight="600">记录与收尾</text>
<text x="598" y="735" font-size="25" fill="#e8f2ff" >提交输出，记入边界 r+1</text>
<text x="598" y="778" font-size="23" fill="#98aec9" >终止请求由生命周期层回收</text>
<rect x="64" y="635" width="456" height="220" rx="20" fill="url(#panel)" stroke="#2b405c" />
<path d="M88 635 H176" stroke="#6aa8ff" stroke-width="3" opacity=".95"/>
<text x="90" y="679" font-size="21" fill="#6aa8ff" class="mono" >06</text>
<text x="134" y="679" font-size="27" fill="#e8f2ff" font-weight="600">下一轮</text>
<text x="90" y="735" font-size="25" fill="#e8f2ff" >移除终态成员，再检查空位</text>
<text x="90" y="778" font-size="23" fill="#98aec9" >继续使用存活请求的独立 KV</text>
<path d="M526 405 H563" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<path d="M1034 405 H1071" fill="none" stroke="#54dcff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-54dcff)"/>
<path d="M1308 521 V624" fill="none" stroke="#ae9aff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-ae9aff)"/>
<path d="M1074 745 H1037" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<path d="M566 745 H529" fill="none" stroke="#57e5be" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-57e5be)"/>
<path d="M292 628 V526" fill="none" stroke="#6aa8ff" stroke-width="2.5" opacity=".9" marker-end="url(#arrow-6aa8ff)"/>
<rect x="521" y="549" width="558" height="36" rx="18" fill="#11243b" stroke="#ae9aff" stroke-opacity=".5"/>
<text x="800" y="573" font-size="18" fill="#ae9aff" class="mono" text-anchor="middle">PLAN MEMBERSHIP IS FIXED</text>
<path d="M64 939 L1536 939" fill="none" stroke="#2c425d" stroke-width="1" />
<circle cx="71" cy="968" r="5" fill="#57e5be" filter="url(#glow)"/>
<text x="90" y="975" font-size="22" fill="#98aec9" >同一请求一轮至多推进一次；完成后不在本轮插入替补。</text>
<text x="1536" y="975" font-size="19" fill="#59718e" class="mono" text-anchor="end">r → r + 1</text>
</svg>
