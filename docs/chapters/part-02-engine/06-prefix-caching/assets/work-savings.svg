<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="695" viewBox="0 0 1200 695" role="img" aria-labelledby="title desc"><title id="title">冷缓存与热缓存的实际计算量</title><desc id="desc">默认 CPU 实验中，冷轮计算八个位置和三十六个注意力分数项；热轮复用四个位置，计算四个位置和二十六个分数项。输出相同，未测量硬件加速。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="695" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="312" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="60" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">P = 6，输出 3 项；实际需送入模型的位置总数为 8</text><text x="45" y="134" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">冷缓存</text><rect x="162" y="98" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="216" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p0</text><rect x="286" y="98" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="340" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p1</text><rect x="410" y="98" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="464" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p2</text><rect x="534" y="98" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="588" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p3</text><rect x="658" y="98" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="712" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p4</text><rect x="782" y="98" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="836" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p5</text><rect x="906" y="98" width="108" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="960" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p6</text><rect x="1030" y="98" width="108" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1084" y="136.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p7</text><text x="45" y="239" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">热缓存</text><rect x="162" y="203" width="108" height="61" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="216" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p0</text><rect x="286" y="203" width="108" height="61" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="340" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p1</text><rect x="410" y="203" width="108" height="61" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="464" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p2</text><rect x="534" y="203" width="108" height="61" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="588" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p3</text><rect x="658" y="203" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="712" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p4</text><rect x="782" y="203" width="108" height="61" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="836" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p5</text><rect x="906" y="203" width="108" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="960" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p6</text><rect x="1030" y="203" width="108" height="61" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1084" y="241.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">p7</text><text x="389" y="304" font-size="20" fill="#339c81" font-weight="600" text-anchor="middle">前 4 项：热轮直接复用</text><text x="761" y="304" font-size="19" fill="#3da8e8" font-weight="600" text-anchor="middle">提示词尾部</text><text x="1006" y="304" font-size="19" fill="#ef8e38" font-weight="600" text-anchor="middle">两次解码</text><text x="600" y="374" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 已命中的前缀跳过计算，后续查询 仍会读取完整历史</text><rect x="20" y="402" width="1160" height="218" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="48" y="447" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">计算位置：8 → 4</text><text x="637" y="447" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">单头注意力分数项：36 → 26</text><text x="48" y="489" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">冷轮：6 个提示词位置 + 2 个解码位置</text><text x="48" y="529" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">热轮：2 个提示词位置 + 2 个解码位置</text><text x="637" y="489" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">冷轮：1 + 2 + 3 + 4 + 5 + 6 + 7 + 8</text><text x="637" y="529" font-size="21" fill="#64707a" font-weight="400" text-anchor="start">热轮：5 + 6 + 7 + 8</text><text x="600" y="584" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">两轮输出均为 [12, 3, 8]；这些计数不是耗时或吞吐量</text><text x="600" y="663" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 计算位置减少一半，不能直接推断服务速度翻倍</text></g></svg>