<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">整块命中与最后位置的前向计算</title><desc id="desc">六个提示词 token 已有缓存，但只复用前四个，重新计算最后两个。按完整块复用且至少留下一个输入时，命中上界为 B 乘 floor((P-1)/B)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="640" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="248" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">相同提示词再来一次：P = 6，B = 2</text><rect x="87" y="94" width="305" height="70" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="239.5" y="138.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">[1, 2]</text><text x="239" y="201" font-size="22" fill="#3da8e8" font-weight="600" text-anchor="middle">直接复用 K/V</text><rect x="446" y="94" width="305" height="70" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="598.5" y="138.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">[3, 4]</text><text x="598" y="201" font-size="22" fill="#3da8e8" font-weight="600" text-anchor="middle">直接复用 K/V</text><rect x="805" y="94" width="305" height="70" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="957.5" y="138.45" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">[5, 6]</text><text x="957" y="201" font-size="22" fill="#ef8e38" font-weight="600" text-anchor="middle">重新计算这一块</text><text x="600" y="242" font-size="21" fill="#64707a" font-weight="400" text-anchor="middle">缓存只有 K/V；仍需最后一个提示词位置的前向结果来预测第一个输出</text><text x="600" y="309" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 整块复用 + 至少留一个输入，本例最终复用 4 个位置</text><rect x="20" y="335" width="550" height="230" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="593" y="335" width="587" height="230" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="376" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">可复用长度的上界</text><text x="295" y="431" font-size="27" fill="#22262b" font-weight="500" text-anchor="middle">M ≤ B × floor((P − 1) / B)</text><text x="45" y="479" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">缓存足够且前缀完全一致时取等号。</text><text x="45" y="508" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">中途遇到未命中，匹配就停止。</text><text x="620" y="376" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">B = 2：边界两侧的变化</text><rect x="621" y="395" width="145" height="42" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="693.5" y="422.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">P</text><rect x="774" y="395" width="80" height="42" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="814" y="423.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">5</text><rect x="862" y="395" width="80" height="42" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="902" y="423.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">6</text><rect x="950" y="395" width="80" height="42" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="990" y="423.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">7</text><rect x="1038" y="395" width="80" height="42" rx="6" fill="#eef0f2" stroke="#22262b" stroke-width="1.4" /><text x="1078" y="423.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">8</text><rect x="621" y="444" width="145" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="693.5" y="471.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">复用 M</text><rect x="774" y="444" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="814" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">4</text><rect x="862" y="444" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="902" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">4</text><rect x="950" y="444" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="990" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">6</text><rect x="1038" y="444" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="1078" y="472.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">6</text><rect x="621" y="493" width="145" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="693.5" y="520.3" font-size="18" fill="#22262b" font-weight="500" text-anchor="middle">重算 P−M</text><rect x="774" y="493" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="814" y="521.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="862" y="493" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="902" y="521.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="950" y="493" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="990" y="521.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="1038" y="493" width="80" height="42" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="1078" y="521.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">2</text><text x="600" y="607" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) K/V 命中长度与最后位置的 logits 需求要一起考虑</text></g></svg>