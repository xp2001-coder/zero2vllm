<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="679" viewBox="0 0 1200 679" role="img" aria-labelledby="title desc"><title id="title">两个请求共享前缀 K/V</title><desc id="desc">B=2，A 和 B 的前四个 token 相同，共享物理块 0、1，其引用计数为 2。后缀块和未来预留块由各请求独占。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="679" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="240" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="59" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">同一个开头，不同的后续问题</text><text x="55" y="119" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">请求 A</text><rect x="198" y="85" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="257.5" y="120.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="337" y="85" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="396.5" y="120.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="476" y="85" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="535.5" y="120.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="615" y="85" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="674.5" y="120.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">4</text><rect x="754" y="85" width="119" height="54" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="813.5" y="120.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">5</text><rect x="893" y="85" width="119" height="54" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="952.5" y="120.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">6</text><text x="55" y="193" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">请求 B</text><rect x="198" y="159" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="257.5" y="194.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">1</text><rect x="337" y="159" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="396.5" y="194.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">2</text><rect x="476" y="159" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="535.5" y="194.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">3</text><rect x="615" y="159" width="119" height="54" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="674.5" y="194.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">4</text><rect x="754" y="159" width="119" height="54" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="813.5" y="194.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">9</text><rect x="893" y="159" width="119" height="54" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="952.5" y="194.4" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">10</text><text x="451" y="239" font-size="19" fill="#3da8e8" font-weight="600" text-anchor="middle">相同的 4 个 token：可共享两个完整块</text><text x="975" y="239" font-size="19" fill="#ef8e38" font-weight="600" text-anchor="middle">不同后缀：分别计算</text><text x="600" y="301" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 按 token ID 匹配连续前缀，块大小 B = 2</text><rect x="20" y="325" width="1160" height="280" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="365" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">物理块只保存一份 K/V，两个请求的块表共同指向它</text><rect x="85" y="421" width="205" height="70" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="187.5" y="463.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">块 0：[1, 2]</text><rect x="358" y="421" width="205" height="70" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="460.5" y="463.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">块 1：[3, 4]</text><path d="M297,456 L345,456" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M570,456 L630,456 L630,420 L698,420" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M630,456 L630,523 L698,523" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="711" y="389" width="280" height="60" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="851" y="426.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">A 私有块 2：[5, 6]</text><rect x="711" y="493" width="280" height="60" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="851" y="530.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">B 私有块 4：[9, 10]</text><text x="187" y="533" font-size="20" fill="#3da8e8" font-weight="600" text-anchor="middle">引用计数 = 2</text><text x="459" y="533" font-size="20" fill="#3da8e8" font-weight="600" text-anchor="middle">引用计数 = 2</text><text x="1024" y="426" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">refs = 1</text><text x="1024" y="530" font-size="19" fill="#64707a" font-weight="400" text-anchor="start">refs = 1</text><text x="600" y="580" font-size="19" fill="#64707a" font-weight="400" text-anchor="middle">完整块表：A = [0, 1, 2, 3]，B = [0, 1, 4, 5]；块 3、5 为后续生成预留</text><text x="600" y="646" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 共享前缀块，私有后缀块与未来预留块分开管理</text></g></svg>