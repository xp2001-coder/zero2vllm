<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="679" viewBox="0 0 1200 679" role="img" aria-labelledby="title desc"><title id="title">共享块引用计数与缓存留存</title><desc id="desc">共享块随请求加入和结束经历引用计数 1、2、1、0。零引用的完整块可留存缓存，再次命中时重新引用；容量不足时才从索引逐出并复用物理空间。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="679" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="216" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="59" font-size="25" fill="#22262b" font-weight="600" text-anchor="start">同一个共享块：请求的使用权如何变化</text><rect x="63" y="90" width="280" height="53" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="203" y="124.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">A 使用</text><text x="203" y="192" font-size="26" fill="#3da8e8" font-weight="600" text-anchor="middle">refs = 1</text><path d="M353,117 L448,117" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="462" y="90" width="280" height="53" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="602" y="124.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">A、B 同时使用</text><text x="602" y="192" font-size="26" fill="#3da8e8" font-weight="600" text-anchor="middle">refs = 2</text><path d="M752,117 L847,117" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="861" y="90" width="280" height="53" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="1001" y="124.2" font-size="22" fill="#22262b" font-weight="500" text-anchor="middle">A 结束，B 继续</text><text x="1001" y="192" font-size="26" fill="#3da8e8" font-weight="600" text-anchor="middle">refs = 1</text><text x="600" y="278" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 任意请求仍在使用时，该块都不能被逐出</text><rect x="20" y="305" width="1160" height="298" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="56" y="415" width="285" height="84" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="198.5" y="465.05" font-size="23" fill="#22262b" font-weight="500" text-anchor="middle">B 结束：refs = 0</text><text x="198" y="539" font-size="20" fill="#339c81" font-weight="600" text-anchor="middle">完整 K/V 留在缓存索引中</text><path d="M350,457 L439,457 L439,383 L565,383" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M439,457 L439,529 L565,529" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="579" y="349" width="536" height="71" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="847" y="392.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">再次命中 → refs = 1，继续复用</text><rect x="579" y="494" width="536" height="71" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="847" y="537.9" font-size="24" fill="#22262b" font-weight="500" text-anchor="middle">容量紧张 → 删除索引，改作他用</text><text x="847" y="455" font-size="20" fill="#64707a" font-weight="400" text-anchor="middle">无活跃引用：可以留存，也可以被回收</text><text x="600" y="646" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(b) 请求结束、缓存留存、物理块逐出是三个不同动作</text></g></svg>