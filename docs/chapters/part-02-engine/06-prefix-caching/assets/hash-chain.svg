<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="702" viewBox="0 0 1200 702" role="img" aria-labelledby="title desc"><title id="title">前缀哈希链与精确匹配</title><desc id="desc">当前块的 token 一样并不足以复用；摘要关联父摘要和计算上下文。教学实现还保存完整前缀与命名空间，强制哈希碰撞测试不会造成错误命中。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#22262b"/></marker></defs><rect width="1200" height="702" fill="white"/><g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', 'PingFang SC', Arial, sans-serif"><rect x="20" y="20" width="1160" height="114" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="61" font-size="24" fill="#22262b" font-weight="600" text-anchor="start">计算上下文：固定权重身份 + dtype + 位置规则 + 共享域标识</text><text x="45" y="103" font-size="22" fill="#64707a" font-weight="400" text-anchor="start">每一块的摘要还包含：前一块摘要，以及当前块的 token ID</text><rect x="20" y="154" width="1160" height="299" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="46" y="230" font-size="21" fill="#22262b" font-weight="600" text-anchor="start">请求 A</text><rect x="152" y="189" width="174" height="62" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="239" y="227.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">[1, 2]</text><path d="M334,220 L384,220" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="397" y="189" width="165" height="62" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="479.5" y="226.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">父摘要 hA0</text><path d="M570,220 L620,220" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="633" y="189" width="174" height="62" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="720" y="227.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">[5, 6]</text><path d="M815,220 L865,220" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="878" y="189" width="253" height="62" rx="6" fill="#e7f4fd" stroke="#22262b" stroke-width="1.4" /><text x="1004.5" y="227" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">结果摘要 hA1</text><text x="46" y="358" font-size="21" fill="#22262b" font-weight="600" text-anchor="start">请求 B</text><rect x="152" y="317" width="174" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="239" y="355.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">[3, 4]</text><path d="M334,348 L384,348" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="397" y="317" width="165" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="479.5" y="354.65" font-size="19" fill="#22262b" font-weight="500" text-anchor="middle">父摘要 hB0</text><path d="M570,348 L620,348" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="633" y="317" width="174" height="62" rx="6" fill="#e6f5ef" stroke="#22262b" stroke-width="1.4" /><text x="720" y="355.35" font-size="21" fill="#22262b" font-weight="500" text-anchor="middle">[5, 6]</text><path d="M815,348 L865,348" fill="none" stroke="#22262b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="878" y="317" width="253" height="62" rx="6" fill="#fff0df" stroke="#22262b" stroke-width="1.4" /><text x="1004.5" y="355" font-size="20" fill="#22262b" font-weight="500" text-anchor="middle">结果摘要 hB1</text><text x="600" y="492" font-size="23" fill="#22262b" font-weight="600" text-anchor="middle">(a) 当前块相同、历史不同，不能复用同一份上下文缓存</text><rect x="20" y="518" width="1160" height="157" rx="10" fill="white" stroke="#b9c2c8" stroke-width="1.4" stroke-dasharray="4 4"/><text x="45" y="560" font-size="23" fill="#22262b" font-weight="600" text-anchor="start">测试中故意让摘要全部相同</text><text x="45" y="601" font-size="24" fill="#22262b" font-weight="500" text-anchor="start">摘要命中 → 核对完整前缀与共享域 → 一致才复用</text><text x="45" y="642" font-size="20" fill="#64707a" font-weight="400" text-anchor="start">本节保存精确前缀作为碰撞校验，方便验证；额外元数据开销不代表生产实现。</text></g></svg>