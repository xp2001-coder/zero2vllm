[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "zero2vllm"
version = "0.1.0.dev0"
description = "Learn LLM inference with CPU reference experiments and CUDA/MACA deployment tracks"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serving = ["uvicorn==0.35.0"]
# Install the CPU wheel using the official index in lesson 2.1.
torch = ["torch==2.7.1", "numpy==2.2.6"]
checkpoint = ["torch==2.7.1", "numpy==2.2.6", "transformers==4.51.3", "safetensors==0.5.3", "huggingface-hub==0.30.2", "tokenizers==0.21.1"]

[project.scripts]
zero2vllm = "zero2vllm.cli:main"

[tool.setuptools.packages.find]
include = ["zero2vllm*"]
